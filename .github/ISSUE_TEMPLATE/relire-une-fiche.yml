name: Relire une fiche (relecteur nommé)
description: Vous êtes spécialiste du domaine et acceptez que votre nom soit affiché sur la fiche relue.
title: "[relecture] "
labels: ["relecture"]
body:
  - type: markdown
    attributes:
      value: |
        Une fiche n'est marquée « relue » que par une personne **nommée**, avec la date. Votre relecture peut conclure à « rien à corriger » : c'est utile aussi. Vous restez libre de retirer votre nom.
  - type: input
    id: question
    attributes:
      label: Fiche(s) que vous relisez
    validations:
      required: true
  - type: input
    id: nom
    attributes:
      label: Nom tel qu'il sera affiché
    validations:
      required: true
  - type: input
    id: orcid
    attributes:
      label: Identifiant ORCID (recommandé)
  - type: textarea
    id: retour
    attributes:
      label: Vos remarques
      description: Pour chaque point, dites s'il est exact, à corriger ou faux, avec une source.
