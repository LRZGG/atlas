# Met à jour chaque semaine « ce qui bouge » (articles des 30 derniers jours par sujet, OpenAlex), reconstruit le site et enregistre le contrôle des fiches.
# À faire une fois : ajouter la clé OpenAlex dans Settings → Secrets and variables → Actions → New repository secret, nom OPENALEX_API_KEY.
name: Frontière de la semaine
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frontiere
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Articles des 30 derniers jours
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: node fetch-recent.mjs
      - name: Contrôle des fiches
        run: node verifier-fiches.mjs
      - name: Reconstruire le site
        run: BASE=https://unknownpedia.org node build-directions.mjs
      - name: Enregistrer
        run: |
          git config user.name "unknownpedia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add recent.json controle docs
          git diff --cached --quiet || (git commit -m "Frontière de la semaine : mise à jour automatique" && git push)
