<title>Carte de l'inconnu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Spectral:ital,wght@0,300;0,400;1,400&display=swap">
<style>
/* Layout : la carte occupe tout l'écran. Le relief (densité de recherche) est le sol, les étoiles (sujets) sont posées dessus, les commandes flottent dans les coins. Un seul univers, sombre par choix : c'est un ciel. */
:root {
  color-scheme: dark;
  --void: #06080d;
  --panel: #0c1018;
  --line: #232c3b;
  --fg: #e9ecf2;
  --dim: #94a0b4;
  --question: #f3dfb2;
  --d0: #7fa6e0; --d1: #74c2a0; --d2: #dc8d7c; --d3: #cfae63;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--fg); font: 14.5px/1.5 var(--sans); overflow: hidden; }
#stage { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#brand { position: absolute; top: 20px; left: max(20px, env(safe-area-inset-left, 0px)); max-width: min(400px, 62vw); pointer-events: none; transition: opacity .3s; }
h1 { font: 300 clamp(26px, 3.4vw, 46px)/1 var(--serif); letter-spacing: -0.012em; margin: 0; }
#brand p { margin: 10px 0 0; color: var(--dim); }
button, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; transition: border-color .15s; }
button:hover { border-color: var(--dim); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
svg { display: block; }
#side { position: absolute; top: 20px; right: max(20px, env(safe-area-inset-right, 0px)); background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 14px; font-size: 13.5px; }
#key { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
#key li, #side label { display: flex; align-items: center; gap: 9px; }
#key i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#key i.ring { box-sizing: border-box; width: 11px; height: 11px; margin-left: -1px; border: 1.75px solid var(--question); }
#card a { color: var(--question); }
#cSrc { margin-top: 10px; }
#cUnit { color: var(--fg); font-size: 14.5px; margin-top: 10px; }
#layers { display: grid; gap: 5px; border-top: 1px solid var(--line); padding-top: 12px; }
#zoom { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; }
#zoom button { width: 38px; height: 38px; display: grid; place-items: center; }
#card { position: absolute; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100% - 40px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); padding: 18px 18px 16px; }
#card h2 { font: 400 23px/1.15 var(--serif); margin: 0 30px 6px 0; text-wrap: balance; }
#card p { margin: 0; color: var(--dim); font-size: 13.5px; }
#cCount { font: 300 30px/1 var(--serif); color: var(--fg); margin: 14px 0 2px; font-variant-numeric: tabular-nums; }
#cLinks { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13.5px; }
#cLinks li { padding: 4px 0; border-top: 1px solid var(--line); }
#close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; display: grid; place-items: center; }
#tip { position: absolute; pointer-events: none; background: var(--void); border: 1px solid var(--dim); padding: 6px 10px; font-size: 13px; line-height: 1.35; max-width: 250px; }
#tip b { display: block; font-weight: 500; }
#tip span { color: var(--dim); }
@media (max-height: 760px) and (min-width: 721px) { body:has(#card:not([hidden])) #side { display: none; } }
@media (max-width: 720px) {
  #brand { top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: none; right: 16px; }
  #brand p { font-size: 13px; }
  #side { top: auto; right: auto; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; gap: 8px; font-size: 12.5px; }
  #layers { padding-top: 8px; grid-auto-flow: column; gap: 14px; }
  #key { grid-template-columns: 1fr 1fr; gap: 3px 14px; }
  #zoom { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  #card { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<div id="stage">
  <canvas id="c" role="img" aria-label="Carte de la recherche mondiale. Le relief coloré montre où l'on publie beaucoup, chaque étoile est un sujet de recherche, les zones noires sont celles où presque personne ne travaille."></canvas>
  <div id="brand"><h1>Carte de l'inconnu</h1><p><span id="nT"></span> sujets de recherche réels et <span id="nQ"></span> grandes questions ouvertes. Clique un anneau pour lire une question. Attrape une étoile et tire : ce qui lui est lié suit.</p></div>
  <div id="side">
    <ul id="key"></ul>
    <div id="layers">
      <label><input id="lRelief" type="checkbox" checked> Relief</label>
      <label><input id="lStars" type="checkbox" checked> Étoiles</label>
      <label><input id="lQ" type="checkbox" checked> Questions</label>
    </div>
  </div>
  <div id="zoom">
    <button id="zin" aria-label="Zoomer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg></button>
    <button id="zout" aria-label="Dézoomer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8h12"/></svg></button>
    <button id="zfit" aria-label="Voir toute la carte"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  </div>
  <div id="card" hidden>
    <button id="close" aria-label="Fermer la fiche"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    <h2 id="cName"></h2>
    <p id="cWhere"></p>
    <div id="cCount"></div>
    <p id="cUnit"></p>
    <p id="cSrc" hidden><a id="cLink" target="_blank" rel="noopener"></a></p>
    <p id="cListT" style="margin-top:14px"></p>
    <ul id="cLinks"></ul>
  </div>
  <div id="tip" hidden></div>
</div>

<script>

{ const li = document.createElement('li'), d = document.createElement('i'); d.className = 'ring'; li.append(d, 'Question ouverte'); $('key').appendChild(li); }

// Le relief : la densité de recherche, calculée une fois puis posée sous les étoiles.

const cv = $('c'), ctx = cv.getContext('2d');

function pick(px, py) { if (!$('lStars').checked) return -1; let best = -1, bd = 170; for (let i = 0; i < N; i++) { const dx = tx(i) - px, dy = ty(i) - py, d = dx * dx + dy * dy - V[i] * 30; if (d < bd) { bd = d; best = i; } } return best; }
