<title>Unknownpedia</title>
<style>
/* Direction "patent plate": the research map as a technical drawing sheet. Light: ink on paper, carmine for the unknown. Dark: the same sheet in negative, everything that stands out is white. Free (OFL) fonts, self-hosted. */
@font-face { font-family: "IM Fell DW Pica"; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/imfell.woff2) format("woff2"); }
@font-face { font-family: "IM Fell DW Pica"; font-style: italic; font-weight: 400; font-display: swap; src: url(/fonts/imfell-italic.woff2) format("woff2"); }
@font-face { font-family: "Archivo Narrow"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/archivo-narrow.woff2) format("woff2"); }
@font-face { font-family: "Archivo Narrow"; font-style: italic; font-weight: 400; font-display: swap; src: url(/fonts/archivo-narrow-italic.woff2) format("woff2"); }
:root { --paper: #ece5d5; --surface: #e3dac6; --ink: #171e29; --ink-rgb: 23,30,41; --dim: #525965; --acc: #a5242c; --gold: #7c6434; --f: 1; --serif: "IM Fell DW Pica", Georgia, serif; --sans: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif; color-scheme: light; }
:root[data-theme="dark"] { --paper: #0b111c; --surface: #111929; --ink: #e5decb; --ink-rgb: 229,222,203; --dim: #8f9bb0; --acc: #e36246; --gold: #c9b98b; --f: .78; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 13px/1.4 var(--sans); overflow: hidden; }
#sheet { position: fixed; inset: 0; }
#frame { position: absolute; inset: 12px; border: 1.6px solid var(--ink); pointer-events: none; }
#frame::after { content: ""; position: absolute; inset: 5px; border: .6px solid var(--ink); }
#c { position: absolute; inset: 20px; width: calc(100% - 40px); height: calc(100% - 40px); touch-action: none; cursor: crosshair; }
.ov { position: absolute; z-index: 2; }
#ctx { left: 36px; top: 34px; width: 240px; transition: opacity .25s; pointer-events: none; }
#ctx h1 { font: 400 16px var(--serif); letter-spacing: .22em; margin: 0 0 8px; text-transform: uppercase; }
#ctx p { margin: 0; color: var(--dim); }
#legend { right: 34px; top: 30px; width: 222px; background: var(--paper); border: .8px solid var(--ink); }
#legend summary { cursor: pointer; padding: 6px 10px; letter-spacing: .08em; text-transform: uppercase; }
#legend .scroll { max-height: min(58vh, 520px); overflow: auto; padding: 0 10px 10px; }
#legend h2 { font: 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 8px 0 4px; }
#legend ol, #legend ul { margin: 0; padding: 0; list-style: none; }
#legend li { margin: 0; }
#legend li button { all: unset; box-sizing: border-box; display: flex; gap: 8px; width: 100%; padding: 1px 0; cursor: pointer; }
#legend li button:hover span { text-decoration: underline; }
#legend li button:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
#legend li b { font-weight: 400; width: 20px; text-align: right; flex: none; }
#lang { right: 270px; top: 30px; display: flex; }
#ctl { right: auto; left: 50%; transform: translateX(-50%); bottom: 8px; display: flex; background: var(--paper); }
button.sq { font: 14px var(--sans); color: var(--ink); background: var(--paper); border: .8px solid var(--ink); border-radius: 0; width: 30px; height: 30px; cursor: pointer; padding: 0; }
#lang button.sq { width: 34px; font-size: 12px; letter-spacing: .06em; }
#lang button + button { border-left: 0; }
button.sq:hover, #lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#tl { left: 34px; bottom: 76px; display: flex; gap: 8px; align-items: center; background: var(--paper); border: .8px solid var(--ink); padding: 4px 8px; }
#tl input { width: 190px; accent-color: var(--ink); }
#tl #tll { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; min-width: 150px; }
#tl button.sq { width: 26px; height: 26px; font-size: 12px; }
@media (max-width: 720px) { #tl { left: 30px; right: 30px; bottom: 80px; } #tl input { flex: 1; width: auto; } }
#search { left: 50%; top: 26px; transform: translateX(-50%); width: min(340px, calc(100% - 520px)); z-index: 6; }
#sq { width: 100%; font: 14px var(--sans); letter-spacing: .04em; color: var(--ink); background: var(--paper); border: .8px solid var(--ink); border-radius: 0; padding: 7px 10px; }
#sq::placeholder { color: var(--dim); }
#sq:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#sres { list-style: none; margin: 4px 0 0; padding: 0; background: var(--paper); border: .8px solid var(--ink); max-height: min(60vh, 420px); overflow: auto; }
#sres li { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; cursor: pointer; font-size: 14px; border-bottom: .5px solid rgba(var(--ink-rgb), .25); }
#sres li:last-child { border-bottom: 0; }
#sres li small { flex: none; width: 78px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#sres li[aria-selected="true"], #sres li:hover { background: var(--ink); color: var(--paper); }
#sres li[aria-selected="true"] small, #sres li:hover small { color: var(--paper); }
#sres .q { font-family: var(--serif); font-size: 15px; }
@media (max-width: 1000px) { #search { left: 30px; transform: none; top: 100px; width: calc(100% - 60px); max-width: 360px; } }
#rndbtn { position: absolute; z-index: 2; right: 190px; top: 30px; width: auto; padding: 0 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
#stbtn { position: absolute; z-index: 2; right: 346px; top: 30px; width: auto; padding: 0 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
@media (max-width: 720px) { #stbtn { right: auto; left: 30px; top: 92px; } }
/* ---- Claims verification register & margin/colophon entry points ---- */
.rungs-track { display: inline-block; vertical-align: middle; flex: none; overflow: visible; }
.rg-svg { display: block; flex: none; }

#clRailList button { position: relative; display: block; width: 100%; padding: 7px 1px 7px 0; text-align: left; border: 0; border-bottom: 1px solid var(--rule); color: var(--ink); background: transparent; cursor: pointer; }

.crl-m { display: flex; align-items: center; gap: 8px; font: 11.5px/1 var(--sans); color: var(--dim); font-variant-numeric: tabular-nums; }
.crl-m .crl-d { margin-left: auto; }
#clDock { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 5px 10px; border: 1px solid var(--rule); font: 12.5px/1.2 var(--sans); letter-spacing: .04em; color: var(--ink); background: transparent; white-space: nowrap; }
#clDock { display: none; }
#clDock:hover, #clDock[aria-expanded="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

#clDock .cld-n { font-variant-numeric: tabular-nums; color: var(--dim); padding-left: 7px; border-left: 1px solid var(--rule); }
#panel .ia-lad-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border: 1px solid var(--rule); background: rgba(var(--ink-rgb), .025); padding: 8px 10px; margin: 8px 0 10px; }
#panel .ia-lad-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
#panel .ia-lad-box .lnk { font-size: 12.5px; letter-spacing: .04em; color: var(--ink); }
#claims { position: fixed; z-index: 12; inset: clamp(10px, 1.8vw, 24px); background: var(--paper); border: 1.5px solid var(--ink); box-shadow: 0 0 0 100vmax rgba(var(--ink-rgb), .24), 0 18px 48px rgba(var(--ink-rgb), .18); display: flex; flex-direction: column; overflow: hidden; }
#claims:focus { outline: none; }

#claims .cl-head { position: relative; flex: none; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding: clamp(14px, 2vw, 24px) clamp(54px, 5vw, 68px) clamp(12px, 1.6vw, 18px) clamp(18px, 3vw, 36px); border-bottom: 3px double var(--ink); }
#claims .cl-kicker { margin: 0 0 3px; font: 500 11.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }

#claims .cl-bar button:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
#claims .cl-body { flex: 1; min-height: 0; display: grid; grid-template-columns: clamp(300px, 31vw, 385px) minmax(0, 1fr); overflow: hidden; }

#claims .cl-back:hover { text-decoration: underline; }

#daily .df-head { position: relative; flex: none; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; padding: clamp(14px, 2vw, 22px) clamp(54px, 5vw, 68px) clamp(12px, 1.5vw, 16px) clamp(18px, 3vw, 36px); border-bottom: 3px double var(--ink); }
#daily .df-kicker { margin: 0 0 3px; font: 500 11.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--acc); }
#daily .df-head h2 { font: 400 clamp(24px, 2.7vw, 38px)/1.05 var(--serif); letter-spacing: -.035em; margin: 0; }
#daily .df-hmeta { display: flex; align-items: center; gap: 10px; font: 500 12px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
#daily .df-hmeta span { padding: 5px 10px; border: 1px solid var(--rule); background: rgba(var(--ink-rgb), .02); }
#daily .df-hmeta b { color: var(--ink); font-weight: 600; }
#daily #dfclose { position: absolute; right: clamp(12px, 1.8vw, 22px); top: clamp(12px, 1.8vw, 20px); width: 34px; height: 34px; font-size: 20px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
#daily #dfclose:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#daily .df-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 clamp(18px, 3vw, 36px); border-bottom: 1px solid var(--rule); background: rgba(var(--ink-rgb), .02); }
#daily .df-bar::-webkit-scrollbar { display: none; }
#daily .df-tabs { display: flex; align-items: center; }
#daily .df-tabs button { all: unset; cursor: pointer; padding: 10px 14px; font: 500 12.5px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
#daily .df-tabs button:hover { color: var(--ink); }
#daily .df-tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
#daily .df-tabs button:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
#daily .df-inf-pills { display: flex; gap: 6px; padding: 6px 0; }
#daily .df-inf-pills button { all: unset; cursor: pointer; padding: 4px 9px; border: 1px solid var(--rule); font: 500 11px/1.2 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
#daily .df-inf-pills button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#daily .df-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: clamp(18px, 3vw, 34px) clamp(16px, 3.2vw, 40px) 44px; scrollbar-width: thin; scrollbar-color: var(--ink) var(--paper); }
#daily .df-scroll::-webkit-scrollbar { width: 8px; }
#daily .df-scroll::-webkit-scrollbar-track { background: transparent; border-left: .6px solid var(--rule); }
#daily .df-scroll::-webkit-scrollbar-thumb { background: var(--ink); border: 2px solid var(--paper); }
#daily .df-wrap { max-width: 860px; margin: 0 auto; }
#daily .df-prog { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin: 0 0 22px; padding: 10px 8px; border: 1px solid var(--rule); background: rgba(var(--ink-rgb), .015); }
#daily .df-prog::before { content: ""; position: absolute; left: 10%; right: 10%; top: 20px; height: 1px; background: var(--rule); z-index: 0; }
#daily .df-pst { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); letter-spacing: .05em; text-transform: uppercase; }
#daily .df-pdot { width: 20px; height: 20px; border-radius: 50%; border: 1.2px solid var(--rule); background: var(--paper); display: grid; place-items: center; font: 700 10.5px/1 var(--sans); color: var(--dim); }
#daily .df-pst.cur .df-pdot { border-color: var(--ink); border-width: 1.8px; color: var(--ink); box-shadow: 0 0 0 3px var(--paper); }
#daily .df-pst.cur { color: var(--ink); font-weight: 600; }
#daily .df-pst.ok .df-pdot { background: var(--ink); border-color: var(--ink); color: var(--paper); }
#daily .df-pst.ko .df-pdot { border-color: var(--acc); color: var(--acc); }
#daily .df-pst.bet .df-pdot { background: var(--acc); border-color: var(--acc); color: var(--paper); }
#daily .df-card { border: 1px solid var(--ink); background: rgba(var(--ink-rgb), .018); padding: clamp(20px, 3vw, 34px) clamp(18px, 3.2vw, 38px); }
#daily .df-eyebrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 14px; font: 500 11.5px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 16px; }
#daily .df-eyebrow .acc { color: var(--acc); }
#daily .df-sub { margin: 0 0 12px; font-size: 14px; color: var(--dim); }
#daily .df-q { font: 400 clamp(24px, 3vw, 38px)/1.16 var(--serif); letter-spacing: -.025em; margin: 0 0 24px; text-wrap: balance; color: var(--ink); }
#daily .df-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
#daily .df-choice { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 20px; border: 1.2px solid var(--ink); background: var(--paper); color: var(--ink); transition: background .12s, transform .1s; position: relative; }
#daily .df-choice:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
#daily .df-choice:hover:not(:disabled) .df-csym, #daily .df-choice:hover:not(:disabled) small, #daily .df-choice:hover:not(:disabled) .df-ckey { color: var(--paper); border-color: rgba(255,255,255,.35); }
#daily .df-choice:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#daily .df-choice:disabled { cursor: default; }
#daily .df-csym { font: 700 34px/1 var(--serif); color: var(--ink); }
#daily .df-choice.is-open-opt .df-csym { color: var(--acc); }
#daily .df-choice strong { font: 600 16.5px/1.2 var(--sans); letter-spacing: .02em; }
#daily .df-choice small { font: 400 13px/1.3 var(--sans); color: var(--dim); }
#daily .df-ckey { position: absolute; right: 12px; top: 12px; width: 20px; height: 20px; border: 1px solid var(--rule); font: 500 11px/18px var(--sans); text-align: center; color: var(--dim); }
#daily .df-choice.is-true { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#daily .df-choice.is-true .df-csym, #daily .df-choice.is-true small, #daily .df-choice.is-true .df-ckey { color: var(--paper); }
#daily .df-choice.is-wrong { border-color: var(--acc); background: rgba(var(--ink-rgb), .04); opacity: .78; }
#daily .df-choice.is-dim { opacity: .45; }
#daily .df-vs-grid { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
#daily .df-vs-badge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: var(--paper); border: 1.2px solid var(--ink); display: grid; place-items: center; font: italic 400 13px/1 var(--serif); color: var(--ink); pointer-events: none; }
#daily .df-vtopic { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 158px; padding: 18px 22px; border: 1.2px solid var(--ink); background: var(--paper); color: var(--ink); transition: background .12s; position: relative; }
#daily .df-vtopic:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
#daily .df-vtopic:hover:not(:disabled) small, #daily .df-vtopic:hover:not(:disabled) .df-ckey { color: var(--paper); }
#daily .df-vtopic:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#daily .df-vtopic:disabled { cursor: default; }
#daily .df-vtopic strong { font: 400 clamp(19px, 2vw, 24px)/1.2 var(--serif); padding-right: 24px; }
#daily .df-vtopic small { font: 500 11px/1.3 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
#daily .df-vtopic.is-true { border-width: 2px; border-color: var(--ink); background: rgba(var(--ink-rgb), .045); }
#daily .df-vtopic.is-wrong { border-color: var(--acc); opacity: .75; }
#daily .df-vnum { font: 400 clamp(24px, 2.5vw, 32px)/1 var(--serif); font-variant-numeric: tabular-nums; color: var(--ink); }
#daily .df-vbar { display: block; height: 5px; background: rgba(var(--ink-rgb), .12); margin: 6px 0 4px; }
#daily .df-vbar i { display: block; height: 100%; background: var(--ink); }
#daily .df-vtopic.is-true .df-vbar i { background: var(--acc); }
#daily .df-vfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#daily .df-vfoot .sp-svg { width: 76px; height: 20px; display: block; }
#daily .df-rev { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--ink); animation: df-in .18s ease-out both; }
@keyframes df-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #daily .df-rev { animation: none; } }
#daily .df-verdict { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 14px; margin-bottom: 10px; }
#daily .df-verdict b { font: 600 15px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; }
#daily .df-verdict.ok b { color: var(--ink); }
#daily .df-verdict.ko b { color: var(--acc); }
#daily .df-rev p { margin: 0 0 14px; font-size: 15px; line-height: 1.56; color: var(--ink); max-width: 68ch; }
#daily .df-cl-strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 9px 12px; border: 1px solid var(--rule); border-left: 3px solid var(--acc); background: var(--paper); margin: 0 0 14px; font-size: 13px; color: var(--dim); }
#daily .df-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
#daily .df-btn-p { all: unset; cursor: pointer; padding: 9px 18px; border: 1.2px solid var(--ink); background: var(--ink); color: var(--paper); font: 500 13px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
#daily .df-btn-p:hover { background: var(--paper); color: var(--ink); }
#daily .df-btn-s { all: unset; cursor: pointer; padding: 8px 13px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 500 12.5px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
#daily .df-btn-s:hover { border-color: var(--ink); background: rgba(var(--ink-rgb), .05); }
#daily .df-btn-p:focus-visible, #daily .df-btn-s:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
#daily .df-acts .df-btn-p { margin-left: auto; }
#daily .df-bet-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin: 18px 0 22px; }
#daily .df-bet-ctrl output { font: 400 44px/1 var(--serif); font-variant-numeric: tabular-nums; min-width: 96px; color: var(--ink); }
#daily .df-bet-sl { flex: 1 1 220px; min-width: 180px; }
#daily .df-bet-sl input[type=range] { width: 100%; height: 28px; margin: 0; background: none; appearance: none; cursor: ew-resize; }
#daily .df-bet-sl input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--ink); }
#daily .df-bet-sl input[type=range]::-webkit-slider-thumb { appearance: none; width: 14px; height: 24px; background: var(--paper); border: 1.6px solid var(--ink); margin-top: -11px; border-radius: 0; }
#daily .df-bet-sl input[type=range]::-moz-range-track { height: 2px; background: var(--ink); }
#daily .df-bet-sl input[type=range]::-moz-range-thumb { width: 14px; height: 24px; background: var(--paper); border: 1.6px solid var(--ink); border-radius: 0; }
#daily .df-bet-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
#daily .df-kb { margin: 14px 0 0; font-size: 12px; color: var(--dim); text-align: center; }
#daily .df-done-card { border-top: 3px double var(--ink); border-bottom: 3px double var(--ink); padding: 24px 0; margin-bottom: 24px; text-align: center; }
#daily .df-done-card h3 { font: 400 clamp(26px, 3vw, 38px)/1.1 var(--serif); margin: 0 0 6px; }
#daily .df-done-card > p { margin: 0 0 18px; font-size: 14px; color: var(--dim); }
#daily .df-glyphs { display: inline-flex; gap: 10px; align-items: center; margin: 0 0 20px; }
#daily .df-g { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--sans); border: 1.5px solid var(--ink); }
#daily .df-g.ok { background: var(--ink); color: var(--paper); }
#daily .df-g.ko { border-color: var(--acc); color: var(--acc); }
#daily .df-g.bet { background: var(--acc); border-color: var(--acc); color: var(--paper); }
#daily .df-done-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 520px; margin: 0 auto 22px; border: 1px solid var(--rule); background: rgba(var(--ink-rgb), .02); }
#daily .df-done-kpis div { padding: 10px 12px; border-right: 1px solid var(--rule); }
#daily .df-done-kpis div:last-child { border-right: 0; }
#daily .df-done-kpis small { display: block; font: 500 10.5px/1.1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
#daily .df-done-kpis b { font: 400 24px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
#daily .df-done-acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
#daily .df-recap-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin: 0 0 8px; }
#daily .df-recap-h h4 { font: 500 12px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; margin: 0; }
#daily .df-recap-h small { font: italic 13.5px var(--serif); color: var(--dim); }
#daily .df-recap { list-style: none; margin: 0; padding: 0; }
#daily .df-recap li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
#daily .df-recap .rc-t { font: 400 16.5px/1.25 var(--serif); color: var(--ink); }
#daily .df-recap .rc-m { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
@media (max-width: 720px) {
  #daily { inset: 0; border: 0; box-shadow: none; }
  #daily .df-head { padding: 14px 48px 12px 14px; }
  #daily .df-hmeta { display: none; }
  #daily .df-bar { padding: 0 10px; }
  #daily .df-scroll { padding: 14px 12px 32px; }
  #daily .df-card { padding: 16px 14px; }
  #daily .df-choices, #daily .df-vs-grid { grid-template-columns: minmax(0, 1fr); }
  #daily .df-vs-badge { display: none; }
  #daily .df-vtopic { min-height: 110px; padding: 14px 16px; }
  #daily .df-acts .df-btn-p { margin-left: 0; width: 100%; text-align: center; }
  #daily .df-kb { display: none; }
  #daily .df-pst span:last-child { display: none; }
  #daily .df-recap li { grid-template-columns: 24px minmax(0, 1fr); }
  #daily .df-recap li button { grid-column: 2; justify-self: start; }
}
