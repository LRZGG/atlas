/* A reading margin and a figure share one sheet, with a common masthead and colophon. */
:root { --paper:#f7f4eb; --ink:#292921; --ink-rgb:41,41,33; --dim:#55564b; --acc:#9c2935; --rule:rgba(var(--ink-rgb),.27); }
:root[data-theme="dark"] { --paper:#191b19; --ink:#e6e4d8; --ink-rgb:230,228,216; --dim:#b5b5a6; }
#sheet { --edge:clamp(22px,3.2vw,62px); --rail:clamp(230px,23vw,375px); --mast:76px; --foot:60px;
  display:grid; grid-template-columns:var(--rail) minmax(0,1fr); grid-template-rows:var(--mast) minmax(0,1fr) var(--foot);
  padding:0 var(--edge); column-gap:clamp(14px,2.6vw,50px); }
#frame { inset:10px; border:1px solid var(--rule); }
#frame::after { display:none; }
#mast, #colophon { position:relative; display:flex; align-items:center; gap:24px; grid-column:1/-1; }
#mast { grid-row:1; z-index:7; border-bottom:3px double var(--ink); padding-top:7px; }
#brand { margin-right:auto; font:400 clamp(26px,2.4vw,38px)/1 var(--serif); letter-spacing:-.065em; }
#mast .ov, #mast #stbtn, #mast #aibtn, #colophon .ov, #margin .ov { position:relative; inset:auto; transform:none; }
#mast #search { flex:0 1 260px; width:auto; max-width:none; }
#search::before { content:''; position:absolute; width:10px;height:10px;border:1.4px solid var(--ink);border-radius:50%;top:50%;left:2px;transform:translateY(-65%);pointer-events:none; }
#search::after { content:''; position:absolute; width:6px;height:1px;left:11px;top:calc(50% + 4px);background:var(--ink);transform:rotate(48deg);pointer-events:none; }
#sq { background:transparent; border:0; border-bottom:1px solid var(--rule); padding:8px 20px; font-size:15px; letter-spacing:0; }
#sres { position:absolute; top:100%; left:0; min-width:100%; width:min(360px,80vw); }
#mast #stbtn,#mast #aibtn,#legend summary { border:none; background:none; font:15px var(--sans); text-transform:none;letter-spacing:0; padding:6px 0; }
#mast #stbtn:hover,#mast #aibtn:hover,#legend summary:hover { text-decoration:underline; text-underline-offset:4px; }
#mast #legend { width:auto; border:0; }
#legend .scroll { position:absolute;right:0;top:calc(100% + 7px);width:min(300px,calc(100vw - 44px));max-height:65dvh;padding:12px 16px;background:var(--paper);border:1px solid var(--ink); }
#mast #lang { gap:4px; border-left:1px solid var(--rule); padding-left:16px; }

#lang button[aria-pressed=true] { color:var(--ink); text-decoration:underline; text-underline-offset:5px; }
#margin { grid-column:1;grid-row:2;display:flex; flex-direction:column;justify-content:center;align-items:stretch; gap:clamp(20px,4.6vh,56px);min-height:0;overflow-y:auto;padding:18px 2px; }
#margin #ctx { width:auto; }
#marginHandle { display:none; }
#mast #theme { margin-left:-12px; border:0; background:transparent; color:var(--ink); font:21px/1 var(--serif); }
#mast #theme:hover { background:var(--ink); color:var(--paper); }
@media(min-width:851px) {
  #margin { position:relative;z-index:2;background:var(--paper);transition:transform .29s cubic-bezier(.2,.75,.22,1),opacity .21s; }
  .exploring #margin { transform:translateX(calc(-100% - var(--edge)));opacity:0;pointer-events:none; }
  .exploring.margin-open #margin { transform:none;opacity:1;pointer-events:auto;padding-right:14px;border-right:1px solid var(--rule); }
  .exploring #marginHandle { display:grid;grid-column:1;grid-row:2;justify-self:start;align-self:stretch;place-items:center;
    width:calc(var(--edge) + 3px);margin-left:calc(-1 * var(--edge));position:relative;z-index:3;color:var(--ink);background:transparent;border:0;padding:0;cursor:pointer; }
  #marginHandle span { background:var(--paper);border:1px solid var(--rule);font:20px/34px var(--serif);width:19px; }
  #marginHandle[aria-expanded=true] span { transform:scaleX(-1); }
  #marginHandle:focus-visible { outline:0; }
  #marginHandle:focus-visible span { outline:2px solid var(--acc); }
}
@media(prefers-reduced-motion:reduce) { #margin {transition:none;} }
