sical systems give rise to the ability to discriminate, to integrate information, and to perform behavioural functions such as watching, listening, speaking, and so forth.","u":"https://en.wikipedia.org/wiki/Hard_problem_of_consciousness"}},"r":[{"t":"Facing Up to the Problem of Consciousness","a":"David J. Chalmers","y":1996,"u":"https://doi.org/10.7551/mitpress/6860.003.0003"},{"t":"Neural correlates of consciousness: progress and problems","a":"Christof Koch, Marcello Massimini, Mélanie Boly et al.","y":2016,"u":"https://doi.org/10.1038/nrn.2016.22"}],"rv":null,"fr":{"s":["Le cerveau et la conscience sont étroitement liés : une lésion, une anesthésie ou le sommeil profond changent ou suppriment l'expérience vécue.","On sait repérer des « corrélats neuronaux » : des activités du cerveau qui accompagnent une expérience consciente. Par exemple, ce qui diffère dans le cerveau entre une image qu'on voit et la même image qu'on ne remarque pas.","Plusieurs théories scientifiques sont en concurrence pour l'expliquer, et on cherche à les tester les unes contre les autres."],"i":["Pourquoi l'activité de neurones s'accompagne d'une expérience vécue : le goût d'un fruit, le rouge d'une couleur, une douleur. Le philosophe David Chalmers a appelé cela le « problème difficile » de la conscience.","Quels êtres en ont une : certains animaux ? Une machine pourrait-elle en avoir ? Il n'existe pas de test accepté par tous."],"d":["L'expérience vécue est privée : personne ne peut la mesurer de l'extérieur. On dépend de ce que la personne rapporte, et un bébé, un animal ou un patient qui ne répond pas ne peuvent rien rapporter.","Il n'existe pas de définition de la conscience qui fasse l'unanimité, et les théories concurrentes se laissent difficilement départager par l'expérience."],"e":"Savoir si un patient qui ne répond pas ressent quelque chose, ce qu'on doit aux animaux, et ce que valent des machines qui prétendent ressentir.","c":["Les neurosciences cognitives étudient les corrélats neuronaux ; la philosophie de l'esprit étudie la question de fond. Les deux se rejoignent ici.","Un protocole de base : comparer ce que fait le cerveau face à une perception consciente et à une perception qui ne l'est pas.","Pour poser le problème, le texte de Chalmers ci-dessous est le point de départ."]}}},{"id":"genes","qq":{"fr":"Pourquoi les humains ont-ils si peu de gènes ?","en":"Why do humans have so few genes?"},"nmm":{"fr":"Peu de gènes","en":"So few genes"},"cc":{"fr":"Nous avons à peu près autant de gènes qu'une petite plante à fleurs. La façon dont ils sont régulés et exprimés est une question centrale de la biologie."},"no":null,"s":"science2005","st":"ouverte","subs":[33,34],"t":false,"x":0.71,"y":-0.387,"f":null},{"id":"sante-genetique","qq":{"fr":"Dans quelle mesure nos variations génétiques déterminent-elles notre santé ?","en":"To what extent do genetic variations determine our health?"},"nmm":{"fr":"Génétique et santé","en":"Genetics and health"},"cc":{"fr":"Relier les différences entre génomes aux maladies de chacun reste difficile dès que plusieurs gènes et le mode de vie s'en mêlent."},"no":null,"s":"science2005","st":"ouverte","subs":[151,33,148],"t":false,"x":0.817,"y":-0.156,"f":null},{"id":"unification","qq":{"fr":"Peut-on unifier les lois de la physique ?","en":"Can the laws of physics be unified?"},"nmm":{"fr":"Unification de la physique","en":"Unifying physics"},"cc":{"fr":"La gravité et la physique quantique sont décrites par deux théories que personne n'a su réunir en une seule."},"no":null,"s":"science2005","st":"ouverte","subs":[201,134],"t":false,"x":-0.797,"y":-0.35,"f":null},{"id":"longevite","qq":{"fr":"Jusqu'où peut-on prolonger la vie humaine ?","en":"How far can human lifespan be extended?"},"nmm":{"fr":"Limites de la longévité","en":"Limits of longevity"},"cc":{"fr":"Des souris, des vers et des levures vivent plus longtemps en laboratoire. Certains chercheurs pensent pouvoir ralentir le vieillissement humain, d'autres que notre durée de vie est plus figée."},"no":null,"s":"science2005","st":"ouverte","subs":[24,152],"t":false,"x":0.552,"y":0.078,"f":null},{"id":"regeneration","qq":{"fr":"Qu'est-ce qui commande la régénération des organes ?","en":"What controls organ regeneration?"},"nmm":{"fr":"Régénération des organes","en":"Organ regeneration"},"cc":{"fr":"Certains animaux font repousser un membre entier. On ne sait pas pourquoi les mammifères en sont presque incapables."},"no":null,"s":"science2005","st":"ouverte","subs":[31,29,179],"t":false,"x":0.819,"y":-0.067,"f":null},{"id":"reprogrammation","qq":{"fr":"Comment une cellule de peau peut-elle devenir une cellule nerveuse ?","en":"How can a skin cell become a nerve cell?"},"nmm":{"fr":"Reprogrammer les cellules","en":"Reprogramming cells"},"cc":{"fr":"La question portait sur la possibilité de changer l'identité d'une cellule adulte."},"no":{"fr":"Depuis 2006, on sait reprogrammer des cellules adultes en cellules souches (prix Nobel 2012). Les mécanismes fins restent étudiés."},"s":"science2005","st":"avancee","subs":[29,31,183],"t":false,"x":0.846,"y":0.035,"f":null},{"id":"plante","qq":{"fr":"Comment une seule cellule devient-elle une plante entière ?","en":"How does a single cell become a whole plant?"},"nmm":{"fr":"De la cellule à la plante","en":"From cell to plant"},"cc":{"fr":"Une cellule végétale isolée peut redonner une plante complète. Ce qui déclenche et guide ce processus n'est pas entièrement compris."},"no":null,"s":"science2005","st":"ouverte","subs":[9,31],"t":false,"x":0.498,"y":-0.392,"f":null},{"id":"interieur-terre","qq":{"fr":"Comment fonctionne l'intérieur de la Terre ?","en":"How does Earth's interior work?"},"nmm":{"fr":"Intérieur de la Terre","en":"Earth's interior"},"cc":{"fr":"On ne peut pas y aller. Tout ce qu'on sait du manteau et du noyau vient de mesures indirectes, surtout les ondes des séismes."},"no":null,"s":"science2005","st":"ouverte","subs":[77,75],"t":false,"x":-0.131,"y":-0.584,"f":null},{"id":"seuls","qq":{"fr":"Sommes-nous seuls dans l'univers ?","en":"Are we alone in the universe?"},"nmm":{"fr":"Vie ailleurs","en":"Life elsewhere"},"cc":{"fr":"On ne connaît qu'un seul exemple de vie : la nôtre."},"no":null,"s":"science2005","st":"ouverte","subs":[198,80],"t":false,"x":-0.402,"y":-0.449,"f":null},{"id":"origine-vie","qq":{"fr":"Où et comment la vie est-elle apparue sur Terre ?","en":"Where and how did life arise on Earth?"},"nmm":{"fr":"Origine de la vie","en":"Origin of life"},"cc":{"fr":"Il ne reste presque aucune trace de cette époque, et personne n'a recréé en laboratoire un système qui se reproduit seul à partir de chimie simple."},"no":null,"s":"science2005","st":"ouverte","subs":[25,75,79],"t":true,"x":0.201,"y":-0.513,"f":{"w":{"fr":{"t":"Origine de la vie","x":"L'origine de la vie sur Terre demeure incertaine. Les plus anciens micro-organismes fossiles observés sont datés d'au moins 3,5 Ga durant le Paléoarchéen. Une étude publiée en 2015 sur des inclusions de carbone considérées comme d'origine organique leur assigne un âge de 4,1 milliards d'années et plus récemment des précipités hydrofuges sous-marins trouvés dans des roches sédimentaires ferrugineuses de la ceinture de roches vertes de Nuvvuagittuq (Québec) ont été interprétés comme de possibles traces de vie il y a…","u":"https://fr.wikipedia.org/wiki/Origine_de_la_vie"},"en":{"t":"Abiogenesis","x":"Abiogenesis or the origin of life is the natural process by which life arises from non-living matter, such as simple organic compounds. The prevailing scientific hypothesis is that the transition from non-living to living entities on Earth was not a single event, but a process of increasing complexity involving the formation of a habitable planet, the prebiotic synthesis of organic molecules, molecular self-replication, self-assembly, autocatalysis, and the emergence of cell membranes.","u":"https://en.wikipedia.org/wiki/Abiogenesis"}},"r":[{"t":"Prebiotic Systems Chemistry: New Perspectives for the Origins of Life","a":"Kepa Ruiz‐Mirazo, Carlos Briones, Andrés de la Escosura","y":2013,"u":"https://doi.org/10.1021/cr2004844"},{"t":"The Origin of Life—Out of the Blue","a":"John D. Sutherland","y":2015,"u":"https://doi.org/10.1002/anie.201506585"},{"t":"Synthesis of activated pyrimidine ribonucleotides in prebiotically plausible conditions","a":"Matthew W. Powner, Béatrice Gerland, John D. Sutherland","y":2009,"u":"https://doi.org/10.1038/nature08013"}],"rv":null,"fr":{"s":["La vie existe sur Terre depuis très longtemps : les plus anciens micro-organismes fossiles observés sont datés d'au moins 3,5 milliards d'années.","Les briques du vivant (acides aminés, composants de l'ARN, lipides) peuvent se former dans des conditions jugées plausibles pour la Terre primitive. Des expériences l'ont montré, depuis celle de Miller en 1953 jusqu'à la synthèse de composants de l'ARN en 2009 (dernier article ci-dessous).","Plusieurs scénarios sont étudiés : un « monde à ARN », où l'ARN stocke l'information et catalyse des réactions, des sources hydrothermales au fond des océans, des mares chaudes en surface. Aucun n'est démontré."],"i":["Le chemin complet, de la chimie sans vie à une cellule capable de se reproduire et d'évoluer : on connaît des étapes, pas leur enchaînement.","Où et quand cela s'est produit, et si c'est un événement rare ou probable."],"d":["Il ne reste presque aucune roche de cette époque : les archives géologiques les plus anciennes sont rares et très transformées.","On ne peut pas refaire l'expérience sur des millions d'années ni dans un océan entier : les laboratoires ne reproduisent que des étapes isolées.","Ces étapes demandent souvent des conditions chimiques incompatibles entre elles, ce qui oblige à imaginer des environnements où elles se succèdent."],"e":"Savoir si la vie est un accident rare ou un résultat probable de la chimie, ce qui change la façon de chercher la vie ailleurs.","c":["La chimie prébiotique : comment des molécules simples donnent des molécules plus complexes.","Les trois articles ci-dessous sont des points d'entrée ; le dernier décrit une étape précise réussie."]}}},{"id":"biodiversite","qq":{"fr":"Qu'est-ce qui détermine la diversité des espèces ?","en":"What determines species diversity?"},"nmm":{"fr":"Diversité des espèces","en":"Species diversity"},"cc":{"fr":"Certains milieux abritent des milliers d'espèces et d'autres très peu, sans qu'une règle générale l'explique."},"no":null,"s":"science2005","st":"ouverte","subs":[4,106],"t":false,"x":0.289,"y":-0.819,"f":null},{"id":"humain","qq":{"fr":"Quels changements génétiques nous ont rendus humains ?","en":"What genetic changes made us uniquely human?"},"nmm":{"fr":"Ce qui nous rend humains","en":"What makes us human"},"cc":{"fr":"Notre génome est très proche de celui du chimpanzé. Quelles différences comptent vraiment reste à établir."},"no":null,"s":"science2005","st":"ouverte","subs":[33,225],"t":true,"x":0.195,"y":0.158,"f":null},{"id":"memoire","qq":{"fr":"Comment les souvenirs sont-ils stockés et retrouvés ?","en":"How are memories stored and retrieved?"},"nmm":{"fr":"Mémoire","en":"Memory"},"cc":{"fr":"On sait que les connexions entre neurones changent quand on apprend. On ne sait pas lire un souvenir dans un cerveau."},"no":null,"s":"science2005","st":"ouverte","subs":[184,183],"t":false,"x":0.57,"y":0.503,"f":null},{"id":"cooperation","qq":{"fr":"Comment la coopération est-elle apparue au cours de l'évolution ?","en":"How did cooperation evolve?"},"nmm":{"fr":"Coopération","en":"Cooperation"},"cc":{"fr":"La sélection naturelle favorise l'intérêt individuel, et pourtant de nombreuses espèces, dont la nôtre, s'entraident."},"no":null,"s":"science2005","st":"ouverte","subs":[4,211,223],"t":true,"x":0.017,"y":0.235,"f":null},{"id":"donnees-biologiques","qq":{"fr":"Comment tirer une vue d'ensemble de la masse des données biologiques ?","en":"How will big pictures emerge from a sea of biological data?"},"nmm":{"fr":"Masse de données biologiques","en":"Mass of biological data"},"cc":{"fr":"La biologie produit plus de mesures qu'elle ne sait en relier pour comprendre un organisme entier."},"no":null,"s":"science2005","st":"ouverte","subs":[34,62,137],"t":true,"x":-0.286,"y":0.028,"f":null},{"id":"auto-assemblage","qq":{"fr":"Jusqu'où peut-on pousser l'auto-assemblage chimique ?","en":"How far can we push chemical self-assembly?"},"nmm":{"fr":"Auto-assemblage","en":"Self-assembly"},"cc":{"fr":"Le vivant construit des structures complexes à partir de molécules qui s'organisent seules. Les chimistes n'en reproduisent que des versions simples."},"no":null,"s":"science2005","st":"ouverte","subs":[55,125,56],"t":false,"x":-0.26,"y":-0.747,"f":null},{"id":"limites-calcul","qq":{"fr":"Quelles sont les limites du calcul conventionnel ?","en":"What are the limits of conventional computing?"},"nmm":{"fr":"Limites du calcul","en":"Limits of computing"},"cc":{"fr":"Certains problèmes semblent hors de portée de tout ordinateur classique, quelle que soit sa puissance."},"no":null,"s":"science2005","st":"ouverte","subs":[59,64,138],"t":false,"x":-0.85,"y":0.11,"f":null},{"id":"immunite","qq":{"fr":"Peut-on éteindre sélectivement une réponse immunitaire ?","en":"Can we selectively shut off immune responses?"},"nmm":{"fr":"Éteindre l'immunité","en":"Switching off immunity"},"cc":{"fr":"Cela permettrait de traiter les maladies auto-immunes et les rejets de greffe sans affaiblir toutes les défenses du corps."},"no":null,"s":"science2005","st":"ouverte","subs":[117,156,179],"t":false,"x":0.838,"y":-0.026,"f":null},{"id":"quantique","qq":{"fr":"Des principes plus profonds se cachent-ils derrière l'incertitude quantique ?","en":"Do deeper principles underlie quantum uncertainty and nonlocality?"},"nmm":{"fr":"Au-delà du quantique","en":"Beyond quantum"},"cc":{"fr":"La mécanique quantique prédit très bien les résultats d'expérience, sans dire pourquoi le hasard et l'action à distance y apparaissent."},"no":null,"s":"science2005","st":"ouverte","subs":[202,134,17],"t":true,"x":-0.579,"y":-0.003,"f":null},{"id":"vaccin-vih","qq":{"fr":"Un vaccin efficace contre le VIH est-il possible ?","en":"Is an effective HIV vaccine feasible?"},"nmm":{"fr":"Vaccin contre le VIH","en":"HIV vaccine"},"cc":{"fr":"Le virus mute vite et s'attaque aux cellules mêmes qui devraient le combattre."},"no":null,"s":"science2005","st":"ouverte","subs":[120,117,158],"t":false,"x":0.778,"y":-0.271,"f":null},{"id":"rechauffement","qq":{"fr":"Quelle température atteindra le monde sous effet de serre ?","en":"How hot will the greenhouse world be?"},"nmm":{"fr":"Ampleur du réchauffement","en":"Extent of warming"},"cc":{"fr":"La réponse dépend de la sensibilité du climat aux gaz à effet de serre, que les modèles n'encadrent qu'avec une marge."},"no":null,"s":"science2005","st":"ouverte","subs":[109,73],"t":false,"x":0.016,"y":-0.823,"f":null},{"id":"apres-petrole","qq":{"fr":"Qu'est-ce qui remplacera le pétrole bon marché, et quand ?","en":"What will replace oil, and when?"},"nmm":{"fr":"Après le pétrole","en":"After oil"},"cc":{"fr":"La question est à la fois technique et économique."},"no":null,"s":"science2005","st":"ouverte","subs":[88,86,82],"t":true,"x":-0.536,"y":-0.225,"f":null},{"id":"malthus","qq":{"fr":"Malthus continuera-t-il d'avoir tort ?","en":"Will Malthus continue to be wrong?"},"nmm":{"fr":"Malthus","en":"Malthus"},"cc":{"fr":"En 1798, Malthus prédisait que la croissance de la population serait stoppée par la famine, la guerre ou la maladie. La population a été multipliée par six sans l'effondrement annoncé. Peut-on continuer à l'éviter ?"},"no":null,"s":"science2005","st":"ouverte","subs":[228,1,214],"t":true,"x":-0.073,"y":0.157,"f":null},{"id":"p-np","qq":{"fr":"Vérifier une solution est-il aussi difficile que la trouver ?","en":"Is checking a solution as hard as finding it?"},"nmm":{"fr":"P contre NP","en":"P versus NP"},"cc":{"fr":"C'est le problème « P contre NP », la question centrale de la théorie de la complexité."},"no":null,"s":"clay","st":"ouverte","subs":[59,138],"t":false,"x":-0.871,"y":0.048,"f":{"w":{"fr":{"t":"Problème P ≟ NP","x":"Le problème P ≟ NP est une conjecture en mathématiques, et plus précisément en informatique théorique, considérée par de nombreux chercheurs comme une des plus importantes conjectures du domaine, et même des mathématiques en général. L'Institut de mathématiques Clay a inclus ce problème dans sa liste des sept problèmes du prix du millénaire, et offre à ce titre un million de dollars à quiconque sera en mesure de démontrer P = NP ou P ≠ NP ou de démontrer que ce n'est pas démontrable.","u":"https://fr.wikipedia.org/wiki/Probl%C3%A8me_P_%E2%89%9F_NP"},"en":{"t":"P versus NP problem","x":"The P versus NP problem is a major unsolved problem in theoretical computer science. Informally, it asks whether every decision problem for which a proposed positive answer can be quickly verified can also be quickly solved.","u":"https://en.wikipedia.org/wiki/P_versus_NP_problem"}},"r":[{"t":"The status of the P versus NP problem","a":"Lance Fortnow","y":2009,"u":"https://doi.org/10.1145/1562164.1562186"},{"t":"P vs NP, description officielle du problème","a":"Clay Mathematics Institute","y":null,"u":"https://www.claymath.org/millennium/p-vs-np/"}],"rv":null,"fr":{"s":["Un problème est dans P si un ordinateur peut le résoudre en un temps raisonnable, même quand les données grossissent. Il est dans NP si, quand on vous propose une solution, vous pouvez la vérifier vite.","Tout problème de P est dans NP : ce qu'on sait résoudre vite, on sait le vérifier vite.","Des milliers de problèmes utiles sont dans NP (organiser des tournées, remplir un emploi du temps, ranger des objets dans le moins de boîtes), et pour beaucoup d'entre eux personne ne connaît d'algorithme rapide.","La plupart des spécialistes pensent que P est différent de NP, sans l'avoir prouvé."],"i":["Si P est égal à NP ou non. Personne n'a démontré l'un ni l'autre. L'institut Clay offre un million de dollars à qui y parviendra : c'est un des problèmes du prix du millénaire."],"d":["Prouver qu'un problème est impossible à résoudre vite oblige à raisonner sur tous les programmes possibles, y compris ceux que personne n'a encore imaginés.","Des résultats montrent que plusieurs familles de techniques de preuve ne peuvent pas suffire à trancher. Il faut donc inventer de nouvelles méthodes."],"e":"Si P était égal à NP avec un algorithme pratique, une grande partie de la cryptographie actuelle serait cassée. Dans l'autre cas, on saurait que pour des milliers de problèmes, aucune astuce ne donnera d'algorithme rapide.","c":["La théorie de la complexité, une branche de l'informatique théorique et des mathématiques.","Un premier pas : comprendre pourquoi vérifier une grille de sudoku est facile alors que résoudre ce type de problème en général ne l'est pas.","Lire la description officielle du problème sur le site de l'institut Clay, ci-dessous."]}}},{"id":"riemann","qq":{"fr":"L'hypothèse de Riemann est-elle vraie ?","en":"Is the Riemann hypothesis true?"},"nmm":{"fr":"Hypothèse de Riemann","en":"Riemann hypothesis"},"cc":{"fr":"Formulée en 1859, elle porte sur la répartition des nombres premiers."},"no":null,"s":"clay","st":"ouverte","subs":[129],"t":false,"x":-0.965,"y":-0.16,"f":{"w":{"fr":{"t":"Hypothèse de Riemann","x":"En mathématiques, l'hypothèse de Riemann est une conjecture formulée en 1859 par le mathématicien allemand Bernhard Riemann, selon laquelle les zéros non triviaux de la fonction zêta de Riemann ont tous une partie réelle égale à 1/2. Sa démonstration améliorerait la connaissance de la répartition des nombres premiers et ouvrirait des nouveaux domaines aux mathématiques.","u":"https://fr.wikipedia.org/wiki/Hypoth%C3%A8se_de_Riemann"},"en":{"t":"Riemann hypothesis","x":"In mathematics, the Riemann hypothesis is the conjecture that the Riemann zeta function has its zeros only at the negative even integers and at complex numbers with real part. Many consider it to be the most important unsolved problem in pure mathematics. It is of great interest in number theory because it implies results about the distribution of prime numbers. It was proposed by Bernhard Riemann, after whom it is named.","u":"https://en.wikipedia.org/wiki/Riemann_hypothesis"}},"r":[{"t":"The Riemann hypothesis is true up to 3·1012","a":"David J. Platt, Timothy S. Trudgian","y":2021,"u":"https://doi.org/10.1112/blms.12460"},{"t":"L'hypothèse de Riemann, description officielle du problème","a":"Clay Mathematics Institute","y":null,"u":"https://www.claymath.org/millennium/riemann-hypothesis/"}],"rv":null,"fr":{"s":["Les nombres premiers se répartissent selon une loi moyenne connue (le théorème des nombres premiers, démontré en 1896). Les écarts à cette loi se lisent dans les zéros d'une fonction, la fonction zêta de Riemann.","En 1859, Riemann a affirmé que tous les zéros « non triviaux » de cette fonction ont une partie réelle égale à 1/2. C'est l'hypothèse de Riemann.","Les ordinateurs l'ont vérifiée pour tous les zéros jusqu'à une hauteur d'environ 3 000 milliards, sans contre-exemple."],"i":["Si elle est vraie pour tous les zéros, qui sont en nombre infini.","Les écarts exacts de la répartition des nombres premiers par rapport à la loi moyenne."],"d":["Aucune vérification par ordinateur ne peut couvrir une infinité de zéros : il faut une démonstration.","Pour des objets voisins, l'analogue de l'hypothèse a été démontré (par Weil, puis Deligne), mais la méthode n'a pas pu être transposée jusqu'ici aux nombres entiers."],"e":"De nombreux résultats sur les nombres premiers sont démontrés « si l'hypothèse de Riemann est vraie ». C'est l'un des problèmes du prix du millénaire : un million de dollars à qui la résoudra.","c":["La théorie analytique des nombres.","Un premier pas : comprendre ce qu'est un zéro d'une fonction, puis pourquoi leur position contrôle la répartition des nombres premiers.","Lire la description officielle du problème sur le site de l'institut Clay, ci-dessous."]}}},{"id":"yang-mills","qq":{"fr":"Peut-on construire rigoureusement la théorie de Yang-Mills ?","en":"Can Yang–Mills theory be built rigorously?"},"nmm":{"fr":"Yang-Mills","en":"Yang–Mills"},"cc":{"fr":"Cette théorie décrit les forces entre particules. Il manque sa construction mathématique rigoureuse, avec la preuve d'un « écart de masse » positif."},"no":null,"s":"clay","st":"ouverte","subs":[134,201],"t":false,"x":-0.784,"y":-0.305,"f":null},{"id":"navier-stokes","qq":{"fr":"Les équations de Navier-Stokes ont-elles toujours une solution régulière ?","en":"Do the Navier–Stokes equations always have a smooth solution?"},"nmm":{"fr":"Navier-Stokes","en":"Navier–Stokes"},"cc":{"fr":"Ces équations décrivent l'écoulement des fluides depuis le XIXe siècle. Le problème demande si leurs solutions existent toujours et restent lisses en trois dimensions."},"no":{"fr":"Une résolution a été proposée en septembre 2026. L'institut Clay classe le problème comme « actif » et n'a pas attribué le prix (d'après MathWorld, consulté le 16 novembre 2026)."},"s":"clay","st":"evaluation","subs":[130,50,94],"t":false,"x":-0.718,"y":-0.297,"f":null},{"id":"hodge","qq":{"fr":"La conjecture de Hodge est-elle vraie ?","en":"Is the Hodge conjecture true?"},"nmm":{"fr":"Conjecture de Hodge","en":"Hodge conjecture"},"cc":{"fr":"Elle relie la forme de certains espaces géométriques aux équations algébriques qui les définissent."},"no":null,"s":"clay","st":"ouverte","subs":[133,129],"t":false,"x":-0.96,"y":0.06,"f":null},{"id":"birch-swinnerton-dyer","qq":{"fr":"La conjecture de Birch et Swinnerton-Dyer est-elle vraie ?","en":"Is the Birch and Swinnerton-Dyer conjecture true?"},"nmm":{"fr":"Birch et Swinnerton-Dyer","en":"Birch and Swinnerton-Dyer"},"cc":{"fr":"Elle porte sur le nombre de solutions rationnelles de certaines équations, les courbes elliptiques."},"no":null,"s":"clay","st":"ouverte","subs":[129],"t":false,"x":-0.972,"y":-0.07,"f":null},{"id":"goldbach","qq":{"fr":"Tout nombre pair supérieur à 2 est-il la somme de deux nombres premiers ?","en":"Is every even number greater than 2 the sum of two primes?"},"nmm":{"fr":"Conjecture de Goldbach","en":"Goldbach's conjecture"},"cc":{"fr":"Vérifiée par ordinateur sur de très grands nombres, jamais démontrée. Elle fait partie du huitième problème de Hilbert (1900)."},"no":null,"s":"hilbert","st":"ouverte","subs":[129],"t":false,"x":-0.962,"y":0.015,"f":null},{"id":"jumeaux","qq":{"fr":"Existe-t-il une infinité de nombres premiers jumeaux ?","en":"Are there infinitely many twin primes?"},"nmm":{"fr":"Premiers jumeaux","en":"Twin primes"},"cc":{"fr":"Deux nombres premiers jumeaux diffèrent de 2, comme 11 et 13. On a démontré en 2013 qu'il existe une infinité de paires de premiers séparés par un écart borné, sans pouvoir ramener cet écart à 2."},"no":null,"s":"hilbert","st":"ouverte","subs":[129],"t":false,"x":-0.98,"y":-0.118,"f":{"w":{"fr":{"t":"Nombres premiers jumeaux","x":"En mathématiques, deux nombres premiers jumeaux sont deux nombres premiers qui ne diffèrent que de 2. Hormis pour le couple, cet écart entre nombres premiers de 2 est le plus petit possible. Les plus petits nombres premiers jumeaux sont 3 et 5, 5 et 7, 11 et 13.","u":"https://fr.wikipedia.org/wiki/Nombres_premiers_jumeaux"},"en":{"t":"Twin prime","x":"A twin prime is a prime number that is either 2 less or 2 more than another prime number—for example, either member of the twin prime pair    or (41, 43). In other words, a twin prime is a prime that has a prime gap of two. Sometimes the term twin prime is used for a pair of twin primes; an alternative name for this is prime twin or prime pair.","u":"https://en.wikipedia.org/wiki/Twin_prime"}},"r":[{"t":"Bounded gaps between primes","a":"Zhang Yitang","y":2014,"u":"https://doi.org/10.4007/annals.2014.179.3.7"},{"t":"Small gaps between primes","a":"James Maynard","y":2014,"u":"https://doi.org/10.4007/annals.2015.181.1.7"}],"rv":null,"fr":{"s":["Un nombre premier n'a que deux diviseurs : 1 et lui-même. Deux premiers sont jumeaux quand ils diffèrent de 2 : 3 et 5, 11 et 13, 17 et 19.","Les premiers deviennent plus rares à mesure qu'on avance, mais on continue de trouver des paires jumelles : les plus grandes connues ont des centaines de milliers de chiffres.","En 2013, Yitang Zhang a démontré qu'il existe une infinité de paires de premiers séparés par moins de 70 millions. Ce plafond a ensuite été abaissé à 246 grâce aux travaux de James Maynard et du projet collaboratif Polymath."],"i":["S'il existe une infinité de premiers jumeaux : il faudrait faire passer l'écart garanti de 246 à 2, et les méthodes actuelles ne suffisent pas.","La répartition fine des nombres premiers : on connaît la loi moyenne (le théorème des nombres premiers), pas le détail local."],"d":["Les nombres premiers sont définis par la multiplication, alors que la question des jumeaux porte sur un écart d'addition (2). Les deux opérations se combinent mal.","Les méthodes de crible, qui éliminent les nombres non premiers, butent sur un obstacle de parité : elles distinguent mal un nombre ayant un nombre pair de facteurs premiers d'un nombre en ayant un nombre impair."],"e":"Comprendre comment les nombres premiers se répartissent localement, et pas seulement en moyenne.","c":["La théorie analytique des nombres, et en particulier les méthodes de crible.","Un premier pas : chercher à la main les jumeaux jusqu'à 100, puis se demander ce qui les empêcherait de s'arrêter un jour.","Les deux articles ci-dessous sont ceux de Zhang et de Maynard."]}}},{"id":"langlands","qq":{"fr":"Existe-t-il une loi de réciprocité générale reliant les nombres et la symétrie ?","en":"Is there a general reciprocity law linking numbers and symmetry?"},"nmm":{"fr":"Programme de Langlands","en":"Langlands program"},"cc":{"fr":"Le neuvième problème de Hilbert demande la loi de réciprocité la plus générale. Beaucoup de spécialistes y voient le programme de Langlands, un réseau de conjectures reliant nombres, géométrie et symétries."},"no":null,"s":"hilbert","st":"ouverte","subs":[129,133],"t":false,"x":-0.99,"y":-0.027,"f":null},{"id":"cycles-limites","qq":{"fr":"Combien de cycles limites une équation polynomiale du plan peut-elle avoir ?","en":"How many limit cycles can a polynomial equation in the plane have?"},"nmm":{"fr":"Cycles limites","en":"Limit cycles"},"cc":{"fr":"C'est le seizième problème de Hilbert. On a démontré que ce nombre est fini pour chaque équation, mais on ne sait pas le borner d'avance."},"no":null,"s":"hilbert","st":"ouverte","subs":[130,133],"t":false,"x":-0.896,"y":-0.124,"f":null},{"id":"hilbert-6","qq":{"fr":"Peut-on fonder toute la physique sur des axiomes ?","en":"Can all of physics be built on axioms?"},"nmm":{"fr":"Axiomes de la physique","en":"Axioms of physics"},"cc":{"fr":"En 1900, Hilbert demandait de traiter la physique comme les mathématiques, à partir d'axiomes. Le problème est jugé mal défini ou seulement en partie résolu."},"no":null,"s":"hilbert","st":"ouverte","subs":[134,204],"t":false,"x":-0.836,"y":-0.206,"f":null},{"id":"collatz","qq":{"fr":"La règle de Collatz mène-t-elle toujours à 1 ?","en":"Does the Collatz rule always lead to 1?"},"nmm":{"fr":"Conjecture de Collatz","en":"Collatz conjecture"},"cc":{"fr":"On divise un nombre pair par 2 ; on multiplie un nombre impair par 3 puis on ajoute 1 ; on recommence. Tous les nombres testés par ordinateur finissent à 1, mais personne ne l'a démontré."},"no":null,"s":"wiki-math","st":"ouverte","subs":[129,132],"t":false,"x":-0.873,"y":-0.085,"f":null},{"id":"abc","qq":{"fr":"Que dit la conjecture abc sur le lien entre addition et multiplication ?","en":"What does the abc conjecture say about adding versus multiplying?"},"nmm":{"fr":"Conjecture abc","en":"abc conjecture"},"cc":{"fr":"Elle relie les facteurs premiers de a, de b et de a + b. Une démonstration proposée en 2012 reste contestée."},"no":null,"s":"wiki-math","st":"ouverte","subs":[129],"t":false,"x":-0.937,"y":-0.105,"f":null},{"id":"parfait-impair","qq":{"fr":"Existe-t-il un nombre parfait impair ?","en":"Is there an odd perfect number?"},"nmm":{"fr":"Nombres parfaits impairs","en":"Odd perfect numbers"},"cc":{"fr":"Un nombre parfait égale la somme de ses diviseurs autres que lui-même (6 = 1 + 2 + 3). On en connaît des pairs ; on n'a jamais trouvé d'impair ni prouvé qu'il n'en existe pas."},"no":null,"s":"wiki-math","st":"ouverte","subs":[129],"t":false,"x":-0.919,"y":-0.064,"f":null},{"id":"hadwiger-nelson","qq":{"fr":"Combien de couleurs faut-il pour colorier le plan sans que deux points à distance 1 aient la même ?","en":"How many colours does it take to colour the plane so no two points at distance 1 share one?"},"nmm":{"fr":"Coloriage du plan","en":"Colouring the plane"},"cc":{"fr":"On sait qu'il en faut au moins 5 et que 7 suffisent. La valeur exacte reste inconnue."},"no":null,"s":"wiki-math","st":"ouverte","subs":[132,133],"t":false,"x":-0.824,"y":-0.003,"f":null},{"id":"carre-inscrit","qq":{"fr":"Toute courbe fermée contient-elle les quatre sommets d'un carré ?","en":"Does every closed curve contain the four corners of a square?"},"nmm":{"fr":"Carré inscrit","en":"Inscribed square"},"cc":{"fr":"La réponse est oui pour de nombreuses courbes régulières, mais le cas général est ouvert. C'est le problème du carré inscrit."},"no":null,"s":"wiki-math","st":"ouverte","subs":[133],"t":false,"x":-0.945,"y":-0.027,"f":null},{"id":"ramsey","qq":{"fr":"Combien de personnes faut-il réunir pour que cinq se connaissent toutes, ou cinq ne se connaissent pas du tout ?","en":"How many people must be gathered so that five all know each other, or five are all strangers?"},"nmm":{"fr":"Nombres de Ramsey","en":"Ramsey numbers"},"cc":{"fr":"C'est le nombre de Ramsey R(5,5). On n'en connaît qu'un encadrement."},"no":null,"s":"wiki-math","st":"ouverte","subs":[132],"t":false,"x":-0.881,"y":-0.041,"f":null},{"id":"empilement","qq":{"fr":"Quel est le meilleur empilement de sphères en grande dimension ?","en":"What is the best way to pack spheres in high dimensions?"},"nmm":{"fr":"Empilement de sphères","en":"Sphere packing"},"cc":{"fr":"Le problème est résolu seulement en dimensions 1, 2, 3, 8 et 24."},"no":null,"s":"wiki-math","st":"ouverte","subs":[133,132],"t":false,"x":-0.914,"y":0.005,"f":null},{"id":"factorisation","qq":{"fr":"Peut-on factoriser rapidement un grand nombre avec un ordinateur ordinaire ?","en":"Can a large number be factored quickly on an ordinary computer?"},"nmm":{"fr":"Factorisation","en":"Integer factorisation"},"cc":{"fr":"On ne connaît aucun algorithme rapide, et une grande part du chiffrement repose sur cette difficulté. Un ordinateur quantique pourrait le faire vite (algorithme de Shor)."},"no":null,"s":"wiki-cs","st":"ouverte","subs":[138,59],"t":false,"x":-0.824,"y":0.147,"f":{"w":{"fr":{"t":"Décomposition en produit de facteurs premiers","x":"En mathématiques et plus précisément en arithmétique, la décomposition en produit de facteurs premiers, aussi connue comme la factorisation entière en nombres premiers ou encore plus couramment la décomposition en facteurs premiers, consiste à chercher à écrire un entier naturel non nul sous forme d'un produit de nombres premiers. Par exemple, si le nombre donné est 45, la factorisation en nombres premiers est 32 × 5, soit 3 × 3 × 5.","u":"https://fr.wikipedia.org/wiki/D%C3%A9composition_en_produit_de_facteurs_premiers"},"en":{"t":"Integer factorization","x":"In mathematics, integer factorization is the decomposition of a positive integer into a product of integers. Every positive integer greater than 1 is either the product of two or more integer factors greater than 1, in which case it is a composite number, or it is not, in which case it is a prime number. For example, 15 is a composite number because 15 = 3 · 5, but 7 is a prime number because it cannot be decomposed in this way.","u":"https://en.wikipedia.org/wiki/Integer_factorization"}},"r":[{"t":"Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer","a":"Peter W. Shor","y":1997,"u":"https://doi.org/10.1137/S0097539795293172"},{"t":"A method for obtaining digital signatures and public-key cryptosystems","a":"Ronald L. Rivest, Adi Shamir, Leonard M. Adleman","y":1978,"u":"https://doi.org/10.1145/359340.359342"}],"rv":null,"fr":{"s":["Tout entier supérieur à 1 s'écrit de façon unique comme un produit de nombres premiers. Pour de petits nombres, trouver ces facteurs est facile.","Pour de très grands nombres (des centaines de chiffres), les meilleurs algorithmes connus sur un ordinateur ordinaire demandent un temps qui explose avec le nombre de chiffres.","Des systèmes de chiffrement très répandus, comme RSA, reposent sur cette difficulté.","En 1994, Peter Shor a montré qu'un ordinateur quantique assez grand saurait factoriser vite."],"i":["S'il existe un algorithme rapide pour un ordinateur ordinaire. Personne n'en connaît, et personne n'a montré qu'il n'en existe pas.","Si la factorisation est aussi difficile que les problèmes les plus durs de la classe NP. On pense que non, sans l'avoir démontré."],"d":["Prouver qu'aucun algorithme, même inconnu, ne réussit : on ne sait le faire pour presque aucun problème.","Ce problème a une structure particulière qui le rend probablement plus facile que les problèmes NP-complets, sans qu'on sache pour autant qu'il est facile."],"e":"La sécurité d'une grande partie du chiffrement actuel. C'est ce qui motive les travaux sur la cryptographie capable de résister aux ordinateurs quantiques.","c":["La théorie de la complexité et la théorie des nombres.","Un premier pas : factoriser 91, puis 8 633 à la main, et constater comme l'effort grandit.","Les deux articles ci-dessous : celui de Shor sur le calcul quantique, et celui qui a introduit RSA."]}}},{"id":"sens-unique","qq":{"fr":"Existe-t-il des opérations faciles à faire mais impossibles à défaire ?","en":"Are there operations that are easy to do but impossible to undo?"},"nmm":{"fr":"Fonctions à sens unique","en":"One-way functions"},"cc":{"fr":"Ces « fonctions à sens unique » fonderaient la cryptographie moderne. On n'a pas démontré qu'elles existent, ce qui entraînerait que P est différent de NP."},"no":null,"s":"wiki-cs","st":"ouverte","subs":[138,59],"t":false,"x":-0.89,"y":0.088,"f":null},{"id":"isomorphisme-graphes","qq":{"fr":"Peut-on savoir vite si deux réseaux sont identiques ?","en":"Can we quickly tell whether two networks are the same?"},"nmm":{"fr":"Isomorphisme de graphes","en":"Graph isomorphism"},"cc":{"fr":"Pour ce problème d'isomorphisme de graphes, on ne connaît pas d'algorithme rapide en toute généralité, sans avoir montré qu'il n'en existe pas."},"no":null,"s":"wiki-cs","st":"ouverte","subs":[138,132],"t":false,"x":-0.916,"y":0.05,"f":null},{"id":"multiplication-matrices","qq":{"fr":"Quelle est la vitesse limite pour multiplier deux tableaux de nombres ?","en":"What is the speed limit for multiplying two grids of numbers?"},"nmm":{"fr":"Multiplication de matrices","en":"Matrix multiplication"},"cc":{"fr":"On sait faire mieux que la méthode apprise à l'école. Le meilleur algorithme possible reste inconnu."},"no":null,"s":"wiki-cs","st":"ouverte","subs":[59,136],"t":false,"x":-0.868,"y":0.003,"f":null},{"id":"multiplication-entiers","qq":{"fr":"Quelle est la façon la plus rapide de multiplier deux grands nombres ?","en":"What is the fastest way to multiply two large numbers?"},"nmm":{"fr":"Multiplication de grands nombres","en":"Multiplying large numbers"},"cc":{"fr":"Un algorithme très rapide existe depuis 2019. On ne sait pas s'il est le meilleur possible."},"no":null,"s":"wiki-cs","st":"ouverte","subs":[59,138],"t":false,"x":-0.881,"y":0.142,"f":null},{"id":"hasard-algorithmes","qq":{"fr":"Le hasard rend-il les algorithmes plus rapides ?","en":"Does randomness make algorithms faster?"},"nmm":{"fr":"Hasard et algorithmes","en":"Randomness in algorithms"},"cc":{"fr":"De nombreux algorithmes utilisent le hasard. On pense qu'on peut toujours s'en passer sans perdre de vitesse, mais ce n'est pas démontré."},"no":null,"s":"wiki-cs","st":"ouverte","subs":[138,59],"t":false,"x":-0.831,"y":0.069,"f":null},{"id":"programmation-lineaire","qq":{"fr":"Existe-t-il un algorithme vraiment rapide pour la programmation linéaire ?","en":"Is there a truly fast algorithm for linear programming?"},"nmm":{"fr":"Programmation linéaire","en":"Linear programming"},"cc":{"fr":"Ces problèmes d'optimisation sont résolus tous les jours. On ne sait pas s'il existe un algorithme dont la durée ne dépend que de la taille du problème."},"no":null,"s":"wiki-cs","st":"ouverte","subs":[71,138],"t":false,"x":-0.806,"y":0.188,"f":null},{"id":"ordinateur-quantique","qq":{"fr":"Peut-on construire un ordinateur quantique fiable à grande échelle ?","en":"Can a large, reliable quantum computer be built?"},"nmm":{"fr":"Ordinateur quantique","en":"Quantum computer"},"cc":{"fr":"Les qubits sont fragiles et font des erreurs. On cherche à les corriger assez bien pour réaliser de longs calculs."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[202,59,199],"t":false,"x":-0.707,"y":-0.34,"f":null},{"id":"inflation","qq":{"fr":"L'univers a-t-il connu une phase d'expansion fulgurante au tout début ?","en":"Did the universe go through a burst of ultra-fast expansion at the very start?"},"nmm":{"fr":"Inflation cosmique","en":"Cosmic inflation"},"cc":{"fr":"La théorie de l'inflation explique pourquoi l'univers est si uniforme, mais elle n'est pas prouvée et ses détails restent inconnus."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[198,201],"t":false,"x":-0.705,"y":-0.413,"f":null},{"id":"antimatiere","qq":{"fr":"Pourquoi l'univers contient-il de la matière et presque pas d'antimatière ?","en":"Why does the universe contain matter and almost no antimatter?"},"nmm":{"fr":"Matière et antimatière","en":"Matter and antimatter"},"cc":{"fr":"Les modèles prévoient des quantités égales au début de l'univers. Les observations montrent surtout de la matière."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[201,198],"t":false,"x":-0.704,"y":-0.496,"f":null},{"id":"trous-noirs-info","qq":{"fr":"Que devient l'information qui tombe dans un trou noir ?","en":"What happens to information that falls into a black hole?"},"nmm":{"fr":"Information et trous noirs","en":"Black holes and information"},"cc":{"fr":"Les trous noirs émettent un rayonnement qui, d'après la théorie, semble effacer l'information. Cela contredit la mécanique quantique."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[198,134],"t":false,"x":-0.727,"y":-0.247,"f":{"w":{"fr":{"t":"Paradoxe de l'information","x":"En astrophysique, le paradoxe de l'information est un paradoxe mis en évidence par Stephen Hawking en 1976 opposant les lois de la mécanique quantique à celles de la relativité générale. En effet, la relativité générale implique qu'une information pourrait fondamentalement disparaître dans un trou noir, à la suite de l'évaporation de celui-ci.","u":"https://fr.wikipedia.org/wiki/Paradoxe_de_l'information"},"en":{"t":"Black hole information paradox","x":"The black hole information paradox is an unsolved problem in physics and a paradox that appears when the predictions of quantum mechanics and general relativity are combined. The theory of general relativity predicts the existence of black holes that are regions of spacetime from which nothing—not even light—can escape. In the 1970s, Stephen Hawking applied the semiclassical approach of quantum field theory in curved spacetime to such systems and found that an isolated black hole would emit a form of radiation.","u":"https://en.wikipedia.org/wiki/Black_hole_information_paradox"}},"r":[{"t":"Particle creation by black holes","a":"Stephen William Hawking","y":1975,"u":"https://doi.org/10.1007/BF02345020"},{"t":"The entropy of Hawking radiation","a":"Ahmed Almheiri, Thomas Hartman, JUAN M. MALDACENA et al.","y":2021,"u":"https://doi.org/10.1103/RevModPhys.93.035002"}],"rv":null,"fr":{"s":["D'après la relativité générale, un trou noir est une région d'où rien ne ressort, pas même la lumière.","En 1974-1975, Stephen Hawking a montré qu'en tenant compte de la physique quantique, un trou noir émet un faible rayonnement et perd de la masse, au point de pouvoir disparaître.","Ce rayonnement, tel que Hawking l'a calculé, est thermique : il ne semble rien porter de ce qui est tombé dans le trou noir."],"i":["Si l'information sur ce qui est tombé dans un trou noir est perdue pour toujours, ou si elle ressort d'une façon ou d'une autre. La mécanique quantique dit qu'elle ne peut pas être détruite.","Des calculs récents, à partir de 2019, obtiennent un rayonnement compatible avec la conservation de l'information. Ils reposent sur des hypothèses et ne règlent pas toute la question."],"d":["Il n'existe pas de théorie quantique de la gravité : le problème se pose exactement là où la relativité et la mécanique quantique se heurtent.","Le rayonnement d'un trou noir astrophysique est bien trop faible pour être observé : aucune expérience ne peut trancher aujourd'hui."],"e":"C'est un banc d'essai pour toute théorie qui voudrait unifier la gravité et la mécanique quantique.","c":["La relativité générale, la théorie quantique des champs, puis la gravité quantique.","Un premier pas : comprendre pourquoi détruire de l'information contredirait la mécanique quantique.","Le premier article ci-dessous est celui de Hawking ; le second fait le point sur les calculs récents."]}}},{"id":"fleche-temps","qq":{"fr":"Pourquoi le temps a-t-il un sens ?","en":"Why does time have a direction?"},"nmm":{"fr":"Flèche du temps","en":"Arrow of time"},"cc":{"fr":"Les lois de la physique fonctionnent presque aussi bien à l'envers. On ignore pourquoi l'univers avait une entropie si basse au départ."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[204,17],"t":true,"x":-0.565,"y":0.191,"f":null},{"id":"neutrinos","qq":{"fr":"Quelle est la masse des neutrinos ?","en":"What is the mass of neutrinos?"},"nmm":{"fr":"Masse des neutrinos","en":"Neutrino mass"},"cc":{"fr":"On sait que les neutrinos ont une masse, pas sa valeur. On ne sait pas non plus s'ils sont leur propre antiparticule."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[201],"t":false,"x":-0.674,"y":-0.53,"f":null},{"id":"proton","qq":{"fr":"Le proton est-il éternel ?","en":"Is the proton eternal?"},"nmm":{"fr":"Stabilité du proton","en":"Proton stability"},"cc":{"fr":"Certaines extensions de la physique actuelle prévoient qu'il se désintègre, très lentement. Aucune désintégration n'a été observée."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[201],"t":false,"x":-0.721,"y":-0.455,"f":null},{"id":"confinement","qq":{"fr":"Pourquoi ne peut-on jamais isoler un quark ?","en":"Why can a quark never be isolated?"},"nmm":{"fr":"Confinement des quarks","en":"Quark confinement"},"cc":{"fr":"Les quarks n'existent qu'enfermés dans des particules. Ce confinement n'est pas démontré mathématiquement."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[201,134],"t":false,"x":-0.769,"y":-0.263,"f":null},{"id":"generations","qq":{"fr":"Pourquoi les particules existent-elles en trois familles ?","en":"Why do particles come in three families?"},"nmm":{"fr":"Trois générations","en":"Three generations"},"cc":{"fr":"Quarks et leptons se répartissent en trois générations de plus en plus lourdes. Aucune théorie n'explique ce nombre ni les masses."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[201],"t":false,"x":-0.659,"y":-0.488,"f":null},{"id":"forme-univers","qq":{"fr":"Quelle est la forme de l'univers ?","en":"What is the shape of the universe?"},"nmm":{"fr":"Forme de l'univers","en":"Shape of the universe"},"cc":{"fr":"On ne connaît que la partie observable. On ignore si l'espace entier est infini ou fini, et comment il se referme."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[198,133],"t":false,"x":-0.766,"y":-0.218,"f":null},{"id":"tension-hubble","qq":{"fr":"Pourquoi deux mesures de l'expansion de l'univers donnent-elles des valeurs différentes ?","en":"Why do two measurements of the universe's expansion disagree?"},"nmm":{"fr":"Tension sur l'expansion","en":"Hubble tension"},"cc":{"fr":"La vitesse d'expansion mesurée dans l'univers proche diffère de celle déduite de l'univers primitif. Erreur de mesure ou physique nouvelle ?"},"no":null,"s":"wiki-phys","st":"ouverte","subs":[198],"t":false,"x":-0.753,"y":-0.338,"f":{"w":{"fr":{"t":"Tension de Hubble","x":"La tension de Hubble est la différence de mesure de la constante de Hubble qui apparaît entre la méthode directe et la méthode utilisant le fond diffus cosmologique. Cette mesure de la vitesse de fuite des objets extragalactiques varie d'environ 8 % selon ces techniques de mesures.","u":"https://fr.wikipedia.org/wiki/Tension_de_Hubble"}},"r":[{"t":"A Comprehensive Measurement of the Local Value of the Hubble Constant with 1 km s −1 Mpc −1 Uncertainty from the Hubble Space Telescope and the SH0ES Team","a":"Adam G. Riess, Wenlong Yuan, Lucas M. Macri et al.","y":2022,"u":"https://doi.org/10.3847/2041-8213/ac5c5b"},{"t":"Planck 2018 results: VI. Cosmological parameters","a":"N. Aghanim, Y. Akrami, M. Ashdown et al.","y":2020,"u":"https://doi.org/10.1051/0004-6361/201833910"}],"rv":null,"fr":{"s":["L'univers est en expansion : plus une galaxie est lointaine, plus elle s'éloigne vite. Le rapport entre les deux s'appelle la constante de Hubble.","On peut la mesurer de deux façons : avec des étoiles et des explosions d'étoiles dans l'univers proche, ou à partir du fond diffus cosmologique, la lumière émise environ 380 000 ans après le début de l'univers, en s'appuyant sur un modèle de l'univers.","Les deux méthodes donnent des valeurs différentes, d'environ 73 et 67 kilomètres par seconde et par mégaparsec."],"i":["Si l'écart vient d'erreurs de mesure non repérées ou d'une physique encore inconnue.","Laquelle des deux valeurs est la bonne."],"d":["Les deux séries de mesures sont devenues très précises : l'écart est plus grand que les incertitudes annoncées.","La comparaison suppose que le modèle cosmologique standard décrit bien l'univers entre le fond diffus et aujourd'hui. S'il est incomplet, la déduction est faussée."],"e":"Si l'écart est réel, le modèle cosmologique actuel est incomplet.","c":["La cosmologie observationnelle.","Un premier pas : comprendre comment on mesure des distances en astronomie, avec des « chandelles standard ».","Les deux articles ci-dessous donnent chacun l'une des deux mesures."]}}},{"id":"supraconducteurs","qq":{"fr":"Pourquoi certains matériaux conduisent-ils sans résistance à des températures relativement élevées ?","en":"Why do some materials conduct without resistance at relatively high temperatures?"},"nmm":{"fr":"Supraconducteurs","en":"High-temperature superconductors"},"cc":{"fr":"On ne sait pas expliquer les supraconducteurs dits « à haute température », découverts en 1986."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[199,124],"t":false,"x":-0.553,"y":-0.6,"f":{"w":{"fr":{"t":"Supraconducteur à haute température","x":"Un supraconducteur à haute température est un matériau supraconducteur présentant une température critique relativement élevée par rapport aux supraconducteurs conventionnels, c'est-à-dire en général à des températures supérieures à 30 K.","u":"https://fr.wikipedia.org/wiki/Supraconducteur_%C3%A0_haute_temp%C3%A9rature"},"en":{"t":"High-temperature superconductivity","x":"High-temperature superconductivity is superconductivity in materials with a critical temperature above 77 K, the boiling point of liquid nitrogen. They are \"high-temperature\" only relative to previously known superconductors, which function only closer to absolute zero. The first high-temperature superconductor was discovered in 1986 by IBM researchers Georg Bednorz and K. Alex Müller.","u":"https://en.wikipedia.org/wiki/High-temperature_superconductivity"}},"r":[{"t":"Possible high Tc superconductivity in the Ba-La-Cu-O system","a":"Johannes Georg Bednorz, K. Alex Müller","y":1986,"u":"https://doi.org/10.1007/BF01303701"},{"t":"From quantum matter to high-temperature superconductivity in copper oxides","a":"B. Keimer, Steven Allan Kivelson, Michael R. Norman et al.","y":2015,"u":"https://doi.org/10.1038/nature14165"}],"rv":null,"fr":{"s":["Un supraconducteur laisse passer le courant électrique sans aucune résistance. Découvert en 1911, il fallait d'abord le refroidir près du zéro absolu.","En 1957, la théorie BCS a expliqué les supraconducteurs classiques : des électrons s'associent par paires grâce aux vibrations du cristal.","En 1986, Bednorz et Müller ont découvert des oxydes de cuivre supraconducteurs à des températures bien plus élevées, ce qui leur a valu le prix Nobel de physique en 1987."],"i":["Pourquoi ces matériaux sont supraconducteurs : la théorie BCS ne s'y applique pas et aucune explication ne fait l'unanimité.","S'il existe un matériau supraconducteur à température ambiante et pression ordinaire. Aucun n'a été confirmé."],"d":["Les électrons y interagissent très fortement entre eux, ce qui rend les calculs exacts impossibles, même avec les plus gros ordinateurs.","Ce sont des cristaux complexes, difficiles à fabriquer proprement et à décrire par un modèle simple."],"e":"Transporter l'électricité sans pertes, fabriquer des aimants puissants moins coûteux à refroidir, et mieux comprendre la matière quand les électrons interagissent fortement.","c":["La physique de la matière condensée.","Un premier pas : comprendre pourquoi une résistance nulle est différente d'une résistance très faible.","Le premier article ci-dessous est la découverte de 1986 ; le second fait le point sur la compréhension actuelle."]}}},{"id":"transition-vitreuse","qq":{"fr":"Qu'est-ce qui fait qu'un liquide devient du verre ?","en":"What turns a liquid into glass?"},"nmm":{"fr":"Transition vitreuse","en":"Glass transition"},"cc":{"fr":"On ne onal heating"},"cc":{"fr":"La couronne solaire est bien plus chaude que la surface. Ce chauffage coronal n'est pas expliqué."},"no":null,"s":"wiki-astro","st":"ouverte","subs":[198,80],"t":false,"x":-0.402,"y":-0.449,"f":null},{"id":"cycle-solaire","qq":{"fr":"Comment le Soleil renverse-t-il son champ magnétique tous les onze ans ?","en":"How does the Sun flip its magnetic field every eleven years?"},"nmm":{"fr":"Cycle solaire","en":"Solar cycle"},"cc":{"fr":"Le cycle solaire est observé depuis longtemps. Le mécanisme qui le produit n'est pas entièrement compris."},"no":null,"s":"wiki-astro","st":"ouverte","subs":[198,80],"t":false,"x":-0.402,"y":-0.449,"f":null},{"id":"sursauts-radio","qq":{"fr":"Qu'est-ce qui produit les sursauts radio rapides ?","en":"What produces fast radio bursts?"},"nmm":{"fr":"Sursauts radio rapides","en":"Fast radio bursts"},"cc":{"fr":"Ces éclairs radio de quelques millisecondes viennent de galaxies lointaines. Certains se répètent à intervalles imprévisibles. Leur cause est inconnue."},"no":null,"s":"wiki-astro","st":"ouverte","subs":[198],"t":false,"x":-0.66,"y":-0.336,"f":null},{"id":"rayons-cosmiques","qq":{"fr":"Qu'est-ce qui accélère les rayons cosmiques les plus énergétiques ?","en":"What accelerates the most energetic cosmic rays?"},"nmm":{"fr":"Rayons cosmiques extrêmes","en":"Extreme cosmic rays"},"cc":{"fr":"Certaines particules arrivent sur Terre avec une énergie immense. On ne sait pas quels phénomènes la leur donnent."},"no":null,"s":"wiki-astro","st":"ouverte","subs":[198,201],"t":false,"x":-0.673,"y":-0.445,"f":null},{"id":"trous-noirs-geants","qq":{"fr":"Comment les trous noirs géants ont-ils pu grossir si vite ?","en":"How did giant black holes grow so fast?"},"nmm":{"fr":"Trous noirs supermassifs","en":"Supermassive black holes"},"cc":{"fr":"On observe des quasars alimentés par des trous noirs énormes alors que l'univers était jeune. Leur croissance rapide pose problème."},"no":null,"s":"wiki-phys","st":"ouverte","subs":[198],"t":false,"x":-0.734,"y":-0.379,"f":null},{"id":"supernova","qq":{"fr":"Comment l'effondrement d'une étoile devient-il une explosion ?","en":"How does a collapsing star turn into an explosion?"},"nmm":{"fr":"Mécanisme des supernovas","en":"How supernovae explode"},"cc":{"fr":"On sait qu'une étoile massive en fin de vie peut exploser en supernova. Le mécanisme exact reste débattu."},"no":null,"s":"wiki-astro","st":"ouverte","subs":[198],"t":false,"x":-0.675,"y":-0.379,"f":null},{"id":"planete-neuf","qq":{"fr":"Existe-t-il d'autres planètes au-delà de Neptune ?","en":"Are there other planets beyond Neptune?"},"nmm":{"fr":"Planètes lointaines","en":"Distant planets"},"cc":{"fr":"Les orbites très étirées de certains objets lointains font soupçonner une grande planète encore non observée. Aucune n'a été trouvée."},"no":null,"s":"wiki-astro","st":"ouverte","subs":[80,198],"t":false,"x":-0.402,"y":-0.449,"f":null},{"id":"systemes-planetaires","qq":{"fr":"Notre système solaire est-il typique ?","en":"Is our solar system typical?"},"nmm":{"fr":"Systèmes planétaires","en":"Planetary systems"},"cc":{"fr":"On a découvert des milliers de planètes autour d'autres étoiles, souvent très différentes des nôtres. On ignore à quel point un système comme le nôtre est courant."},"no":null,"s":"wiki-astro","st":"ouverte","subs":[80,198],"t":false,"x":-0.402,"y":-0.449,"f":null},{"id":"homochiralite","qq":{"fr":"Pourquoi les molécules du vivant n'ont-elles qu'une seule « main » ?","en":"Why are the molecules of life all one-handed?"},"nmm":{"fr":"Chiralité du vivant","en":"Handedness of life"},"cc":{"fr":"Les acides aminés du vivant sont presque tous « gauches » et les sucres « droits ». L'origine de ce choix est inconnue."},"no":null,"s":"wiki-chem","st":"ouverte","subs":[55,25],"t":true,"x":0.317,"y":-0.47,"f":null},{"id":"tableau-periodique","qq":{"fr":"Où s'arrête le tableau périodique ?","en":"Where does the periodic table end?"},"nmm":{"fr":"Éléments superlourds","en":"Superheavy elements"},"cc":{"fr":"On a fabriqué des éléments jusqu'au numéro 118. On ignore s'il existe une limite au nombre d'éléments possibles."},"no":null,"s":"wiki-chem","st":"ouverte","subs":[56,201],"t":false,"x":-0.524,"y":-0.634,"f":null},{"id":"repliement-proteines","qq":{"fr":"Comment une protéine trouve-t-elle sa forme ?","en":"How does a protein find its shape?"},"nmm":{"fr":"Repliement des protéines","en":"Protein folding"},"cc":{"fr":"On sait aujourd'hui prédire la forme de beaucoup de protéines à partir de leur séquence. On comprend moins comment elles la prennent, ou comment se comportent les protéines désordonnées."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[37,25,26],"t":false,"x":0.473,"y":-0.429,"f":{"w":{"fr":{"t":"Repliement des protéines","x":"Le repliement des protéines est le processus physique par lequel un polypeptide se replie dans sa structure tridimensionnelle caractéristique dans laquelle il est fonctionnel.","u":"https://fr.wikipedia.org/wiki/Repliement_des_prot%C3%A9ines"},"en":{"t":"Protein folding","x":"Protein folding is the physical process by which a protein, after synthesis by a ribosome as a linear chain of amino acids, changes from an unstable random coil into a more ordered three-dimensional structure. This structure permits the protein to become biologically functional or active.","u":"https://en.wikipedia.org/wiki/Protein_folding"}},"r":[{"t":"The Protein-Folding Problem, 50 Years On","a":"Ken A. Dill, Justin L. MacCallum","y":2012,"u":"https://doi.org/10.1126/science.1219021"},{"t":"Highly accurate protein structure prediction with AlphaFold","a":"John Jumper, Richard Evans, Alexander Pritzel et al.","y":2021,"u":"https://doi.org/10.1038/s41586-021-03819-2"}],"rv":null,"fr":{"s":["Une protéine est une chaîne d'acides aminés qui se replie en une forme précise. Cette forme décide de sa fonction.","Depuis les expériences d'Anfinsen, dans les années 1960 et 1970, on sait que la séquence d'acides aminés suffit en général à déterminer la forme.","En 2020-2021, le programme AlphaFold, fondé sur l'apprentissage automatique, a prédit avec une grande précision la forme de nombreuses protéines à partir de leur seule séquence."],"i":["Comment la chaîne trouve sa forme en une fraction de seconde parmi un nombre astronomique de possibilités (le « paradoxe de Levinthal »).","Comment se comportent les protéines sans forme fixe, qui ont pourtant une fonction.","Comment une protéine bouge, et ce que change chaque mutation."],"d":["Prédire la forme finale ne dit pas par quel chemin la protéine y arrive : ce chemin est très rapide et difficile à observer.","Un programme d'apprentissage automatique donne un résultat, pas une explication physique."],"e":"Plusieurs maladies sont associées à des protéines mal repliées, et concevoir des médicaments ou de nouvelles enzymes demande de comprendre la forme et le mouvement.","c":["La biophysique et la biologie structurale.","Un premier pas : comprendre pourquoi une chaîne de 100 acides aminés ne peut pas « essayer » toutes les formes possibles.","Le premier article ci-dessous fait le point sur le problème ; le second présente AlphaFold."]}}},{"id":"eau","qq":{"fr":"Pourquoi l'eau a-t-elle des propriétés si étranges ?","en":"Why does water behave so strangely?"},"nmm":{"fr":"Anomalies de l'eau","en":"Water's anomalies"},"cc":{"fr":"L'eau liquide présente de nombreuses anomalies. On étudie le rôle des effets quantiques des atomes d'hydrogène."},"no":null,"s":"wiki-chem","st":"ouverte","subs":[56],"t":false,"x":-0.215,"y":-0.747,"f":null},{"id":"photosynthese-artificielle","qq":{"fr":"Peut-on fabriquer des carburants avec la lumière, à bas coût ?","en":"Can fuels be made from light, cheaply?"},"nmm":{"fr":"Photosynthèse artificielle","en":"Artificial photosynthesis"},"cc":{"fr":"Séparer l'eau avec la lumière pour produire de l'hydrogène marche en laboratoire. Le faire efficacement et à bas prix reste à réussir."},"no":null,"s":"wiki-chem","st":"ouverte","subs":[47,56,88],"t":false,"x":-0.428,"y":-0.709,"f":null},{"id":"ammoniac","qq":{"fr":"Peut-on fabriquer l'ammoniac sans chaleur ni haute pression ?","en":"Can ammonia be made without heat or high pressure?"},"nmm":{"fr":"Ammoniac des engrais","en":"Fertiliser ammonia"},"cc":{"fr":"L'ammoniac des engrais est produit à haute température et sous forte pression. Une méthode à conditions ambiantes, à grande échelle, n'existe pas encore."},"no":null,"s":"wiki-chem","st":"ouverte","subs":[47,54],"t":false,"x":-0.332,"y":-0.744,"f":null},{"id":"sexe","qq":{"fr":"Pourquoi la reproduction sexuée existe-t-elle ?","en":"Why does sexual reproduction exist?"},"nmm":{"fr":"Reproduction sexuée","en":"Sexual reproduction"},"cc":{"fr":"Elle semble moins efficace que le clonage, et pourtant elle domine chez les animaux. Les forces qui l'ont fait naître et qui la maintiennent sont débattues."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[4,33],"t":false,"x":0.524,"y":-0.584,"f":null},{"id":"virus-origine","qq":{"fr":"D'où viennent les virus ?","en":"Where do viruses come from?"},"nmm":{"fr":"Origine des virus","en":"Origin of viruses"},"cc":{"fr":"Plusieurs scénarios existent. On ignore quand et comment les différents groupes de virus sont apparus."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[120,4],"t":false,"x":0.555,"y":-0.551,"f":null},{"id":"eucaryotes","qq":{"fr":"Comment les cellules complexes sont-elles nées ?","en":"How did complex cells arise?"},"nmm":{"fr":"Origine des cellules à noyau","en":"Origin of complex cells"},"cc":{"fr":"Les cellules à noyau résultent d'une fusion ancienne entre cellules. On ignore comment et pourquoi elle s'est produite."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[29,118,4],"t":false,"x":0.652,"y":-0.461,"f":null},{"id":"luca","qq":{"fr":"À quoi ressemblait l'ancêtre commun des bactéries et des archées ?","en":"What did the common ancestor of bacteria and archaea look like?"},"nmm":{"fr":"Ancêtre commun","en":"Last common ancestor"},"cc":{"fr":"Ses caractéristiques ne sont connues qu'avec beaucoup d'incertitude."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[118,34],"t":false,"x":0.733,"y":-0.348,"f":null},{"id":"proteines-inconnues","qq":{"fr":"À quoi servent les protéines dont on ignore le rôle ?","en":"What do the proteins of unknown role do?"},"nmm":{"fr":"Protéines inconnues","en":"Unknown proteins"},"cc":{"fr":"Vingt ans après les premiers génomes d'eucaryotes, le rôle biologique d'environ un cinquième des protéines reste inconnu."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[34,25],"t":false,"x":0.758,"y":-0.311,"f":null},{"id":"taille-cellule","qq":{"fr":"Comment une cellule sait-elle quelle taille atteindre avant de se diviser ?","en":"How does a cell know how big to grow before dividing?"},"nmm":{"fr":"Taille des cellules","en":"Cell size"},"cc":{"fr":"Les cellules se divisent à une taille bien réglée. Comment elles la mesurent n'est pas élucidé."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[29,34],"t":false,"x":0.803,"y":-0.233,"f":null},{"id":"anesthesie","qq":{"fr":"Comment les anesthésiques font-ils perdre conscience ?","en":"How do anaesthetics switch off consciousness?"},"nmm":{"fr":"Anesthésie","en":"Anaesthesia"},"cc":{"fr":"On les utilise tous les jours, mais leur mécanisme d'action n'est pas entièrement compris."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[140,183,184],"t":false,"x":0.651,"y":0.4,"f":{"w":{"fr":{"t":"Anesthésie générale","x":"L'anesthésie générale, ou AG, est un acte médical dont l'objectif principal est la suspension temporaire et réversible de la conscience et de la sensibilité douloureuse, au moyen de médicaments administrés par voie intraveineuse et/ou inhalation.","u":"https://fr.wikipedia.org/wiki/Anesth%C3%A9sie_g%C3%A9n%C3%A9rale"},"en":{"t":"General anaesthesia","x":"General anaesthesia (UK) or general anesthesia (US) is drug-induced loss of consciousness that renders a subject unarousable even by painful stimuli. It is achieved through medications, which can be injected or inhaled, often with an analgesic and neuromuscular blocking agent.","u":"https://en.wikipedia.org/wiki/General_anaesthesia"}},"r":[{"t":"General anaesthesia: from molecular targets to neuronal pathways of sleep and arousal","a":"Nicholas P. Franks","y":2008,"u":"https://doi.org/10.1038/nrn2372"},{"t":"General Anesthesia, Sleep, and Coma","a":"Emery N. Brown, Ralph Lydic, Nicholas D. Schiff","y":2010,"u":"https://doi.org/10.1056/NEJMra0808281"}],"rv":null,"fr":{"s":["Les anesthésiques généraux font perdre conscience de façon réversible. On les utilise en chirurgie depuis le milieu du XIXe siècle.","Ils agissent sur plusieurs protéines des neurones, notamment des récepteurs du GABA, et sur des réseaux de neurones impliqués dans le sommeil et l'éveil.","Des molécules très différentes, gazeuses ou injectées, produisent des effets semblables."],"i":["Comment ces effets sur les molécules mènent à la perte de conscience.","Pourquoi des substances chimiquement très différentes ont des effets proches."],"d":["La conscience elle-même n'est pas expliquée : on ne peut donc pas dire exactement ce qu'on éteint.","Un anesthésique agit à plusieurs niveaux à la fois, des molécules aux réseaux de neurones, ce qui rend ses effets difficiles à isoler."],"e":"Anesthésier plus sûrement, repérer une conscience chez un patient qui ne peut pas répondre, et obtenir des indices sur ce qu'est la conscience.","c":["Les neurosciences cellulaires et la neuroscience de la conscience.","Un premier pas : comprendre en quoi l'anesthésie diffère du sommeil.","Les deux articles ci-dessous font le point sur ce qu'on sait."]}}},{"id":"forme-organes","qq":{"fr":"Comment un organe atteint-il toujours la bonne forme et la bonne taille ?","en":"How does an organ always reach the right shape and size?"},"nmm":{"fr":"Forme des organes","en":"Organ shape"},"cc":{"fr":"La forme et la taille finales des organes sont très fiables. On en comprend seulement une partie des commandes."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[31,29],"t":false,"x":0.821,"y":-0.111,"f":null},{"id":"cambrien","qq":{"fr":"Pourquoi la vie animale s'est-elle diversifiée si vite au Cambrien ?","en":"Why did animal life diversify so fast in the Cambrian?"},"nmm":{"fr":"Explosion du Cambrien","en":"Cambrian explosion"},"cc":{"fr":"Presque tous les grands groupes d'animaux apparaissent dans les fossiles sur une période géologiquement courte. La cause est débattue."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[79,4],"t":false,"x":0.145,"y":-0.783,"f":{"w":{"fr":{"t":"Explosion cambrienne","x":"L’explosion cambrienne désigne l'apparition soudaine – à l'échelle géologique – de la plupart des grands embranchements actuels de métazoaires ainsi que de quelques autres, disparus entre-temps, initiant ainsi une grande diversification des classes et des espèces animales, végétales et bactériennes. Certains auteurs n'hésitent pas à parler de « big bang zoologique au Cambrien », avec l'apparition en quelques dizaines de millions d'années de la quasi-totalité des grands plans d'organisation connus actuellement.","u":"https://fr.wikipedia.org/wiki/Explosion_cambrienne"},"en":{"t":"Cambrian explosion","x":"\nThe Cambrian explosion is a major evolutionary radiation event of the Earth's lifeforms beginning approximately 538.8 million years ago in the early Cambrian period of the Paleozoic era, during which a sudden diversification of complex life occurred in the fossil record.","u":"https://en.wikipedia.org/wiki/Cambrian_explosion"}},"r":[{"t":"EXPLAINING THE CAMBRIAN “EXPLOSION” OF ANIMALS","a":"Charles R. Marshall","y":2006,"u":"https://doi.org/10.1146/annurev.earth.33.031504.103001"},{"t":"The Cambrian Conundrum: Early Divergence and Later Ecological Success in the Early History of Animals","a":"Douglas H. Erwin, Marc Laflamme, Sarah M. Tweedt et al.","y":2011,"u":"https://doi.org/10.1126/science.1206375"}],"rv":null,"fr":{"s":["Les fossiles d'animaux complexes sont rares avant le Cambrien, il y a environ 540 millions d'années. Les couches du Cambrien en contiennent beaucoup, et représentent la plupart des grands groupes d'animaux actuels.","Des organismes plus anciens existaient, comme ceux de l'Édiacarien. La diversification s'est étalée sur quelques dizaines de millions d'années.","Plusieurs explications sont proposées : plus d'oxygène, l'apparition de prédateurs, de nouveaux gènes de développement, des changements de l'environnement."],"i":["Quelle cause, ou quel ensemble de causes, a déclenché cette diversification.","Dans quelle mesure l'« explosion » est réelle, ou due à des lacunes dans les archives fossiles."],"d":["Les fossiles de cette époque sont rares et conservés de façon inégale : seuls les animaux à corps dur ou ceux de sites exceptionnels y figurent.","Les causes possibles sont nombreuses, liées entre elles (chimie des océans, écologie, génétique) et difficiles à séparer."],"e":"Comprendre comment la grande diversité des animaux est née, et ce qui rend possible un changement évolutif rapide.","c":["La paléontologie et la biologie du développement.","Un premier pas : comparer les faunes de l'Édiacarien et du Cambrien.","Les deux articles ci-dessous passent en revue les hypothèses."]}}},{"id":"plancton","qq":{"fr":"Pourquoi tant d'espèces de plancton coexistent-elles ?","en":"Why do so many plankton species coexist?"},"nmm":{"fr":"Paradoxe du plancton","en":"Paradox of the plankton"},"cc":{"fr":"Elles semblent se disputer les mêmes ressources, ce qui devrait en éliminer la plupart : c'est le « paradoxe du plancton »."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[3,106],"t":false,"x":0.334,"y":-0.816,"f":null},{"id":"fleurs","qq":{"fr":"D'où viennent les fleurs ?","en":"Where do flowers come from?"},"nmm":{"fr":"Origine des fleurs","en":"Origin of flowers"},"cc":{"fr":"Darwin parlait d'un « abominable mystère » : les plantes à fleurs semblent apparaître brusquement dans les fossiles."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[9,79],"t":false,"x":0.189,"y":-0.788,"f":null},{"id":"neandertal","qq":{"fr":"Pourquoi les autres espèces humaines ont-elles disparu ?","en":"Why did the other human species die out?"},"nmm":{"fr":"Disparition de Néandertal","en":"Neanderthal extinction"},"cc":{"fr":"Néandertal et d'autres espèces humaines se sont éteints, laissant Homo sapiens seul. Les causes restent débattues."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[225,79,213],"t":true,"x":-0.193,"y":0.203,"f":null},{"id":"groupes-sanguins","qq":{"fr":"À quoi servent les groupes sanguins ?","en":"What are blood types for?"},"nmm":{"fr":"Groupes sanguins","en":"Blood types"},"cc":{"fr":"On ignore leur origine et leur utilité. Des hypothèses existent, par exemple une adaptation au paludisme."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[154,33],"t":false,"x":0.832,"y":-0.199,"f":null},{"id":"navigation-animale","qq":{"fr":"Comment les animaux retrouvent-ils leur chemin sur de très longues distances ?","en":"How do animals find their way over very long distances?"},"nmm":{"fr":"Orientation des animaux","en":"Animal navigation"},"cc":{"fr":"Oiseaux ou papillons monarques regagnent des lieux lointains. Les mécanismes en jeu ne sont pas expliqués."},"no":null,"s":"wiki-bio","st":"ouverte","subs":[2,181],"t":true,"x":0.644,"y":-0.037,"f":null},{"id":"libre-arbitre","qq":{"fr":"Avons-nous un libre arbitre ?","en":"Do we have free will?"},"nmm":{"fr":"Libre arbitre","en":"Free will"},"cc":{"fr":"Des expériences montrent une activité du cerveau avant la décision consciente d'agir, mais leur interprétation est très discutée."},"no":null,"s":"wiki-neuro","st":"ouverte","subs":[184,21],"t":false,"x":0.123,"y":0.776,"f":null},{"id":"binding","qq":{"fr":"Comment le cerveau assemble-t-il couleur, forme et sens en une seule perception ?","en":"How does the brain bind colour, shape and meaning into one percept?"},"nmm":{"fr":"Problème de la liaison","en":"The binding problem"},"cc":{"fr":"C'est le « p
