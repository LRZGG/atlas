1 aient la même ?","en":"How many colours does it take to colour the plane so no two points at distance 1 share one?"},"nmm":{"fr":"Coloriage du plan","en":"Colouring the plane"},"cc":{"fr":"On sait qu'il en faut au moins 5 et que 7 suffisent. La valeur exacte reste inconnue.","en":"At least 5 are needed and 7 suffice. The exact value remains unknown."},"no":null,"s":"wiki-math","st":"ouverte","k":0,"subs":[132,133],"t":false,"x":-0.78,"y":0.073,"f":null,"ia":[]},{"id":"carre-inscrit","qq":{"fr":"Toute courbe fermée contient-elle les quatre sommets d'un carré ?","en":"Does every closed curve contain the four corners of a square?"},"nmm":{"fr":"Carré inscrit","en":"Inscribed square"},"cc":{"fr":"La réponse est oui pour de nombreuses courbes régulières, mais le cas général est ouvert. C'est le problème du carré inscrit.","en":"The answer is yes for many regular curves, but the general case is open. This is the inscribed square problem."},"no":null,"s":"wiki-math","st":"ouverte","k":0,"subs":[133],"t":false,"x":-0.967,"y":0.151,"f":null,"ia":[]},{"id":"ramsey","qq":{"fr":"Combien de personnes faut-il réunir pour que cinq se connaissent toutes, ou cinq ne se connaissent pas du tout ?","en":"How many people must be gathered so that five all know each other, or five are all strangers?"},"nmm":{"fr":"Nombres de Ramsey","en":"Ramsey numbers"},"cc":{"fr":"C'est le nombre de Ramsey R(5,5). On n'en connaît qu'un encadrement.","en":"This is the Ramsey number R(5,5). Only bounds are known."},"no":null,"s":"wiki-math","st":"ouverte","k":0,"subs":[132],"t":false,"x":-0.848,"y":0.006,"f":null,"ia":[]},{"id":"empilement","qq":{"fr":"Quel est le meilleur empilement de sphères en grande dimension ?","en":"What is the best way to pack spheres in high dimensions?"},"nmm":{"fr":"Empilement de sphères","en":"Sphere packing"},"cc":{"fr":"Le problème est résolu seulement en dimensions 1, 2, 3, 8 et 24.","en":"The problem is solved only in dimensions 1, 2, 3, 8 and 24."},"no":null,"s":"wiki-math","st":"ouverte","k":0,"subs":[133,132],"t":false,"x":-0.994,"y":0.029,"f":null,"ia":[{"id":"alphaevolve","q":["empilement","multiplication-matrices"],"st":"assisted","date":"2025-05-14","title":{"fr":"AlphaEvolve : records en empilement et en multiplication de matrices","en":"AlphaEvolve: records in sphere packing and matrix multiplication"},"fr":"Google DeepMind affirme qu'AlphaEvolve, un agent de programmation fondé sur Gemini, a trouvé un algorithme multipliant deux matrices complexes 4×4 avec 48 multiplications scalaires (mieux que Strassen, 1969, dans ce cadre) et une configuration de 593 sphères qui établit une nouvelle borne inférieure du nombre de contact en dimension 11. Sur plus de 50 problèmes ouverts, il aurait retrouvé l'état de l'art dans environ 75 % des cas et l'aurait amélioré dans 20 %. Ce sont des améliorations de bornes, pas des réponses aux questions elles-mêmes. Source : l'annonce du laboratoire (non relue par des pairs ici ; nous n'avons pas vérifié l'article associé).","en":"Google DeepMind says AlphaEvolve, a Gemini-powered coding agent, found an algorithm multiplying two 4×4 complex matrices with 48 scalar multiplications (better than Strassen, 1969, in that setting) and a configuration of 593 spheres setting a new lower bound for the kissing number in 11 dimensions. On more than 50 open problems it reportedly matched the state of the art about 75% of the time and improved it in 20%. These are improved bounds, not answers to the questions themselves. Source: the lab's own announcement (not peer-reviewed here; we did not check the associated paper).","r":[{"t":"AlphaEvolve: a Gemini-powered coding agent for designing advanced algorithms","u":"https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/","a":"AlphaEvolve team, Google DeepMind","y":2025}],"checked":"2026-11-20","lad":[]}]},{"id":"factorisation","qq":{"fr":"Peut-on factoriser rapidement un grand nombre avec un ordinateur ordinaire ?","en":"Can a large number be factored quickly on an ordinary computer?"},"nmm":{"fr":"Factorisation","en":"Integer factorisation"},"cc":{"fr":"On ne connaît aucun algorithme rapide, et une grande part du chiffrement repose sur cette difficulté. Un ordinateur quantique pourrait le faire vite (algorithme de Shor).","en":"No fast algorithm is known, and much of today's encryption relies on this difficulty. A quantum computer could do it quickly (Shor's algorithm)."},"no":null,"s":"wiki-cs","st":"ouverte","k":0,"subs":[138,59],"t":false,"x":-0.809,"y":0.227,"f":{"w":{"fr":{"t":"Décomposition en produit de facteurs premiers","x":"En mathématiques et plus précisément en arithmétique, la décomposition en produit de facteurs premiers, aussi connue comme la factorisation entière en nombres premiers ou encore plus couramment la décomposition en facteurs premiers, consiste à chercher à écrire un entier naturel non nul sous forme d'un produit de nombres premiers. Par exemple, si le nombre donné est 45, la factorisation en nombres premiers est 32 × 5, soit 3 × 3 × 5.","u":"https://fr.wikipedia.org/wiki/D%C3%A9composition_en_produit_de_facteurs_premiers"},"en":{"t":"Integer factorization","x":"In mathematics, integer factorization is the decomposition of a positive integer into a product of integers. Every positive integer greater than 1 is either the product of two or more integer factors greater than 1, in which case it is a composite number, or it is not, in which case it is a prime number. For example, 15 is a composite number because 15 = 3 · 5, but 7 is a prime number because it cannot be decomposed in this way.","u":"https://en.wikipedia.org/wiki/Integer_factorization"}},"r":[{"t":"Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer","a":"Peter W. Shor","y":1997,"u":"https://doi.org/10.1137/S0097539795293172"},{"t":"A method for obtaining digital signatures and public-key cryptosystems","a":"Ronald L. Rivest, Adi Shamir, Leonard M. Adleman","y":1978,"u":"https://doi.org/10.1145/359340.359342"}],"rv":null,"ck":4,"fr":{"s":["Tout entier supérieur à 1 s'écrit de façon unique comme un produit de nombres premiers. Pour de petits nombres, trouver ces facteurs est facile.","Pour de très grands nombres (des centaines de chiffres), les meilleurs algorithmes connus sur un ordinateur ordinaire demandent un temps qui explose avec le nombre de chiffres.","Des systèmes de chiffrement très répandus, comme RSA, reposent sur cette difficulté.","En 1994, Peter Shor a montré qu'un ordinateur quantique assez grand saurait factoriser vite."],"i":["S'il existe un algorithme rapide pour un ordinateur ordinaire. Personne n'en connaît, et personne n'a montré qu'il n'en existe pas.","Si la factorisation est aussi difficile que les problèmes les plus durs de la classe NP. On pense que non, sans l'avoir démontré."],"d":["Prouver qu'aucun algorithme, même inconnu, ne réussit : on ne sait le faire pour presque aucun problème.","Ce problème a une structure particulière qui le rend probablement plus facile que les problèmes NP-complets, sans qu'on sache pour autant qu'il est facile."],"e":"La sécurité d'une grande partie du chiffrement actuel. C'est ce qui motive les travaux sur la cryptographie capable de résister aux ordinateurs quantiques.","c":["La théorie de la complexité et la théorie des nombres.","Un premier pas : factoriser 91, puis 8 633 à la main, et constater comme l'effort grandit.","Les deux articles ci-dessous : celui de Shor sur le calcul quantique, et celui qui a introduit RSA."]},"en":{"s":["Every integer greater than 1 can be written uniquely as a product of primes. For small numbers, finding these factors is easy.","For very large numbers (hundreds of digits), the best known algorithms on an ordinary computer take a time that explodes with the number of digits.","Widely used encryption systems, such as RSA, rely on this difficulty.","In 1994 Peter Shor showed that a large enough quantum computer would factor quickly."],"i":["Whether a fast algorithm exists for an ordinary computer. Nobody knows one, and nobody has shown that none exists.","Whether factoring is as hard as the hardest problems in the class NP. It is thought not, without proof."],"d":["Proving that no algorithm, even an unknown one, succeeds: we know how to do this for almost no problem.","This problem has a special structure that probably makes it easier than NP-complete problems, without us knowing it to be easy."],"e":"The security of much of today's encryption. This motivates work on cryptography able to resist quantum computers.","c":["Complexity theory and number theory.","A first step: factor 91, then 8,633 by hand, and see how the effort grows.","The two articles below: Shor's on quantum computing, and the one that introduced RSA."]}},"ia":[]},{"id":"sens-unique","qq":{"fr":"Existe-t-il des opérations faciles à faire mais impossibles à défaire ?","en":"Are there operations that are easy to do but impossible to undo?"},"nmm":{"fr":"Fonctions à sens unique","en":"One-way functions"},"cc":{"fr":"Ces « fonctions à sens unique » fonderaient la cryptographie moderne. On n'a pas démontré qu'elles existent, ce qui entraînerait que P est différent de NP.","en":"These “one-way functions” would underpin modern cryptography. Their existence has not been proved, which would imply that P differs from NP."},"no":null,"s":"wiki-cs","st":"ouverte","k":0,"subs":[138,59],"t":false,"x":-0.852,"y":0.244,"f":null,"ia":[]},{"id":"isomorphisme-graphes","qq":{"fr":"Peut-on savoir vite si deux réseaux sont identiques ?","en":"Can we quickly tell whether two networks are the same?"},"nmm":{"fr":"Isomorphisme de graphes","en":"Graph isomorphism"},"cc":{"fr":"Pour ce problème d'isomorphisme de graphes, on ne connaît pas d'algorithme rapide en toute généralité, sans avoir montré qu'il n'en existe pas.","en":"For this graph isomorphism problem, no fast algorithm is known in full generality, and it has not been shown that none exists."},"no":null,"s":"wiki-cs","st":"ouverte","k":0,"subs":[138,132],"t":false,"x":-0.949,"y":0.226,"f":null,"ia":[]},{"id":"multiplication-matrices","qq":{"fr":"Quelle est la vitesse limite pour multiplier deux tableaux de nombres ?","en":"What is the speed limit for multiplying two grids of numbers?"},"nmm":{"fr":"Multiplication de matrices","en":"Matrix multiplication"},"cc":{"fr":"On sait faire mieux que la méthode apprise à l'école. Le meilleur algorithme possible reste inconnu.","en":"We can do better than the method learnt at school. The best possible algorithm remains unknown."},"no":null,"s":"wiki-cs","st":"ouverte","k":0,"subs":[59,136],"t":false,"x":-0.765,"y":0.115,"f":null,"ia":[{"id":"alphaevolve","q":["empilement","multiplication-matrices"],"st":"assisted","date":"2025-05-14","title":{"fr":"AlphaEvolve : records en empilement et en multiplication de matrices","en":"AlphaEvolve: records in sphere packing and matrix multiplication"},"fr":"Google DeepMind affirme qu'AlphaEvolve, un agent de programmation fondé sur Gemini, a trouvé un algorithme multipliant deux matrices complexes 4×4 avec 48 multiplications scalaires (mieux que Strassen, 1969, dans ce cadre) et une configuration de 593 sphères qui établit une nouvelle borne inférieure du nombre de contact en dimension 11. Sur plus de 50 problèmes ouverts, il aurait retrouvé l'état de l'art dans environ 75 % des cas et l'aurait amélioré dans 20 %. Ce sont des améliorations de bornes, pas des réponses aux questions elles-mêmes. Source : l'annonce du laboratoire (non relue par des pairs ici ; nous n'avons pas vérifié l'article associé).","en":"Google DeepMind says AlphaEvolve, a Gemini-powered coding agent, found an algorithm multiplying two 4×4 complex matrices with 48 scalar multiplications (better than Strassen, 1969, in that setting) and a configuration of 593 spheres setting a new lower bound for the kissing number in 11 dimensions. On more than 50 open problems it reportedly matched the state of the art about 75% of the time and improved it in 20%. These are improved bounds, not answers to the questions themselves. Source: the lab's own announcement (not peer-reviewed here; we did not check the associated paper).","r":[{"t":"AlphaEvolve: a Gemini-powered coding agent for designing advanced algorithms","u":"https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/","a":"AlphaEvolve team, Google DeepMind","y":2025}],"checked":"2026-11-20","lad":[]}]},{"id":"multiplication-entiers","qq":{"fr":"Quelle est la façon la plus rapide de multiplier deux grands nombres ?","en":"What is the fastest way to multiply two large numbers?"},"nmm":{"fr":"Multiplication de grands nombres","en":"Multiplying large numbers"},"cc":{"fr":"Un algorithme très rapide existe depuis 2019. On ne sait pas s'il est le meilleur possible.","en":"A very fast algorithm has existed since 2019. It is not known whether it is the best possible."},"no":null,"s":"wiki-cs","st":"ouverte","k":0,"subs":[59,138],"t":false,"x":-0.84,"y":0.287,"f":null,"ia":[]},{"id":"hasard-algorithmes","qq":{"fr":"Le hasard rend-il les algorithmes plus rapides ?","en":"Does randomness make algorithms faster?"},"nmm":{"fr":"Hasard et algorithmes","en":"Randomness in algorithms"},"cc":{"fr":"De nombreux algorithmes utilisent le hasard. On pense qu'on peut toujours s'en passer sans perdre de vitesse, mais ce n'est pas démontré.","en":"Many algorithms use randomness. It is believed they can always do without it without losing speed, but this is not proved."},"no":null,"s":"wiki-cs","st":"ouverte","k":0,"subs":[138,59],"t":false,"x":-0.89,"y":0.171,"f":null,"ia":[]},{"id":"programmation-lineaire","qq":{"fr":"Existe-t-il un algorithme vraiment rapide pour la programmation linéaire ?","en":"Is there a truly fast algorithm for linear programming?"},"nmm":{"fr":"Programmation linéaire","en":"Linear programming"},"cc":{"fr":"Ces problèmes d'optimisation sont résolus tous les jours. On ne sait pas s'il existe un algorithme dont la durée ne dépend que de la taille du problème.","en":"These optimisation problems are solved every day. It is not known whether an algorithm exists whose running time depends only on the size of the problem."},"no":null,"s":"wiki-cs","st":"ouverte","k":0,"subs":[71,138],"t":false,"x":-0.759,"y":0.292,"f":null,"ia":[]},{"id":"ordinateur-quantique","qq":{"fr":"Peut-on construire un ordinateur quantique fiable à grande échelle ?","en":"Can a large, reliable quantum computer be built?"},"nmm":{"fr":"Ordinateur quantique","en":"Quantum computer"},"cc":{"fr":"Les qubits sont fragiles et font des erreurs. On cherche à les corriger assez bien pour réaliser de longs calculs.","en":"Qubits are fragile and make errors. The aim is to correct them well enough to run long computations."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[202,59,199],"t":false,"x":-0.76,"y":-0.23,"f":null,"ia":[]},{"id":"inflation","qq":{"fr":"L'univers a-t-il connu une phase d'expansion fulgurante au tout début ?","en":"Did the universe go through a burst of ultra-fast expansion at the very start?"},"nmm":{"fr":"Inflation cosmique","en":"Cosmic inflation"},"cc":{"fr":"La théorie de l'inflation explique pourquoi l'univers est si uniforme, mais elle n'est pas prouvée et ses détails restent inconnus.","en":"The theory of inflation explains why the universe is so uniform, but it is not proved and its details remain unknown."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[198,201],"t":false,"x":-0.725,"y":-0.277,"f":null,"ia":[]},{"id":"antimatiere","qq":{"fr":"Pourquoi l'univers contient-il de la matière et presque pas d'antimatière ?","en":"Why does the universe contain matter and almost no antimatter?"},"nmm":{"fr":"Matière et antimatière","en":"Matter and antimatter"},"cc":{"fr":"Les modèles prévoient des quantités égales au début de l'univers. Les observations montrent surtout de la matière.","en":"Models predict equal amounts at the beginning of the universe. Observations show mostly matter."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[201,198],"t":false,"x":-0.764,"y":-0.433,"f":null,"ia":[]},{"id":"trous-noirs-info","qq":{"fr":"Que devient l'information qui tombe dans un trou noir ?","en":"What happens to information that falls into a black hole?"},"nmm":{"fr":"Information et trous noirs","en":"Black holes and information"},"cc":{"fr":"Les trous noirs émettent un rayonnement qui, d'après la théorie, semble effacer l'information. Cela contredit la mécanique quantique.","en":"Black holes emit radiation which, according to theory, seems to erase information. This contradicts quantum mechanics."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[198,134],"t":false,"x":-0.756,"y":-0.155,"f":{"w":{"fr":{"t":"Paradoxe de l'information","x":"En astrophysique, le paradoxe de l'information est un paradoxe mis en évidence par Stephen Hawking en 1976 opposant les lois de la mécanique quantique à celles de la relativité générale. En effet, la relativité générale implique qu'une information pourrait fondamentalement disparaître dans un trou noir, à la suite de l'évaporation de celui-ci.","u":"https://fr.wikipedia.org/wiki/Paradoxe_de_l'information"},"en":{"t":"Black hole information paradox","x":"The black hole information paradox is an unsolved problem in physics and a paradox that appears when the predictions of quantum mechanics and general relativity are combined. The theory of general relativity predicts the existence of black holes that are regions of spacetime from which nothing—not even light—can escape. In the 1970s, Stephen Hawking applied the semiclassical approach of quantum field theory in curved spacetime to such systems and found that an isolated black hole would emit a form of radiation.","u":"https://en.wikipedia.org/wiki/Black_hole_information_paradox"}},"r":[{"t":"Particle creation by black holes","a":"Stephen William Hawking","y":1975,"u":"https://doi.org/10.1007/BF02345020"},{"t":"The entropy of Hawking radiation","a":"Ahmed Almheiri, Thomas Hartman, JUAN M. MALDACENA et al.","y":2021,"u":"https://doi.org/10.1103/RevModPhys.93.035002"}],"rv":null,"ck":3,"fr":{"s":["D'après la relativité générale, un trou noir est une région d'où rien ne ressort, pas même la lumière.","En 1974-1975, Stephen Hawking a montré qu'en tenant compte de la physique quantique, un trou noir émet un faible rayonnement et perd de la masse, au point de pouvoir disparaître.","Ce rayonnement, tel que Hawking l'a calculé, est thermique : il ne semble rien porter de ce qui est tombé dans le trou noir."],"i":["Si l'information sur ce qui est tombé dans un trou noir est perdue pour toujours, ou si elle ressort d'une façon ou d'une autre. La mécanique quantique dit qu'elle ne peut pas être détruite.","Des calculs récents, à partir de 2019, obtiennent un rayonnement compatible avec la conservation de l'information. Ils reposent sur des hypothèses et ne règlent pas toute la question."],"d":["Il n'existe pas de théorie quantique de la gravité : le problème se pose exactement là où la relativité et la mécanique quantique se heurtent.","Le rayonnement d'un trou noir astrophysique est bien trop faible pour être observé : aucune expérience ne peut trancher aujourd'hui."],"e":"C'est un banc d'essai pour toute théorie qui voudrait unifier la gravité et la mécanique quantique.","c":["La relativité générale, la théorie quantique des champs, puis la gravité quantique.","Un premier pas : comprendre pourquoi détruire de l'information contredirait la mécanique quantique.","Le premier article ci-dessous est celui de Hawking ; le second fait le point sur les calculs récents."]},"en":{"s":["According to general relativity, a black hole is a region from which nothing comes back, not even light.","In 1974–1975 Stephen Hawking showed that, taking quantum physics into account, a black hole emits faint radiation and loses mass, to the point of possibly disappearing.","This radiation, as Hawking computed it, is thermal: it does not seem to carry anything of what fell into the black hole."],"i":["Whether the information about what fell into a black hole is lost for ever, or comes back out in some way. Quantum mechanics says it cannot be destroyed.","Calculations since 2019 obtain radiation compatible with the conservation of information. They rely on assumptions and do not settle the whole question."],"d":["There is no quantum theory of gravity: the problem arises exactly where relativity and quantum mechanics collide.","The radiation of an astrophysical black hole is far too faint to be observed: no experiment can settle it today."],"e":"It is a test bench for any theory that would unify gravity and quantum mechanics.","c":["General relativity, quantum field theory, then quantum gravity.","A first step: understand why destroying information would contradict quantum mechanics.","The first article below is Hawking's; the second reviews recent calculations."]}},"ia":[]},{"id":"fleche-temps","qq":{"fr":"Pourquoi le temps a-t-il un sens ?","en":"Why does time have a direction?"},"nmm":{"fr":"Flèche du temps","en":"Arrow of time"},"cc":{"fr":"Les lois de la physique fonctionnent presque aussi bien à l'envers. On ignore pourquoi l'univers avait une entropie si basse au départ.","en":"The laws of physics work almost as well backwards. We do not know why the universe had such low entropy at the start."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[204,17],"t":true,"x":-0.539,"y":0.255,"f":null,"ia":[]},{"id":"neutrinos","qq":{"fr":"Quelle est la masse des neutrinos ?","en":"What is the mass of neutrinos?"},"nmm":{"fr":"Masse des neutrinos","en":"Neutrino mass"},"cc":{"fr":"On sait que les neutrinos ont une masse, pas sa valeur. On ne sait pas non plus s'ils sont leur propre antiparticule.","en":"We know neutrinos have a mass, but not its value. We also do not know whether they are their own antiparticle."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[201],"t":false,"x":-0.737,"y":-0.479,"f":{"w":{"fr":{"t":"Neutrino","x":"Le neutrino est une particule élémentaire du modèle standard de la physique des particules. Les neutrinos sont des fermions de spin ½, plus précisément des leptons. Ils sont électriquement neutres. Il en existe trois « saveurs » : électronique, muonique et tauique.","u":"https://fr.wikipedia.org/wiki/Neutrino"},"en":{"t":"Neutrino","x":"A neutrino is an elementary particle that interacts with other matter only via the weak interaction and gravity. It is electrically neutral, and its mass is so small that it was long thought to be zero.\nNeutrinos usually pass through other matter with no detectable effect because the weak force has a very short range, and their gravitational interaction is extremely weak due to the tiny mass of the neutrino.","u":"https://en.wikipedia.org/wiki/Neutrino"}},"r":[{"t":"Evidence for Oscillation of Atmospheric Neutrinos","a":"Y. Fukuda, Tomokatsu Hayakawa, E. Ichihara et al.","y":1998,"u":"https://doi.org/10.1103/PhysRevLett.81.1562"}],"rv":null,"ck":0,"fr":{"s":["Les neutrinos sont des particules très légères et très nombreuses, qui interagissent très peu avec la matière.","En 1998, l'expérience Super-Kamiokande a montré que les neutrinos changent de type en voyageant (oscillation), ce qui implique qu'ils ont une masse.","Les différences de masse entre types sont mesurées, mais pas les masses elles-mêmes."],"i":["La masse de chaque neutrino.","S'ils sont leur propre antiparticule (neutrinos de Majorana) ou non.","L'ordre de leurs masses (hiérarchie normale ou inversée)."],"d":["Leur interaction est si faible qu'il faut de très grands détecteurs pour en voir quelques-uns.","La masse est si petite qu'elle est difficile à mesurer directement."],"e":"Leur masse ne rentre pas dans le modèle standard : la connaître indique ce qu'il y a au-delà, et pourrait expliquer pourquoi l'univers contient plus de matière que d'antimatière.","c":["La physique des particules.","Un premier pas : comprendre l'oscillation des neutrinos.","L'article ci-dessous est celui de Super-Kamiokande en 1998."]},"en":{"s":["Neutrinos are very light, very numerous particles that interact very little with matter.","In 1998 the Super-Kamiokande experiment showed that neutrinos change type as they travel (oscillation), which implies they have mass.","Mass differences between types are measured, but not the masses themselves."],"i":["The mass of each neutrino.","Whether they are their own antiparticle (Majorana neutrinos) or not.","The ordering of their masses (normal or inverted hierarchy)."],"d":["Their interaction is so weak that very large detectors are needed to see a few of them.","The mass is so small that it is hard to measure directly."],"e":"Their mass does not fit in the standard model: knowing it points to what lies beyond, and could explain why the universe contains more matter than antimatter.","c":["Particle physics.","A first step: understand neutrino oscillation.","The article below is the Super-Kamiokande paper of 1998."]}},"ia":[]},{"id":"proton","qq":{"fr":"Le proton est-il éternel ?","en":"Is the proton eternal?"},"nmm":{"fr":"Stabilité du proton","en":"Proton stability"},"cc":{"fr":"Certaines extensions de la physique actuelle prévoient qu'il se désintègre, très lentement. Aucune désintégration n'a été observée.","en":"Some extensions of current physics predict that it decays, very slowly. No decay has been observed."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[201],"t":false,"x":-0.755,"y":-0.317,"f":null,"ia":[]},{"id":"confinement","qq":{"fr":"Pourquoi ne peut-on jamais isoler un quark ?","en":"Why can a quark never be isolated?"},"nmm":{"fr":"Confinement des quarks","en":"Quark confinement"},"cc":{"fr":"Les quarks n'existent qu'enfermés dans des particules. Ce confinement n'est pas démontré mathématiquement.","en":"Quarks exist only locked inside particles. This confinement has not been proved mathematically."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[201,134],"t":false,"x":-0.784,"y":-0.192,"f":null,"ia":[]},{"id":"generations","qq":{"fr":"Pourquoi les particules existent-elles en trois familles ?","en":"Why do particles come in three families?"},"nmm":{"fr":"Trois générations","en":"Three generations"},"cc":{"fr":"Quarks et leptons se répartissent en trois générations de plus en plus lourdes. Aucune théorie n'explique ce nombre ni les masses.","en":"Quarks and leptons come in three generations of increasing mass. No theory explains this number or the masses."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[201],"t":false,"x":-0.719,"y":-0.438,"f":null,"ia":[]},{"id":"forme-univers","qq":{"fr":"Quelle est la forme de l'univers ?","en":"What is the shape of the universe?"},"nmm":{"fr":"Forme de l'univers","en":"Shape of the universe"},"cc":{"fr":"On ne connaît que la partie observable. On ignore si l'espace entier est infini ou fini, et comment il se referme.","en":"We know only the observable part. We do not know whether the whole of space is infinite or finite, or how it closes up."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[198,133],"t":false,"x":-0.791,"y":-0.126,"f":null,"ia":[]},{"id":"tension-hubble","qq":{"fr":"Pourquoi deux mesures de l'expansion de l'univers donnent-elles des valeurs différentes ?","en":"Why do two measurements of the universe's expansion disagree?"},"nmm":{"fr":"Tension sur l'expansion","en":"Hubble tension"},"cc":{"fr":"La vitesse d'expansion mesurée dans l'univers proche diffère de celle déduite de l'univers primitif. Erreur de mesure ou physique nouvelle ?","en":"The expansion rate measured in the nearby universe differs from the one inferred from the early universe. Measurement error or new physics?"},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[198],"t":false,"x":-0.669,"y":-0.231,"f":{"w":{"fr":{"t":"Tension de Hubble","x":"La tension de Hubble est la différence de mesure de la constante de Hubble qui apparaît entre la méthode directe et la méthode utilisant le fond diffus cosmologique. Cette mesure de la vitesse de fuite des objets extragalactiques varie d'environ 8 % selon ces techniques de mesures.","u":"https://fr.wikipedia.org/wiki/Tension_de_Hubble"}},"r":[{"t":"A Comprehensive Measurement of the Local Value of the Hubble Constant with 1 km s −1 Mpc −1 Uncertainty from the Hubble Space Telescope and the SH0ES Team","a":"Adam G. Riess, Wenlong Yuan, Lucas M. Macri et al.","y":2022,"u":"https://doi.org/10.3847/2041-8213/ac5c5b"},{"t":"Planck 2018 results: VI. Cosmological parameters","a":"N. Aghanim, Y. Akrami, M. Ashdown et al.","y":2020,"u":"https://doi.org/10.1051/0004-6361/201833910"}],"rv":null,"ck":3,"fr":{"s":["L'univers est en expansion : plus une galaxie est lointaine, plus elle s'éloigne vite. Le rapport entre les deux s'appelle la constante de Hubble.","On peut la mesurer de deux façons : avec des étoiles et des explosions d'étoiles dans l'univers proche, ou à partir du fond diffus cosmologique, la lumière émise environ 380 000 ans après le début de l'univers, en s'appuyant sur un modèle de l'univers.","Les deux méthodes donnent des valeurs différentes, d'environ 73 et 67 kilomètres par seconde et par mégaparsec."],"i":["Si l'écart vient d'erreurs de mesure non repérées ou d'une physique encore inconnue.","Laquelle des deux valeurs est la bonne."],"d":["Les deux séries de mesures sont devenues très précises : l'écart est plus grand que les incertitudes annoncées.","La comparaison suppose que le modèle cosmologique standard décrit bien l'univers entre le fond diffus et aujourd'hui. S'il est incomplet, la déduction est faussée."],"e":"Si l'écart est réel, le modèle cosmologique actuel est incomplet.","c":["La cosmologie observationnelle.","Un premier pas : comprendre comment on mesure des distances en astronomie, avec des « chandelles standard ».","Les deux articles ci-dessous donnent chacun l'une des deux mesures."]},"en":{"s":["The universe is expanding: the farther a galaxy, the faster it recedes. The ratio between the two is called the Hubble constant.","It can be measured in two ways: with stars and exploding stars in the nearby universe, or from the cosmic microwave background, the light emitted about 380,000 years after the start of the universe, relying on a model of the universe.","The two methods give different values, about 73 and 67 kilometres per second per megaparsec."],"i":["Whether the gap comes from unnoticed measurement errors or from still unknown physics.","Which of the two values is right."],"d":["Both series of measurements have become very precise: the gap is larger than the stated uncertainties.","The comparison assumes the standard cosmological model describes the universe well between the microwave background and today. If it is incomplete, the inference is skewed."],"e":"If the gap is real, the current cosmological model is incomplete.","c":["Observational cosmology.","A first step: understand how distances are measured in astronomy, with “standard candles”.","The two articles below each give one of the two measurements."]}},"ia":[]},{"id":"supraconducteurs","qq":{"fr":"Pourquoi certains matériaux conduisent-ils sans résistance à des températures relativement élevées ?","en":"Why do some materials conduct without resistance at relatively high temperatures?"},"nmm":{"fr":"Supraconducteurs","en":"High-temperature superconductors"},"cc":{"fr":"On ne sait pas expliquer les supraconducteurs dits « à haute température », découverts en 1986.","en":"We cannot explain the so-called “high-temperature” superconductors, discovered in 1986."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[199,124],"t":false,"x":-0.621,"y":-0.53,"f":{"w":{"fr":{"t":"Supraconducteur à haute température","x":"Un supraconducteur à haute température est un matériau supraconducteur présentant une température critique relativement élevée par rapport aux supraconducteurs conventionnels, c'est-à-dire en général à des températures supérieures à 30 K.","u":"https://fr.wikipedia.org/wiki/Supraconducteur_%C3%A0_haute_temp%C3%A9rature"},"en":{"t":"High-temperature superconductivity","x":"High-temperature superconductivity is superconductivity in materials with a critical temperature above 77 K, the boiling point of liquid nitrogen. They are \"high-temperature\" only relative to previously known superconductors, which function only closer to absolute zero. The first high-temperature superconductor was discovered in 1986 by IBM researchers Georg Bednorz and K. Alex Müller.","u":"https://en.wikipedia.org/wiki/High-temperature_superconductivity"}},"r":[{"t":"Possible high Tc superconductivity in the Ba-La-Cu-O system","a":"Johannes Georg Bednorz, K. Alex Müller","y":1986,"u":"https://doi.org/10.1007/BF01303701"},{"t":"From quantum matter to high-temperature superconductivity in copper oxides","a":"B. Keimer, Steven Allan Kivelson, Michael R. Norman et al.","y":2015,"u":"https://doi.org/10.1038/nature14165"}],"rv":null,"ck":6,"fr":{"s":["Un supraconducteur laisse passer le courant électrique sans aucune résistance. Découvert en 1911, il fallait d'abord le refroidir près du zéro absolu.","En 1957, la théorie BCS a expliqué les supraconducteurs classiques : des électrons s'associent par paires grâce aux vibrations du cristal.","En 1986, Bednorz et Müller ont découvert des oxydes de cuivre supraconducteurs à des températures bien plus élevées, ce qui leur a valu le prix Nobel de physique en 1987."],"i":["Pourquoi ces matériaux sont supraconducteurs : la théorie BCS ne s'y applique pas et aucune explication ne fait l'unanimité.","S'il existe un matériau supraconducteur à température ambiante et pression ordinaire. Aucun n'a été confirmé."],"d":["Les électrons y interagissent très fortement entre eux, ce qui rend les calculs exacts impossibles, même avec les plus gros ordinateurs.","Ce sont des cristaux complexes, difficiles à fabriquer proprement et à décrire par un modèle simple."],"e":"Transporter l'électricité sans pertes, fabriquer des aimants puissants moins coûteux à refroidir, et mieux comprendre la matière quand les électrons interagissent fortement.","c":["La physique de la matière condensée.","Un premier pas : comprendre pourquoi une résistance nulle est différente d'une résistance très faible.","Le premier article ci-dessous est la découverte de 1986 ; le second fait le point sur la compréhension actuelle."]},"en":{"s":["A superconductor lets electric current through with no resistance at all. Discovered in 1911, it first had to be cooled close to absolute zero.","In 1957 BCS theory explained classical superconductors: electrons pair up thanks to the vibrations of the crystal.","In 1986 Bednorz and Müller discovered copper oxides that are superconducting at much higher temperatures, which earned them the Nobel Prize in Physics in 1987."],"i":["Why these materials are superconducting: BCS theory does not apply to them and no explanation is unanimously accepted.","Whether a room-temperature, ordinary-pressure superconductor exists. None has been confirmed."],"d":["Electrons interact very strongly with one another, which makes exact calculations impossible, even with the biggest computers.","These are complex crystals, hard to make cleanly and to describe with a simple model."],"e":"Carrying electricity without losses, making powerful magnets that are cheaper to cool, and better understanding matter when electrons interact strongly.","c":["Condensed matter physics.","A first step: understand why zero resistance is different from very low resistance.","The first article below is the 1986 discovery; the second reviews the current understanding."]}},"ia":[]},{"id":"transition-vitreuse","qq":{"fr":"Qu'est-ce qui fait qu'un liquide devient du verre ?","en":"What turns a liquid into glass?"},"nmm":{"fr":"Transition vitreuse","en":"Glass transition"},"cc":{"fr":"On ne sait pas expliquer précisément le passage d'un liquide à un solide désordonné.","en":"We cannot precisely explain the passage from a liquid to a disordered solid."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[199,204],"t":false,"x":-0.808,"y":-0.399,"f":null,"ia":[]},{"id":"turbulence","qq":{"fr":"Peut-on prédire la turbulence ?","en":"Can turbulence be predicted?"},"nmm":{"fr":"Turbulence","en":"Turbulence"},"cc":{"fr":"On ne dispose pas d'une théorie complète des écoulements turbulents ni de leurs structures internes.","en":"There is no complete theory of turbulent flows or of their internal structures."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[204,50],"t":false,"x":-0.77,"y":-0.275,"f":null,"ia":[]},{"id":"energie-du-vide","qq":{"fr":"Pourquoi l'énergie du vide est-elle si faible ?","en":"Why is the energy of empty space so small?"},"nmm":{"fr":"Énergie du vide","en":"Vacuum energy"},"cc":{"fr":"La physique quantique prédit une énergie du vide immense. Celle qu'on observe est incomparablement plus petite.","en":"Quantum physics predicts an enormous vacuum energy. The one we observe is incomparably smaller."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[201,198],"t":false,"x":-0.708,"y":-0.318,"f":null,"ia":[]},{"id":"champs-magnetiques-cosmiques","qq":{"fr":"D'où viennent les champs magnétiques de l'univers ?","en":"Where do the universe's magnetic fields come from?"},"nmm":{"fr":"Champs magnétiques cosmiques","en":"Cosmic magnetic fields"},"cc":{"fr":"On en observe dans les galaxies et les amas de galaxies. Leur origine n'est pas expliquée.","en":"They are observed in galaxies and galaxy clusters. Their origin is not explained."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[198],"t":false,"x":-0.806,"y":-0.247,"f":null,"ia":[]},{"id":"magnetoreception","qq":{"fr":"Comment les animaux sentent-ils le champ magnétique de la Terre ?","en":"How do animals sense the Earth's magnetic field?"},"nmm":{"fr":"Sens magnétique","en":"Magnetic sense"},"cc":{"fr":"Des oiseaux migrateurs s'y repèrent. Le mécanisme n'est pas élucidé.","en":"Migratory birds find their way by it. The mechanism is not elucidated."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[188,26],"t":true,"x":0.425,"y":-0.132,"f":null,"ia":[]},{"id":"couronne-solaire","qq":{"fr":"Pourquoi l'atmosphère du Soleil est-elle plus chaude que sa surface ?","en":"Why is the Sun's atmosphere hotter than its surface?"},"nmm":{"fr":"Chauffage de la couronne","en":"Coronal heating"},"cc":{"fr":"La couronne solaire est bien plus chaude que la surface. Ce chauffage coronal n'est pas expliqué.","en":"The solar corona is far hotter than the surface. This coronal heating is not explained."},"no":null,"s":"wiki-astro","st":"ouverte","k":0,"subs":[198,80],"t":false,"x":-0.452,"y":-0.401,"f":null,"ia":[]},{"id":"cycle-solaire","qq":{"fr":"Comment le Soleil renverse-t-il son champ magnétique tous les onze ans ?","en":"How does the Sun flip its magnetic field every eleven years?"},"nmm":{"fr":"Cycle solaire","en":"Solar cycle"},"cc":{"fr":"Le cycle solaire est observé depuis longtemps. Le mécanisme qui le produit n'est pas entièrement compris.","en":"The solar cycle has long been observed. The mechanism producing it is not fully understood."},"no":null,"s":"wiki-astro","st":"ouverte","k":0,"subs":[198,80],"t":false,"x":-0.452,"y":-0.401,"f":null,"ia":[]},{"id":"sursauts-radio","qq":{"fr":"Qu'est-ce qui produit les sursauts radio rapides ?","en":"What produces fast radio bursts?"},"nmm":{"fr":"Sursauts radio rapides","en":"Fast radio bursts"},"cc":{"fr":"Ces éclairs radio de quelques millisecondes viennent de galaxies lointaines. Certains se répètent à intervalles imprévisibles. Leur cause est inconnue.","en":"These radio flashes of a few milliseconds come from distant galaxies. Some repeat at unpredictable intervals. Their cause is unknown."},"no":null,"s":"wiki-astro","st":"ouverte","k":0,"subs":[198],"t":false,"x":-0.764,"y":-0.388,"f":null,"ia":[]},{"id":"rayons-cosmiques","qq":{"fr":"Qu'est-ce qui accélère les rayons cosmiques les plus énergétiques ?","en":"What accelerates the most energetic cosmic rays?"},"nmm":{"fr":"Rayons cosmiques extrêmes","en":"Extreme cosmic rays"},"cc":{"fr":"Certaines particules arrivent sur Terre avec une énergie immense. On ne sait pas quels phénomènes la leur donnent.","en":"Some particles reach Earth with immense energy. We do not know which phenomena give it to them."},"no":null,"s":"wiki-astro","st":"ouverte","k":0,"subs":[198,201],"t":false,"x":-0.801,"y":-0.307,"f":null,"ia":[]},{"id":"trous-noirs-geants","qq":{"fr":"Comment les trous noirs géants ont-ils pu grossir si vite ?","en":"How did giant black holes grow so fast?"},"nmm":{"fr":"Trous noirs supermassifs","en":"Supermassive black holes"},"cc":{"fr":"On observe des quasars alimentés par des trous noirs énormes alors que l'univers était jeune. Leur croissance rapide pose problème.","en":"Quasars powered by enormous black holes are observed when the universe was young. Their rapid growth is a problem."},"no":null,"s":"wiki-phys","st":"ouverte","k":0,"subs":[198],"t":false,"x":-0.675,"y":-0.363,"f":null,"ia":[]},{"id":"supernova","qq":{"fr":"Comment l'effondrement d'une étoile devient-il une explosion ?","en":"How does a collapsing star turn into an explosion?"},"nmm":{"fr":"Mécanisme des supernovas","en":"How supernovae explode"},"cc":{"fr":"On sait qu'une étoile massive en fin de vie peut exploser en supernova. Le mécanisme exact reste débattu.","en":"We know a massive star at the end of its life can explode as a supernova. The exact mechanism remains debated."},"no":null,"s":"wiki-astro","st":"ouverte","k":0,"subs":[198],"t":false,"x":-0.846,"y":-0.301,"f":null,"ia":[]},{"id":"planete-neuf","qq":{"fr":"Existe-t-il d'autres planètes au-delà de Neptune ?","en":"Are there other planets beyond Neptune?"},"nmm":{"fr":"Planètes lointaines","en":"Distant planets"},"cc":{"fr":"Les orbites très étirées de certains objets lointains font soupçonner une grande planète encore non observée. Aucune n'a été trouvée.","en":"The very elongated orbits of some distant objects suggest a large, still unobserved planet. None has been found."},"no":null,"s":"wiki-astro","st":"ouverte","k":0,"subs":[80,198],"t":false,"x":-0.452,"y":-0.401,"f":null,"ia":[]},{"id":"systemes-planetaires","qq":{"fr":"Notre système solaire est-il typique ?","en":"Is our solar system typical?"},"nmm":{"fr":"Systèmes planétaires","en":"Planetary systems"},"cc":{"fr":"On a découvert des milliers de planètes autour d'autres étoiles, souvent très différentes des nôtres. On ignore à quel point un système comme le nôtre est courant.","en":"Thousands of planets have been found around other stars, often very different from ours. How common a system like ours is remains unknown."},"no":null,"s":"wiki-astro","st":"ouverte","k":0,"subs":[80,198],"t":false,"x":-0.452,"y":-0.401,"f":null,"ia":[]},{"id":"homochiralite","qq":{"fr":"Pourquoi les molécules du vivant n'ont-elles qu'une seule « main » ?","en":"Why are the molecules of life all one-handed?"},"nmm":{"fr":"Chiralité du vivant","en":"Handedness of life"},"cc":{"fr":"Les acides aminés du vivant sont presque tous « gauches » et les sucres « droits ». L'origine de ce choix est inconnue.","en":"The amino acids of living things are almost all “left-handed” and sugars “right-handed”. The origin of this choice is unknown."},"no":null,"s":"wiki-chem","st":"ouverte","k":0,"subs":[55,25],"t":true,"x":0.255,"y":-0.503,"f":null,"ia":[]},{"id":"tableau-periodique","qq":{"fr":"Où s'arrête le tableau périodique ?","en":"Where does the periodic table end?"},"nmm":{"fr":"Éléments superlourds","en":"Superheavy elements"},"cc":{"fr":"On a fabriqué des éléments jusqu'au numéro 118. On ignore s'il existe une limite au nombre d'éléments possibles.","en":"Elements up to number 118 have been made. Whether there is a limit to the number of possible elements is unknown."},"no":null,"s":"wiki-chem","st":"ouverte","k":0,"subs":[56,201],"t":false,"x":-0.597,"y":-0.568,"f":null,"ia":[]},{"id":"repliement-proteines","qq":{"fr":"Comment une protéine trouve-t-elle sa forme ?","en":"How does a protein find its shape?"},"nmm":{"fr":"Repliement des protéines","en":"Protein folding"},"cc":{"fr":"On sait aujourd'hui prédire la forme de beaucoup de protéines à partir de leur séquence. On comprend moins comment elles la prennent, ou comment se comportent les protéines désordonnées.","en":"We can now predict the shape of many proteins from their sequence. How they take it, or how disordered proteins behave, is less well understood."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[37,25,26],"t":false,"x":0.418,"y":-0.475,"f":{"w":{"fr":{"t":"Repliement des protéines","x":"Le repliement des protéines est le processus physique par lequel un polypeptide se replie dans sa structure tridimensionnelle caractéristique dans laquelle il est fonctionnel.","u":"https://fr.wikipedia.org/wiki/Repliement_des_prot%C3%A9ines"},"en":{"t":"Protein folding","x":"Protein folding is the physical process by which a protein, after synthesis by a ribosome as a linear chain of amino acids, changes from an unstable random coil into a more ordered three-dimensional structure. This structure permits the protein to become biologically functional or active.","u":"https://en.wikipedia.org/wiki/Protein_folding"}},"r":[{"t":"The Protein-Folding Problem, 50 Years On","a":"Ken A. Dill, Justin L. MacCallum","y":2012,"u":"https://doi.org/10.1126/science.1219021"},{"t":"Highly accurate protein structure prediction with AlphaFold","a":"John Jumper, Richard Evans, Alexander Pritzel et al.","y":2021,"u":"https://doi.org/10.1038/s41586-021-03819-2"}],"rv":null,"ck":4,"fr":{"s":["Une protéine est une chaîne d'acides aminés qui se replie en une forme précise. Cette forme décide de sa fonction.","Depuis les expériences d'Anfinsen, dans les années 1960 et 1970, on sait que la séquence d'acides aminés suffit en général à déterminer la forme.","En 2020-2021, le programme AlphaFold, fondé sur l'apprentissage automatique, a prédit avec une grande précision la forme de nombreuses protéines à partir de leur seule séquence."],"i":["Comment la chaîne trouve sa forme en une fraction de seconde parmi un nombre astronomique de possibilités (le « paradoxe de Levinthal »).","Comment se comportent les protéines sans forme fixe, qui ont pourtant une fonction.","Comment une protéine bouge, et ce que change chaque mutation."],"d":["Prédire la forme finale ne dit pas par quel chemin la protéine y arrive : ce chemin est très rapide et difficile à observer.","Un programme d'apprentissage automatique donne un résultat, pas une explication physique."],"e":"Plusieurs maladies sont associées à des protéines mal repliées, et concevoir des médicaments ou de nouvelles enzymes demande de comprendre la forme et le mouvement.","c":["La biophysique et la biologie structurale.","Un premier pas : comprendre pourquoi une chaîne de 100 acides aminés ne peut pas « essayer » toutes les formes possibles.","Le premier article ci-dessous fait le point sur le problème ; le second présente AlphaFold."]},"en":{"s":["A protein is a chain of amino acids that folds into a precise shape. This shape decides its function.","Since Anfinsen's experiments in the 1960s and 1970s, we know that the amino acid sequence generally suffices to determine the shape.","In 2020–2021 the AlphaFold program, based on machine learning, predicted with high accuracy the shape of many proteins from their sequence alone."],"i":["How the chain finds its shape in a fraction of a second among an astronomical number of possibilities (“Levinthal's paradox”).","How proteins with no fixed shape behave, which nonetheless have a function.","How a protein moves, and what each mutation changes."],"d":["Predicting the final shape does not say by which path the protein gets there: this path is very fast and hard to observe.","A machine-learning program gives a result, not a physical explanation."],"e":"Several diseases are associated with misfolded proteins, and designing drugs or new enzymes requires understanding shape and movement.","c":["Biophysics and structural biology.","A first step: understand why a chain of 100 amino acids cannot “try” all possible shapes.","The first article below reviews the problem; the second presents AlphaFold."]}},"ia":[{"id":"alphafold","q":["repliement-proteines"],"st":"related","date":"2024-10-09","title":{"fr":"AlphaFold : prédire la forme des protéines","en":"AlphaFold: predicting protein shapes"},"fr":"AlphaFold prédit la structure en 3D d'une protéine à partir de sa séquence. D'après la page de DeepMind, les organisateurs du concours CASP14 ont reconnu en 2020 AlphaFold2 comme une solution au « problème du repliement », et Demis Hassabis et John Jumper ont reçu le prix Nobel de chimie 2024 (avec David Baker). Prédire la forme finale n'explique pas comment la protéine la trouve : la question de la carte reste donc ouverte. Sources : la page du laboratoire seulement (la page du prix Nobel n'a pas pu être lue).","en":"AlphaFold predicts a protein's 3D structure from its sequence. According to DeepMind's page, the CASP14 organisers recognised AlphaFold2 in 2020 as a solution to the “protein folding problem”, and Demis Hassabis and John Jumper were co-awarded the 2024 Nobel Prize in Chemistry (with David Baker). Predicting the final shape does not explain how the protein finds it, so the question on the map stays open. Sources: the lab's page only (the Nobel Prize page could not be read).","r":[{"t":"AlphaFold","u":"https://deepmind.google/science/alphafold/","a":"Google DeepMind","y":null}],"checked":"2026-11-20","lad":[]}]},{"id":"eau","qq":{"fr":"Pourquoi l'eau a-t-elle des propriétés si étranges ?","en":"Why does water behave so strangely?"},"nmm":{"fr":"Anomalies de l'eau","en":"Water's anomalies"},"cc":{"fr":"L'eau liquide présente de nombreuses anomalies. On étudie le rôle des effets quantiques des atomes d'hydrogène.","en":"Liquid water shows many anomalies. The role of quantum effects of hydrogen atoms is being studied."},"no":null,"s":"wiki-chem","st":"ouverte","k":0,"subs":[56],"t":false,"x":-0.276,"y":-0.713,"f":null,"ia":[]},{"id":"photosynthese-artificielle","qq":{"fr":"Peut-on fabriquer des carburants avec la lumière, à bas coût ?","en":"Can fuels be made from light, cheaply?"},"nmm":{"fr":"Photosynthèse artificielle","en":"Artificial photosynthesis"},"cc":{"fr":"Séparer l'eau avec la lumière pour produire de l'hydrogène marche en laboratoire. Le faire efficacement et à bas prix reste à réussir.","en":"Splitting water with light to make hydrogen works in the lab. Doing so efficiently and cheaply remains to be achieved."},"no":null,"s":"wiki-chem","st":"ouverte","k":0,"subs":[47,56,88],"t":false,"x":-0.51,"y":-0.654,"f":null,"ia":[]},{"id":"ammoniac","qq":{"fr":"Peut-on fabriquer l'ammoniac sans chaleur ni haute pression ?","en":"Can ammonia be made without heat or high pressure?"},"nmm":{"fr":"Ammoniac des engrais","en":"Fertiliser ammonia"},"cc":{"fr":"L'ammoniac des engrais est produit à haute température et sous forte pression. Une méthode à conditions ambiantes, à grande échelle, n'existe pas encore.","en":"Fertiliser ammonia is made at high temperature and high pressure. A large-scale method at ambient conditions does not exist yet."},"no":null,"s":"wiki-chem","st":"ouverte","k":0,"subs":[47,54],"t":false,"x":-0.424,"y":-0.698,"f":null,"ia":[]},{"id":"sexe","qq":{"fr":"Pourquoi la reproduction sexuée existe-t-elle ?","en":"Why does sexual reproduction exist?"},"nmm":{"fr":"Reproduction sexuée","en":"Sexual reproduction"},"cc":{"fr":"Elle semble moins efficace que le clonage, et pourtant elle domine chez les animaux. Les forces qui l'ont fait naître et qui la maintiennent sont débattues.","en":"It seems less efficient than cloning, yet it dominates in animals. The forces that gave rise to it and maintain it are debated."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[4,33],"t":false,"x":0.456,"y":-0.641,"f":null,"ia":[]},{"id":"virus-origine","qq":{"fr":"D'où viennent les virus ?","en":"Where do viruses come from?"},"nmm":{"fr":"Origine des virus","en":"Origin of viruses"},"cc":{"fr":"Plusieurs scénarios existent. On ignore quand et comment les différents groupes de virus sont apparus.","en":"Several scenarios exist. When and how the different groups of viruses appeared is unknown."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[120,4],"t":false,"x":0.487,"y":-0.608,"f":null,"ia":[]},{"id":"eucaryotes","qq":{"fr":"Comment les cellules complexes sont-elles nées ?","en":"How did complex cells arise?"},"nmm":{"fr":"Origine des cellules à noyau","en":"Origin of complex cells"},"cc":{"fr":"Les cellules à noyau résultent d'une fusion ancienne entre cellules. On ignore comment et pourquoi elle s'est produite.","en":"Cells with a nucleus result from an ancient fusion between cells. How and why it happened is unknown."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[29,118,4],"t":false,"x":0.609,"y":-0.528,"f":null,"ia":[]},{"id":"luca","qq":{"fr":"À quoi ressemblait l'ancêtre commun des bactéries et des archées ?","en":"What did the common ancestor of bacteria and archaea look like?"},"nmm":{"fr":"Ancêtre commun","en":"Last common ancestor"},"cc":{"fr":"Ses caractéristiques ne sont connues qu'avec beaucoup d'incertitude.","en":"Its characteristics are known only with great uncertainty."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[118,34],"t":false,"x":0.703,"y":-0.433,"f":null,"ia":[]},{"id":"proteines-inconnues","qq":{"fr":"À quoi servent les protéines dont on ignore le rôle ?","en":"What do the proteins of unknown role do?"},"nmm":{"fr":"Protéines inconnues","en":"Unknown proteins"},"cc":{"fr":"Vingt ans après les premiers génomes d'eucaryotes, le rôle biologique d'environ un cinquième des protéines reste inconnu.","en":"Twenty years after the first eukaryotic genomes, the biological role of about a fifth of proteins is still unknown."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[34,25],"t":false,"x":0.711,"y":-0.388,"f":null,"ia":[]},{"id":"taille-cellule","qq":{"fr":"Comment une cellule sait-elle quelle taille atteindre avant de se diviser ?","en":"How does a cell know how big to grow before dividing?"},"nmm":{"fr":"Taille des cellules","en":"Cell size"},"cc":{"fr":"Les cellules se divisent à une taille bien réglée. Comment elles la mesurent n'est pas élucidé.","en":"Cells divide at a well-regulated size. How they measure it is not elucidated."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[29,34],"t":false,"x":0.792,"y":-0.306,"f":null,"ia":[]},{"id":"anesthesie","qq":{"fr":"Comment les anesthésiques font-ils perdre conscience ?","en":"How do anaesthetics switch off consciousness?"},"nmm":{"fr":"Anesthésie","en":"Anaesthesia"},"cc":{"fr":"On les utilise tous les jours, mais leur mécanisme d'action n'est pas entièrement compris.","en":"They are used every day, but their mechanism of action is not fully understood."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[140,183,184],"t":false,"x":0.685,"y":0.311,"f":{"w":{"fr":{"t":"Anesthésie générale","x":"L'anesthésie générale, ou AG, est un acte médical dont l'objectif principal est la suspension temporaire et réversible de la conscience et de la sensibilité douloureuse, au moyen de médicaments administrés par voie intraveineuse et/ou inhalation.","u":"https://fr.wikipedia.org/wiki/Anesth%C3%A9sie_g%C3%A9n%C3%A9rale"},"en":{"t":"General anaesthesia","x":"General anaesthesia (UK) or general anesthesia (US) is drug-induced loss of consciousness that renders a subject unarousable even by painful stimuli. It is achieved through medications, which can be injected or inhaled, often with an analgesic and neuromuscular blocking agent.","u":"https://en.wikipedia.org/wiki/General_anaesthesia"}},"r":[{"t":"General anaesthesia: from molecular targets to neuronal pathways of sleep and arousal","a":"Nicholas P. Franks","y":2008,"u":"https://doi.org/10.1038/nrn2372"},{"t":"General Anesthesia, Sleep, and Coma","a":"Emery N. Brown, Ralph Lydic, Nicholas D. Schiff","y":2010,"u":"https://doi.org/10.1056/NEJMra0808281"}],"rv":null,"ck":0,"fr":{"s":["Les anesthésiques généraux font perdre conscience de façon réversible. On les utilise en chirurgie depuis le milieu du XIXe siècle.","Ils agissent sur plusieurs protéines des neurones, notamment des récepteurs du GABA, et sur des réseaux de neurones impliqués dans le sommeil et l'éveil.","Des molécules très différentes, gazeuses ou injectées, produisent des effets semblables."],"i":["Comment ces effets sur les molécules mènent à la perte de conscience.","Pourquoi des substances chimiquement très différentes ont des effets proches."],"d":["La conscience elle-même n'est pas expliquée : on ne peut donc pas dire exactement ce qu'on éteint.","Un anesthésique agit à plusieurs niveaux à la fois, des molécules aux réseaux de neurones, ce qui rend ses effets difficiles à isoler."],"e":"Anesthésier plus sûrement, repérer une conscience chez un patient qui ne peut pas répondre, et obtenir des indices sur ce qu'est la conscience.","c":["Les neurosciences cellulaires et la neuroscience de la conscience.","Un premier pas : comprendre en quoi l'anesthésie diffère du sommeil.","Les deux articles ci-dessous font le point sur ce qu'on sait."]},"en":{"s":["General anaesthetics cause a reversible loss of consciousness. They have been used in surgery since the mid-19th century.","They act on several neuronal proteins, notably GABA receptors, and on neural networks involved in sleep and wakefulness.","Very different molecules, gaseous or injected, produce similar effects."],"i":["How these molecular effects lead to loss of consciousness.","Why chemically very different substances have similar effects."],"d":["Consciousness itself is not explained: so we cannot say exactly what is being switched off.","An anaesthetic acts at several levels at once, from molecules to neural networks, which makes its effects hard to isolate."],"e":"Anaesthetising more safely, detecting consciousness in a patient who cannot respond, and gaining clues about what consciousness is.","c":["Cellular neuroscience and the neuroscience of consciousness.","A first step: understand how anaesthesia differs from sleep.","The two articles below review what is known."]}},"ia":[]},{"id":"forme-organes","qq":{"fr":"Comment un organe atteint-il toujours la bonne forme et la bonne taille ?","en":"How does an organ always reach the right shape and size?"},"nmm":{"fr":"Forme des organes","en":"Organ shape"},"cc":{"fr":"La forme et la taille finales des organes sont très fiables. On en comprend seulement une partie des commandes.","en":"The final shape and size of organs are very reliable. Only part of the controls is understood."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[31,29],"t":false,"x":0.794,"y":-0.196,"f":null,"ia":[]},{"id":"cambrien","qq":{"fr":"Pourquoi la vie animale s'est-elle diversifiée si vite au Cambrien ?","en":"Why did animal life diversify so fast in the Cambrian?"},"nmm":{"fr":"Explosion du Cambrien","en":"Cambrian explosion"},"cc":{"fr":"Presque tous les grands groupes d'animaux apparaissent dans les fossiles sur une période géologiquement courte. La cause est débattue.","en":"Almost all major animal groups appear in the fossil record over a geologically short period. The cause is debated."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[79,4],"t":false,"x":0.006,"y":-0.785,"f":{"w":{"fr":{"t":"Explosion cambrienne","x":"L’explosion cambrienne désigne l'apparition soudaine – à l'échelle géologique – de la plupart des grands embranchements actuels de métazoaires ainsi que de quelques autres, disparus entre-temps, initiant ainsi une grande diversification des classes et des espèces animales, végétales et bactériennes. Certains auteurs n'hésitent pas à parler de « big bang zoologique au Cambrien », avec l'apparition en quelques dizaines de millions d'années de la quasi-totalité des grands plans d'organisation connus actuellement.","u":"https://fr.wikipedia.org/wiki/Explosion_cambrienne"},"en":{"t":"Cambrian explosion","x":"\nThe Cambrian explosion is a major evolutionary radiation event of the Earth's lifeforms beginning approximately 538.8 million years ago in the early Cambrian period of the Paleozoic era, during which a sudden diversification of complex life occurred in the fossil record.","u":"https://en.wikipedia.org/wiki/Cambrian_explosion"}},"r":[{"t":"EXPLAINING THE CAMBRIAN “EXPLOSION” OF ANIMALS","a":"Charles R. Marshall","y":2006,"u":"https://doi.org/10.1146/annurev.earth.33.031504.103001"},{"t":"The Cambrian Conundrum: Early Divergence and Later Ecological Success in the Early History of Animals","a":"Douglas H. Erwin, Marc Laflamme, Sarah M. Tweedt et al.","y":2011,"u":"https://doi.org/10.1126/science.1206375"}],"rv":null,"ck":1,"fr":{"s":["Les fossiles d'animaux complexes sont rares avant le Cambrien, il y a environ 540 millions d'années. Les couches du Cambrien en contiennent beaucoup, et représentent la plupart des grands groupes d'animaux actuels.","Des organismes plus anciens existaient, comme ceux de l'Édiacarien. La diversification s'est étalée sur quelques dizaines de millions d'années.","Plusieurs explications sont proposées : plus d'oxygène, l'apparition de prédateurs, de nouveaux gènes de développement, des changements de l'environnement."],"i":["Quelle cause, ou quel ensemble de causes, a déclenché cette diversification.","Dans quelle mesure l'« explosion » est réelle, ou due à des lacunes dans les archives fossiles."],"d":["Les fossiles de cette époque sont rares et conservés de façon inégale : seuls les animaux à corps dur ou ceux de sites exceptionnels y figurent.","Les causes possibles sont nombreuses, liées entre elles (chimie des océans, écologie, génétique) et difficiles à séparer."],"e":"Comprendre comment la grande diversité des animaux est née, et ce qui rend possible un changement évolutif rapide.","c":["La paléontologie et la biologie du développement.","Un premier pas : comparer les faunes de l'Édiacarien et du Cambrien.","Les deux articles ci-dessous passent en revue les hypothèses."]},"en":{"s":["Fossils of complex animals are rare before the Cambrian, about 540 million years ago. Cambrian rocks contain many, representing most of today's major animal groups.","Older organisms existed, such as those of the Ediacaran. The diversification spread over a few tens of millions of years.","Several explanations are proposed: more oxygen, the appearance of predators, new developmental genes, environmental changes."],"i":["Which cause, or set of causes, triggered this diversification.","How far the “explosion” is real, or due to gaps in the fossil record."],"d":["Fossils from that time are rare and unevenly preserved: only hard-bodied animals or those from exceptional sites are included.","The possible causes are many, linked to one another (ocean chemistry, ecology, genetics) and hard to separate."],"e":"Understanding how the great diversity of animals arose, and what makes rapid evolutionary change possible.","c":["Palaeontology and developmental biology.","A first step: compare the faunas of the Ediacaran and the Cambrian.","The two articles below review the hypotheses."]}},"ia":[]},{"id":"plancton","qq":{"fr":"Pourquoi tant d'espèces de plancton coexistent-elles ?","en":"Why do so many plankton species coexist?"},"nmm":{"fr":"Paradoxe du plancton","en":"Paradox of the plankton"},"cc":{"fr":"Elles semblent se disputer les mêmes ressources, ce qui devrait en éliminer la plupart : c'est le « paradoxe du plancton ».","en":"They seem to compete for the same resources, which should eliminate most of them: this is the “paradox of the plankton”."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[3,106],"t":false,"x":0.23,"y":-0.842,"f":null,"ia":[]},{"id":"fleurs","qq":{"fr":"D'où viennent les fleurs ?","en":"Where do flowers come from?"},"nmm":{"fr":"Origine des fleurs","en":"Origin of flowers"},"cc":{"fr":"Darwin parlait d'un « abominable mystère » : les plantes à fleurs semblent apparaître brusquement dans les fossiles.","en":"Darwin spoke of an “abominable mystery”: flowering plants seem to appear suddenly in the fossil record."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[9,79],"t":false,"x":0.138,"y":-0.814,"f":null,"ia":[]},{"id":"neandertal","qq":{"fr":"Pourquoi les autres espèces humaines ont-elles disparu ?","en":"Why did the other human species die out?"},"nmm":{"fr":"Disparition de Néandertal","en":"Neanderthal extinction"},"cc":{"fr":"Néandertal et d'autres espèces humaines se sont éteints, laissant Homo sapiens seul. Les causes restent débattues.","en":"Neanderthals and other human species died out, leaving Homo sapiens alone. The causes remain debated."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[225,79,213],"t":true,"x":-0.166,"y":0.224,"f":null,"ia":[]},{"id":"groupes-sanguins","qq":{"fr":"À quoi servent les groupes sanguins ?","en":"What are blood types for?"},"nmm":{"fr":"Groupes sanguins","en":"Blood types"},"cc":{"fr":"On ignore leur origine et leur utilité. Des hypothèses existent, par exemple une adaptation au paludisme.","en":"Their origin and usefulness are unknown. Hypotheses exist, for example an adaptation to malaria."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[154,33],"t":false,"x":0.782,"y":-0.239,"f":null,"ia":[]},{"id":"navigation-animale","qq":{"fr":"Comment les animaux retrouvent-ils leur chemin sur de très longues distances ?","en":"How do animals find their way over very long distances?"},"nmm":{"fr":"Orientation des animaux","en":"Animal navigation"},"cc":{"fr":"Oiseaux ou papillons monarques regagnent des lieux lointains. Les mécanismes en jeu ne sont pas expliqués.","en":"Birds or monarch butterflies return to distant places. The mechanisms involved are not explained."},"no":null,"s":"wiki-bio","st":"ouverte","k":0,"subs":[2,181],"t":true,"x":0.624,"y":-0.108,"f":null,"ia":[]},{"id":"libre-arbitre","qq":{"fr":"Avons-nous un libre arbitre ?","en":"Do we have free will?"},"nmm":{"fr":"Libre arbitre","en":"Free will"},"cc":{"fr":"Des expériences montrent une activité du cerveau avant la décision consciente d'agir, mais leur interprétation est très discutée.","en":"Experiments show brain activity before the conscious decision to act, but their interpretation is much disputed."},"no":null,"s":"wiki-neuro","st":"ouverte","k":0,"subs":[184,21],"t":false,"x":0.186,"y":0.762,"f":null,"ia":[]},{"id":"binding","qq":{"fr":"Comment le cerveau assemble-t-il couleur, forme et sens en une seule perception ?","en":"How does the brain bind colour, shape and meaning into one percept?"},"nmm":{"fr":"Problème de la liaison","en":"The binding problem"},"cc":{"fr":"C'est le « problème de la liaison ». On ne sait pas comment des informations traitées dans des régions différentes forment une expérience unique.","en":"This is the “binding problem”. We do not know how information processed in different regions forms a single experience."},"no":null,"s":"wiki-neuro","st":"ouverte","k":0,"subs":[184,188],"t":false,"x":0.546,"y":0.436,"f":null,"ia":[]},{"id":"langage-cerveau","qq":{"fr":"Comment le cerveau comprend-il le sens des mots ?","en":"How does the brain grasp the meaning of words?"},"nmm":{"fr":"Langage et cerveau","en":"Language and the brain"},"cc":{"fr":"On ne sait ni comment le langage est réalisé dans le cerveau ni sur quoi repose le sens.","en":"We know neither how language is implemented in the brain nor what meaning rests on."},"no":null,"s":"wiki-neuro","st":"ouverte","k":0,"subs":[184,221],"t":false,"x":0.194,"y":0.6,"f":null,"ia":[]},{"id":"acquisition-langage","qq":{"fr":"Comment un enfant apprend-il à parler ?","en":"How does a child learn to speak?"},"nmm":{"fr":"Acquisition du langage","en":"Language acquisition"},"cc":{"fr":"Les spécialistes débattent de la part de structures inné
