444,215,"Innovations in Education and Learning Technologies",-0.365,0.498,57580,233,"Sustainable Urban and Rural Development",0.423,-0.49,473688,9,"Medicinal Plant Research"],"Q":[{"id":"univers","qq":{"fr":"De quoi est fait l'univers ?","en":"What is the universe made of?"},"nmm":{"fr":"Composition de l'univers","en":"Makeup of the universe"},"cc":{"fr":"La matière ordinaire, celle des étoiles et des galaxies, compte pour moins de 5 % de ce qui existe. La nature du reste est inconnue.","en":"Ordinary matter, the stuff of stars and galaxies, makes up less than 5% of what exists. The nature of the rest is unknown."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[198,201],"t":false,"x":-0.808,"y":-0.444,"f":{"w":{"fr":{"t":"Matière noire","x":"La matière noire ou matière sombre, est une catégorie de matière hypothétique, invoquée dans le cadre du Modèle ΛCDM pour rendre compte de certaines observations astrophysiques, notamment les estimations de la masse des galaxies ou des amas de galaxies et les propriétés des fluctuations du fond diffus cosmologique.","u":"https://fr.wikipedia.org/wiki/Mati%C3%A8re_noire"},"en":{"t":"Dark matter","x":"In astronomy and cosmology, dark matter is an invisible and hypothetical form of matter that does not interact with electromagnetic radiation, including light. Dark matter is implied by gravitational effects that cannot be explained by general relativity unless more matter is present than can be observed.","u":"https://en.wikipedia.org/wiki/Dark_matter"}},"r":[{"t":"Planck 2018 results: VI. Cosmological parameters","a":"N. Aghanim, Y. Akrami, M. Ashdown et al.","y":2020,"u":"https://doi.org/10.1051/0004-6361/201833910"},{"t":"Particle dark matter: evidence, candidates and constraints","a":"Gianfranco Bertone, Dan Hooper, Joseph I. Silk","y":2004,"u":"https://doi.org/10.1016/j.physrep.2004.08.031"}],"rv":null,"ck":0,"fr":{"s":["Les mouvements des galaxies et des amas de galaxies indiquent qu'il y a plus de masse que ce que l'on voit. On l'appelle matière noire.","Les mesures du fond diffus cosmologique donnent une répartition de l'énergie de l'univers : la matière ordinaire n'en forme qu'une petite part, la matière noire environ cinq fois plus.","On sait très peu de choses sur sa nature : de nombreux candidats ont été proposés et testés, sans détection directe jusqu'à présent."],"i":["La nature de la matière noire : particule inconnue, objets sombres, ou modification de la gravité.","La nature de l'énergie noire, qui rend compte de l'expansion accélérée de l'univers."],"d":["La matière noire n'émet ni ne reçoit de lumière : on ne la détecte que par sa gravité.","Les détecteurs sont très difficiles à construire, car le signal attendu est extrêmement faible."],"e":"Savoir de quoi est fait l'essentiel de la matière de l'univers, et si les lois de la gravité sont complètes.","c":["L'astrophysique et la physique des particules.","Un premier pas : comprendre comment la vitesse de rotation des galaxies révèle de la masse invisible.","Les deux articles ci-dessous : la mesure du fond diffus par Planck, et une revue des candidats."]},"en":{"s":["The movements of galaxies and galaxy clusters indicate there is more mass than what we see. It is called dark matter.","Measurements of the cosmic microwave background give a breakdown of the universe's energy: ordinary matter is only a small part, dark matter about five times more.","Very little is known about its nature: many candidates have been proposed and tested, with no direct detection so far."],"i":["The nature of dark matter: an unknown particle, dark objects, or a modification of gravity.","The nature of dark energy, which accounts for the accelerating expansion of the universe."],"d":["Dark matter neither emits nor receives light: it is detected only through its gravity.","Detectors are very hard to build, since the expected signal is extremely faint."],"e":"Knowing what most of the universe's matter is made of, and whether the laws of gravity are complete.","c":["Astrophysics and particle physics.","A first step: understand how the rotation speed of galaxies reveals invisible mass.","The two articles below: the Planck measurement of the microwave background, and a review of candidates."]}},"ia":[]},{"id":"conscience","qq":{"fr":"Quelle est la base biologique de la conscience ?","en":"What is the biological basis of consciousness?"},"nmm":{"fr":"Conscience","en":"Consciousness"},"cc":{"fr":"Ce qui se passe dans l'esprit vient de processus dans le cerveau, mais on commence seulement à les démêler.","en":"What happens in the mind comes from processes in the brain, but we are only beginning to disentangle them."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[184,21,209],"t":true,"x":0.186,"y":0.702,"f":{"w":{"fr":{"t":"Problème difficile de la conscience","x":"L'expression problème difficile de la conscience, imaginée par David Chalmers, désigne le problème de l'origine des qualia, c'est-à-dire du contenu subjectif de l'expérience d'un état mental, lorsque cette question est abordée sous l'angle des neurosciences et des sciences cognitives.","u":"https://fr.wikipedia.org/wiki/Probl%C3%A8me_difficile_de_la_conscience"},"en":{"t":"Hard problem of consciousness","x":"In philosophy of mind, the hard problem of consciousness is to explain how and why organisms have qualia, phenomenal consciousness, or subjective experience. It is contrasted with the \"easy problems\" of explaining why and how physical systems give rise to the ability to discriminate, to integrate information, and to perform behavioural functions such as watching, listening, speaking, and so forth.","u":"https://en.wikipedia.org/wiki/Hard_problem_of_consciousness"}},"r":[{"t":"Facing Up to the Problem of Consciousness","a":"David J. Chalmers","y":1996,"u":"https://doi.org/10.7551/mitpress/6860.003.0003"},{"t":"Neural correlates of consciousness: progress and problems","a":"Christof Koch, Marcello Massimini, Mélanie Boly et al.","y":2016,"u":"https://doi.org/10.1038/nrn.2016.22"}],"rv":null,"ck":0,"fr":{"s":["Le cerveau et la conscience sont étroitement liés : une lésion, une anesthésie ou le sommeil profond changent ou suppriment l'expérience vécue.","On sait repérer des « corrélats neuronaux » : des activités du cerveau qui accompagnent une expérience consciente. Par exemple, ce qui diffère dans le cerveau entre une image qu'on voit et la même image qu'on ne remarque pas.","Plusieurs théories scientifiques sont en concurrence pour l'expliquer, et on cherche à les tester les unes contre les autres."],"i":["Pourquoi l'activité de neurones s'accompagne d'une expérience vécue : le goût d'un fruit, le rouge d'une couleur, une douleur. Le philosophe David Chalmers a appelé cela le « problème difficile » de la conscience.","Quels êtres en ont une : certains animaux ? Une machine pourrait-elle en avoir ? Il n'existe pas de test accepté par tous."],"d":["L'expérience vécue est privée : personne ne peut la mesurer de l'extérieur. On dépend de ce que la personne rapporte, et un bébé, un animal ou un patient qui ne répond pas ne peuvent rien rapporter.","Il n'existe pas de définition de la conscience qui fasse l'unanimité, et les théories concurrentes se laissent difficilement départager par l'expérience."],"e":"Savoir si un patient qui ne répond pas ressent quelque chose, ce qu'on doit aux animaux, et ce que valent des machines qui prétendent ressentir.","c":["Les neurosciences cognitives étudient les corrélats neuronaux ; la philosophie de l'esprit étudie la question de fond. Les deux se rejoignent ici.","Un protocole de base : comparer ce que fait le cerveau face à une perception consciente et à une perception qui ne l'est pas.","Pour poser le problème, le texte de Chalmers ci-dessous est le point de départ."]},"en":{"s":["The brain and consciousness are closely linked: a lesion, anaesthesia or deep sleep changes or removes lived experience.","We can identify “neural correlates”: brain activity that accompanies a conscious experience. For example, what differs in the brain between an image we see and the same image we do not notice.","Several scientific theories compete to explain it, and researchers are trying to test them against each other."],"i":["Why neural activity comes with lived experience: the taste of a fruit, the redness of a colour, a pain. The philosopher David Chalmers called this the “hard problem” of consciousness.","Which beings have it: some animals? Could a machine? There is no test accepted by everyone."],"d":["Lived experience is private: nobody can measure it from outside. We depend on what the person reports, and a baby, an animal or an unresponsive patient cannot report anything.","There is no definition of consciousness that everyone agrees on, and competing theories are hard to tell apart by experiment."],"e":"Knowing whether an unresponsive patient feels anything, what we owe to animals, and what machines that claim to feel are worth.","c":["Cognitive neuroscience studies neural correlates; philosophy of mind studies the underlying question. The two meet here.","A basic protocol: compare what the brain does for a conscious perception and for one that is not.","To set out the problem, Chalmers's text below is the starting point."]}},"ia":[]},{"id":"genes","qq":{"fr":"Pourquoi les humains ont-ils si peu de gènes ?","en":"Why do humans have so few genes?"},"nmm":{"fr":"Peu de gènes","en":"So few genes"},"cc":{"fr":"Nous avons à peu près autant de gènes qu'une petite plante à fleurs. La façon dont ils sont régulés et exprimés est une question centrale de la biologie.","en":"We have about as many genes as a small flowering plant. How they are regulated and expressed is a central question in biology."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[33,34],"t":false,"x":0.661,"y":-0.447,"f":null,"ia":[]},{"id":"sante-genetique","qq":{"fr":"Dans quelle mesure nos variations génétiques déterminent-elles notre santé ?","en":"To what extent do genetic variations determine our health?"},"nmm":{"fr":"Génétique et santé","en":"Genetics and health"},"cc":{"fr":"Relier les différences entre génomes aux maladies de chacun reste difficile dès que plusieurs gènes et le mode de vie s'en mêlent.","en":"Linking differences between genomes to individual diseases remains hard as soon as several genes and lifestyle are involved."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[151,33,148],"t":false,"x":0.816,"y":-0.268,"f":null,"ia":[]},{"id":"unification","qq":{"fr":"Peut-on unifier les lois de la physique ?","en":"Can the laws of physics be unified?"},"nmm":{"fr":"Unification de la physique","en":"Unifying physics"},"cc":{"fr":"La gravité et la physique quantique sont décrites par deux théories que personne n'a su réunir en une seule.","en":"Gravity and quantum physics are described by two theories that nobody has managed to merge into one."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[201,134],"t":false,"x":-0.85,"y":-0.256,"f":null,"ia":[]},{"id":"longevite","qq":{"fr":"Jusqu'où peut-on prolonger la vie humaine ?","en":"How far can human lifespan be extended?"},"nmm":{"fr":"Limites de la longévité","en":"Limits of longevity"},"cc":{"fr":"Des souris, des vers et des levures vivent plus longtemps en laboratoire. Certains chercheurs pensent pouvoir ralentir le vieillissement humain, d'autres que notre durée de vie est plus figée.","en":"Mice, worms and yeast live longer in the lab. Some researchers think human ageing can be slowed; others think our lifespan is more fixed."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[24,152],"t":false,"x":0.542,"y":0.011,"f":{"w":{"fr":{"t":"Vieillissement","x":"Le vieillissement est l'ensemble des modifications fonctionnelles diminuant progressivement l'aptitude d'un objet, d'une information ou d'un organisme à assurer ses fonctions dans le temps.","u":"https://fr.wikipedia.org/wiki/Vieillissement"},"en":{"t":"Ageing","x":"Ageing is the process of becoming older. The term refers mainly to humans, many other animals, and fungi; whereas for example, bacteria, perennial plants and some simple animals are potentially biologically immortal. In a broader sense, ageing can refer to single cells within an organism which have ceased dividing, or to the population of a species.","u":"https://en.wikipedia.org/wiki/Ageing"}},"r":[{"t":"The Hallmarks of Aging","a":"Carlos López-Otín, María A. Blasco, Linda Partridge et al.","y":2013,"u":"https://doi.org/10.1016/j.cell.2013.05.039"}],"rv":null,"ck":0,"fr":{"s":["Le vieillissement correspond à une baisse progressive des fonctions de l'organisme. Des facteurs comme l'instabilité du génome, l'usure des télomères ou l'inflammation y contribuent.","Chez des animaux de laboratoire, plusieurs interventions allongent la durée de vie, comme la restriction calorique.","Chez l'être humain, la durée de vie moyenne a beaucoup augmenté, mais la durée de vie maximale observée est restée à peu près la même."],"i":["Pourquoi on vieillit : usure accumulée ou processus programmé.","S'il existe une limite à la vie humaine, et laquelle."],"d":["Le vieillissement est lent, ce qui rend les expériences très longues chez l'être humain.","Il combine de nombreux mécanismes qui interagissent, donc il est difficile d'en isoler un."],"e":"Mieux comprendre ce qui fait vieillir pourrait retarder les maladies liées à l'âge, qui sont les principales causes de mortalité dans les pays riches.","c":["La biologie du vieillissement et la gériatrie.","Un premier pas : lire la liste des « marques du vieillissement ».","L'article ci-dessous la présente."]},"en":{"s":["Ageing is a gradual decline of the body's functions. Factors such as genome instability, telomere wear or inflammation contribute.","In laboratory animals, several interventions extend lifespan, such as calorie restriction.","In humans, average lifespan has increased a lot, but the maximum observed lifespan has stayed about the same."],"i":["Why we age: accumulated wear or a programmed process.","Whether there is a limit to human life, and what it is."],"d":["Ageing is slow, which makes experiments in humans very long.","It combines many mechanisms that interact, so it is hard to isolate one."],"e":"Better understanding what causes ageing could delay age-related diseases, which are the main causes of death in rich countries.","c":["The biology of ageing and geriatrics.","A first step: read the list of “hallmarks of ageing”.","The article below presents it."]}},"ia":[]},{"id":"regeneration","qq":{"fr":"Qu'est-ce qui commande la régénération des organes ?","en":"What controls organ regeneration?"},"nmm":{"fr":"Régénération des organes","en":"Organ regeneration"},"cc":{"fr":"Certains animaux font repousser un membre entier. On ne sait pas pourquoi les mammifères en sont presque incapables.","en":"Some animals regrow an entire limb. We do not know why mammals are almost incapable of it."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[31,29,179],"t":false,"x":0.816,"y":-0.157,"f":null,"ia":[]},{"id":"reprogrammation","qq":{"fr":"Comment une cellule de peau peut-elle devenir une cellule nerveuse ?","en":"How can a skin cell become a nerve cell?"},"nmm":{"fr":"Reprogrammer les cellules","en":"Reprogramming cells"},"cc":{"fr":"La question portait sur la possibilité de changer l'identité d'une cellule adulte.","en":"The question was whether the identity of an adult cell could be changed."},"no":{"fr":"Depuis 2006, on sait reprogrammer des cellules adultes en cellules souches (prix Nobel 2012). Les mécanismes fins restent étudiés.","en":"Since 2006 adult cells can be reprogrammed into stem cells (Nobel Prize 2012). The fine mechanisms are still being studied."},"s":"science2005","st":"avancee","k":0,"subs":[29,31,183],"t":false,"x":0.84,"y":-0.061,"f":null,"ia":[]},{"id":"plante","qq":{"fr":"Comment une seule cellule devient-elle une plante entière ?","en":"How does a single cell become a whole plant?"},"nmm":{"fr":"De la cellule à la plante","en":"From cell to plant"},"cc":{"fr":"Une cellule végétale isolée peut redonner une plante complète. Ce qui déclenche et guide ce processus n'est pas entièrement compris.","en":"A single plant cell can regrow a whole plant. What triggers and guides the process is not fully understood."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[9,31],"t":false,"x":0.571,"y":-0.552,"f":null,"ia":[]},{"id":"interieur-terre","qq":{"fr":"Comment fonctionne l'intérieur de la Terre ?","en":"How does Earth's interior work?"},"nmm":{"fr":"Intérieur de la Terre","en":"Earth's interior"},"cc":{"fr":"On ne peut pas y aller. Tout ce qu'on sait du manteau et du noyau vient de mesures indirectes, surtout les ondes des séismes.","en":"We cannot go there. Everything we know about the mantle and the core comes from indirect measurements, mostly earthquake waves."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[77,75],"t":false,"x":-0.197,"y":-0.567,"f":null,"ia":[]},{"id":"seuls","qq":{"fr":"Sommes-nous seuls dans l'univers ?","en":"Are we alone in the universe?"},"nmm":{"fr":"Vie ailleurs","en":"Life elsewhere"},"cc":{"fr":"On ne connaît qu'un seul exemple de vie : la nôtre.","en":"We know of only one example of life: our own."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[198,80],"t":false,"x":-0.452,"y":-0.401,"f":null,"ia":[]},{"id":"origine-vie","qq":{"fr":"Où et comment la vie est-elle apparue sur Terre ?","en":"Where and how did life arise on Earth?"},"nmm":{"fr":"Origine de la vie","en":"Origin of life"},"cc":{"fr":"Il ne reste presque aucune trace de cette époque, et personne n'a recréé en laboratoire un système qui se reproduit seul à partir de chimie simple.","en":"Almost no trace remains of that era, and nobody has recreated in the lab a system that reproduces itself from simple chemistry."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[25,75,79],"t":true,"x":0.137,"y":-0.535,"f":{"w":{"fr":{"t":"Origine de la vie","x":"L'origine de la vie sur Terre demeure incertaine. Les plus anciens micro-organismes fossiles observés sont datés d'au moins 3,5 Ga durant le Paléoarchéen. Une étude publiée en 2015 sur des inclusions de carbone considérées comme d'origine organique leur assigne un âge de 4,1 milliards d'années et plus récemment des précipités hydrofuges sous-marins trouvés dans des roches sédimentaires ferrugineuses de la ceinture de roches vertes de Nuvvuagittuq (Québec) ont été interprétés comme de possibles traces de vie il y a…","u":"https://fr.wikipedia.org/wiki/Origine_de_la_vie"},"en":{"t":"Abiogenesis","x":"Abiogenesis or the origin of life is the natural process by which life arises from non-living matter, such as simple organic compounds. The prevailing scientific hypothesis is that the transition from non-living to living entities on Earth was not a single event, but a process of increasing complexity involving the formation of a habitable planet, the prebiotic synthesis of organic molecules, molecular self-replication, self-assembly, autocatalysis, and the emergence of cell membranes.","u":"https://en.wikipedia.org/wiki/Abiogenesis"}},"r":[{"t":"Prebiotic Systems Chemistry: New Perspectives for the Origins of Life","a":"Kepa Ruiz‐Mirazo, Carlos Briones, Andrés de la Escosura","y":2013,"u":"https://doi.org/10.1021/cr2004844"},{"t":"The Origin of Life—Out of the Blue","a":"John D. Sutherland","y":2015,"u":"https://doi.org/10.1002/anie.201506585"},{"t":"Synthesis of activated pyrimidine ribonucleotides in prebiotically plausible conditions","a":"Matthew W. Powner, Béatrice Gerland, John D. Sutherland","y":2009,"u":"https://doi.org/10.1038/nature08013"}],"rv":null,"ck":2,"fr":{"s":["La vie existe sur Terre depuis très longtemps : les plus anciens micro-organismes fossiles observés sont datés d'au moins 3,5 milliards d'années.","Les briques du vivant (acides aminés, composants de l'ARN, lipides) peuvent se former dans des conditions jugées plausibles pour la Terre primitive. Des expériences l'ont montré, depuis celle de Miller en 1953 jusqu'à la synthèse de composants de l'ARN en 2009 (dernier article ci-dessous).","Plusieurs scénarios sont étudiés : un « monde à ARN », où l'ARN stocke l'information et catalyse des réactions, des sources hydrothermales au fond des océans, des mares chaudes en surface. Aucun n'est démontré."],"i":["Le chemin complet, de la chimie sans vie à une cellule capable de se reproduire et d'évoluer : on connaît des étapes, pas leur enchaînement.","Où et quand cela s'est produit, et si c'est un événement rare ou probable."],"d":["Il ne reste presque aucune roche de cette époque : les archives géologiques les plus anciennes sont rares et très transformées.","On ne peut pas refaire l'expérience sur des millions d'années ni dans un océan entier : les laboratoires ne reproduisent que des étapes isolées.","Ces étapes demandent souvent des conditions chimiques incompatibles entre elles, ce qui oblige à imaginer des environnements où elles se succèdent."],"e":"Savoir si la vie est un accident rare ou un résultat probable de la chimie, ce qui change la façon de chercher la vie ailleurs.","c":["La chimie prébiotique : comment des molécules simples donnent des molécules plus complexes.","Les trois articles ci-dessous sont des points d'entrée ; le dernier décrit une étape précise réussie."]},"en":{"s":["Life has existed on Earth for a very long time: the oldest fossil micro-organisms observed are dated to at least 3.5 billion years.","The building blocks of life (amino acids, components of RNA, lipids) can form under conditions judged plausible for the early Earth. Experiments have shown this, from Miller's in 1953 to the synthesis of RNA components in 2009 (last article below).","Several scenarios are studied: an “RNA world”, where RNA stores information and catalyses reactions, hydrothermal vents on the ocean floor, warm surface pools. None is demonstrated."],"i":["The full path, from lifeless chemistry to a cell able to reproduce and evolve: we know some steps, not how they connect.","Where and when it happened, and whether it is a rare event or a probable one."],"d":["Almost no rock from that era remains: the oldest geological records are rare and heavily altered.","We cannot repeat the experiment over millions of years or in a whole ocean: labs reproduce only isolated steps.","These steps often require chemical conditions that are incompatible with each other, which forces us to imagine environments where they follow one another."],"e":"Knowing whether life is a rare accident or a probable result of chemistry, which changes how we look for life elsewhere.","c":["Prebiotic chemistry: how simple molecules give more complex ones.","The three articles below are entry points; the last describes a specific successful step."]}},"ia":[]},{"id":"biodiversite","qq":{"fr":"Qu'est-ce qui détermine la diversité des espèces ?","en":"What determines species diversity?"},"nmm":{"fr":"Diversité des espèces","en":"Species diversity"},"cc":{"fr":"Certains milieux abritent des milliers d'espèces et d'autres très peu, sans qu'une règle générale l'explique.","en":"Some environments host thousands of species and others very few, with no general rule to explain it."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[4,106],"t":false,"x":0.186,"y":-0.855,"f":null,"ia":[]},{"id":"humain","qq":{"fr":"Quels changements génétiques nous ont rendus humains ?","en":"What genetic changes made us uniquely human?"},"nmm":{"fr":"Ce qui nous rend humains","en":"What makes us human"},"cc":{"fr":"Notre génome est très proche de celui du chimpanzé. Quelles différences comptent vraiment reste à établir.","en":"Our genome is very close to the chimpanzee's. Which differences really matter remains to be established."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[33,225],"t":true,"x":0.215,"y":0.136,"f":null,"ia":[]},{"id":"memoire","qq":{"fr":"Comment les souvenirs sont-ils stockés et retrouvés ?","en":"How are memories stored and retrieved?"},"nmm":{"fr":"Mémoire","en":"Memory"},"cc":{"fr":"On sait que les connexions entre neurones changent quand on apprend. On ne sait pas lire un souvenir dans un cerveau.","en":"We know that connections between neurons change when we learn. We cannot read a memory in a brain."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[184,183],"t":false,"x":0.606,"y":0.427,"f":{"w":{"fr":{"t":"Mémoire (psychologie)","x":"En psychologie, la mémoire est la faculté de l'esprit d'enregistrer, conserver et rappeler les expériences passées. Son investigation est réalisée par différentes disciplines : psychologie cognitive, neuropsychologie, et psychanalyse.","u":"https://fr.wikipedia.org/wiki/M%C3%A9moire_(psychologie)"},"en":{"t":"Memory","x":"Memory is the faculty of the mind by which data or information is encoded, stored, and retrieved when needed. It is the retention of information over time for the purpose of influencing future action. If past events could not be remembered, it would be impossible for language, relationships, or personal identity to develop. Memory loss is usually described as forgetfulness or a disorder such as amnesia.","u":"https://en.wikipedia.org/wiki/Memory"}},"r":[{"t":"Memory engrams: Recalling the past and imagining the future","a":"Sheena A. Josselyn, Susumu Tonegawa","y":2020,"u":"https://doi.org/10.1126/science.aaw4325"}],"rv":null,"ck":0,"fr":{"s":["Les souvenirs sont associés à des groupes de neurones, appelés engrammes, qui s'activent quand on se rappelle.","Chez la souris, on a pu activer artificiellement un engramme et provoquer un comportement de rappel.","L'hippocampe joue un rôle central dans la formation des souvenirs récents."],"i":["Où et comment les souvenirs à long terme sont stockés.","Pourquoi certains souvenirs sont gardés et d'autres perdus."],"d":["On ne peut pas observer un souvenir : on voit seulement l'activité des neurones, ce qui laisse des interprétations différentes.","La plupart des expériences précises sont faites chez la souris, pas chez l'être humain."],"e":"Comprendre la mémoire éclaire des maladies comme Alzheimer et la façon d'apprendre.","c":["Les neurosciences cognitives.","Un premier pas : lire comment on active un engramme chez la souris.","L'article ci-dessous est une revue sur les engrammes de mémoire."]},"en":{"s":["Memories are associated with groups of neurons, called engrams, which activate when we remember.","In mice, an engram has been artificially activated and a recall behaviour triggered.","The hippocampus plays a central role in forming recent memories."],"i":["Where and how long-term memories are stored.","Why some memories are kept and others lost."],"d":["A memory cannot be observed: we see only neuronal activity, which leaves room for different interpretations.","Most precise experiments are done in mice, not in humans."],"e":"Understanding memory sheds light on diseases such as Alzheimer's and on how we learn.","c":["Cognitive neuroscience.","A first step: read how an engram is activated in a mouse.","The article below is a review of memory engrams."]}},"ia":[]},{"id":"cooperation","qq":{"fr":"Comment la coopération est-elle apparue au cours de l'évolution ?","en":"How did cooperation evolve?"},"nmm":{"fr":"Coopération","en":"Cooperation"},"cc":{"fr":"La sélection naturelle favorise l'intérêt individuel, et pourtant de nombreuses espèces, dont la nôtre, s'entraident.","en":"Natural selection favours individual interest, yet many species, ours included, help one another."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[4,211,223],"t":true,"x":0.043,"y":0.23,"f":null,"ia":[]},{"id":"donnees-biologiques","qq":{"fr":"Comment tirer une vue d'ensemble de la masse des données biologiques ?","en":"How will big pictures emerge from a sea of biological data?"},"nmm":{"fr":"Masse de données biologiques","en":"Mass of biological data"},"cc":{"fr":"La biologie produit plus de mesures qu'elle ne sait en relier pour comprendre un organisme entier.","en":"Biology produces more measurements than it can connect to understand a whole organism."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[34,62,137],"t":true,"x":-0.282,"y":0.061,"f":null,"ia":[]},{"id":"auto-assemblage","qq":{"fr":"Jusqu'où peut-on pousser l'auto-assemblage chimique ?","en":"How far can we push chemical self-assembly?"},"nmm":{"fr":"Auto-assemblage","en":"Self-assembly"},"cc":{"fr":"Le vivant construit des structures complexes à partir de molécules qui s'organisent seules. Les chimistes n'en reproduisent que des versions simples.","en":"Living things build complex structures from molecules that organise themselves. Chemists reproduce only simple versions."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[55,125,56],"t":false,"x":-0.359,"y":-0.707,"f":null,"ia":[]},{"id":"limites-calcul","qq":{"fr":"Quelles sont les limites du calcul conventionnel ?","en":"What are the limits of conventional computing?"},"nmm":{"fr":"Limites du calcul","en":"Limits of computing"},"cc":{"fr":"Certains problèmes semblent hors de portée de tout ordinateur classique, quelle que soit sa puissance.","en":"Some problems seem out of reach of any classical computer, however powerful."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[59,64,138],"t":false,"x":-0.798,"y":0.271,"f":null,"ia":[]},{"id":"immunite","qq":{"fr":"Peut-on éteindre sélectivement une réponse immunitaire ?","en":"Can we selectively shut off immune responses?"},"nmm":{"fr":"Éteindre l'immunité","en":"Switching off immunity"},"cc":{"fr":"Cela permettrait de traiter les maladies auto-immunes et les rejets de greffe sans affaiblir toutes les défenses du corps.","en":"It would allow treating autoimmune diseases and transplant rejection without weakening all the body's defences."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[117,156,179],"t":false,"x":0.827,"y":-0.113,"f":null,"ia":[]},{"id":"quantique","qq":{"fr":"Des principes plus profonds se cachent-ils derrière l'incertitude quantique ?","en":"Do deeper principles underlie quantum uncertainty and nonlocality?"},"nmm":{"fr":"Au-delà du quantique","en":"Beyond quantum"},"cc":{"fr":"La mécanique quantique prédit très bien les résultats d'expérience, sans dire pourquoi le hasard et l'action à distance y apparaissent.","en":"Quantum mechanics predicts experimental results very well, without saying why chance and action at a distance appear in it."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[202,134,17],"t":true,"x":-0.576,"y":0.065,"f":null,"ia":[]},{"id":"vaccin-vih","qq":{"fr":"Un vaccin efficace contre le VIH est-il possible ?","en":"Is an effective HIV vaccine feasible?"},"nmm":{"fr":"Vaccin contre le VIH","en":"HIV vaccine"},"cc":{"fr":"Le virus mute vite et s'attaque aux cellules mêmes qui devraient le combattre.","en":"The virus mutates quickly and attacks the very cells that should fight it."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[120,117,158],"t":false,"x":0.745,"y":-0.358,"f":null,"ia":[]},{"id":"rechauffement","qq":{"fr":"Quelle température atteindra le monde sous effet de serre ?","en":"How hot will the greenhouse world be?"},"nmm":{"fr":"Ampleur du réchauffement","en":"Extent of warming"},"cc":{"fr":"La réponse dépend de la sensibilité du climat aux gaz à effet de serre, que les modèles n'encadrent qu'avec une marge.","en":"The answer depends on climate sensitivity to greenhouse gases, which models constrain only within a range."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[109,73],"t":false,"x":-0.07,"y":-0.82,"f":{"w":{"fr":{"t":"Changement climatique","x":"Le changement climatique, également nommé réchauffement climatique ou plus rarement dérèglement climatique, est l'effet de l'augmentation rapide de la température moyenne de la surface terrestre en cours aux XXe et XXIe siècles ainsi que, plus généralement, la modification des régimes météorologiques à grande échelle qui en résulte.","u":"https://fr.wikipedia.org/wiki/Changement_climatique"},"en":{"t":"Climate change","x":"Present-day climate change includes both global warming—the ongoing increase in global average temperature—and its wider effects on Earth's climate system. In a broader sense, climate change also includes previous long-term changes to Earth's climate. The modern-day rise in global temperatures is driven by human activities, especially fossil fuel burning since the Industrial Revolution. Fossil fuel use, deforestation, and some agricultural and industrial practices release greenhouse gases.","u":"https://en.wikipedia.org/wiki/Climate_change"}},"r":[{"t":"Climate Change 2021 – The Physical Science Basis: Working Group I Contribution to the Sixth Assessment Report of the Intergovernmental Panel on Climate Change","a":"Intergovernmental Panel on Climate Change","y":2023,"u":"https://doi.org/10.1017/9781009157896"}],"rv":null,"ck":1,"fr":{"s":["La température moyenne de la Terre a augmenté depuis la fin du XIXe siècle. Les rapports du GIEC concluent que l'influence humaine, surtout par les gaz à effet de serre, en est la cause.","Le dioxyde de carbone de l'atmosphère a fortement augmenté depuis l'ère industrielle, ce qui est mesuré directement.","Les projections dépendent des émissions futures : plus elles sont élevées, plus le réchauffement est fort."],"i":["Jusqu'où le climat se réchauffera, car la sensibilité du climat aux gaz à effet de serre reste connue dans une fourchette.","À quel point certains phénomènes (nuages, glaces, courants océaniques) amplifieront ou freineront le réchauffement."],"d":["Le climat est un système de nombreux éléments qui interagissent, et on ne peut pas faire l'expérience à l'échelle de la planète.","Les émissions futures dépendent de décisions humaines, pas seulement de la physique."],"e":"Savoir quelle température sera atteinte permet de décider des mesures à prendre.","c":["La climatologie et la modélisation du climat.","Un premier pas : comparer la courbe du CO2 et celle de la température depuis 1900.","Le rapport ci-dessous est l'évaluation du GIEC de 2021 sur les bases physiques."]},"en":{"s":["Earth's average temperature has risen since the late 19th century. IPCC reports conclude that human influence, mainly through greenhouse gases, is the cause.","Atmospheric carbon dioxide has risen sharply since the industrial era, which is measured directly.","Projections depend on future emissions: the higher they are, the stronger the warming."],"i":["How far the climate will warm, since climate sensitivity to greenhouse gases is still known only within a range.","How much certain phenomena (clouds, ice, ocean currents) will amplify or dampen the warming."],"d":["The climate is a system of many interacting elements, and we cannot run the experiment on a planetary scale.","Future emissions depend on human decisions, not only on physics."],"e":"Knowing what temperature will be reached makes it possible to decide what measures to take.","c":["Climatology and climate modelling.","A first step: compare the CO2 curve and the temperature curve since 1900.","The report below is the IPCC's 2021 assessment of the physical basis."]}},"ia":[]},{"id":"apres-petrole","qq":{"fr":"Qu'est-ce qui remplacera le pétrole bon marché, et quand ?","en":"What will replace oil, and when?"},"nmm":{"fr":"Après le pétrole","en":"After oil"},"cc":{"fr":"La question est à la fois technique et économique.","en":"The question is both technical and economic."},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[88,86,82],"t":true,"x":-0.559,"y":-0.161,"f":null,"ia":[]},{"id":"malthus","qq":{"fr":"Malthus continuera-t-il d'avoir tort ?","en":"Will Malthus continue to be wrong?"},"nmm":{"fr":"Malthus","en":"Malthus"},"cc":{"fr":"En 1798, Malthus prédisait que la croissance de la population serait stoppée par la famine, la guerre ou la maladie. La population a été multipliée par six sans l'effondrement annoncé. Peut-on continuer à l'éviter ?","en":"In 1798 Malthus predicted that population growth would be stopped by famine, war or disease. Population has grown sixfold without the announced collapse. Can this continue?"},"no":null,"s":"science2005","st":"ouverte","k":0,"subs":[228,1,214],"t":true,"x":-0.054,"y":0.164,"f":null,"ia":[]},{"id":"p-np","qq":{"fr":"Vérifier une solution est-il aussi difficile que la trouver ?","en":"Is checking a solution as hard as finding it?"},"nmm":{"fr":"P contre NP","en":"P versus NP"},"cc":{"fr":"C'est le problème « P contre NP », la question centrale de la théorie de la complexité.","en":"This is the “P versus NP” problem, the central question of complexity theory."},"no":null,"s":"clay","st":"ouverte","k":0,"subs":[59,138],"t":false,"x":-0.864,"y":0.085,"f":{"w":{"fr":{"t":"Problème P ≟ NP","x":"Le problème P ≟ NP est une conjecture en mathématiques, et plus précisément en informatique théorique, considérée par de nombreux chercheurs comme une des plus importantes conjectures du domaine, et même des mathématiques en général. L'Institut de mathématiques Clay a inclus ce problème dans sa liste des sept problèmes du prix du millénaire, et offre à ce titre un million de dollars à quiconque sera en mesure de démontrer P = NP ou P ≠ NP ou de démontrer que ce n'est pas démontrable.","u":"https://fr.wikipedia.org/wiki/Probl%C3%A8me_P_%E2%89%9F_NP"},"en":{"t":"P versus NP problem","x":"The P versus NP problem is a major unsolved problem in theoretical computer science. Informally, it asks whether every decision problem for which a proposed positive answer can be quickly verified can also be quickly solved.","u":"https://en.wikipedia.org/wiki/P_versus_NP_problem"}},"r":[{"t":"The status of the P versus NP problem","a":"Lance Fortnow","y":2009,"u":"https://doi.org/10.1145/1562164.1562186"},{"t":"P vs NP, description officielle du problème","a":"Clay Mathematics Institute","y":null,"u":"https://www.claymath.org/millennium/p-vs-np/"}],"rv":null,"ck":2,"fr":{"s":["Un problème est dans P si un ordinateur peut le résoudre en un temps raisonnable, même quand les données grossissent. Il est dans NP si, quand on vous propose une solution, vous pouvez la vérifier vite.","Tout problème de P est dans NP : ce qu'on sait résoudre vite, on sait le vérifier vite.","Des milliers de problèmes utiles sont dans NP (organiser des tournées, remplir un emploi du temps, ranger des objets dans le moins de boîtes), et pour beaucoup d'entre eux personne ne connaît d'algorithme rapide.","La plupart des spécialistes pensent que P est différent de NP, sans l'avoir prouvé."],"i":["Si P est égal à NP ou non. Personne n'a démontré l'un ni l'autre. L'institut Clay offre un million de dollars à qui y parviendra : c'est un des problèmes du prix du millénaire."],"d":["Prouver qu'un problème est impossible à résoudre vite oblige à raisonner sur tous les programmes possibles, y compris ceux que personne n'a encore imaginés.","Des résultats montrent que plusieurs familles de techniques de preuve ne peuvent pas suffire à trancher. Il faut donc inventer de nouvelles méthodes."],"e":"Si P était égal à NP avec un algorithme pratique, une grande partie de la cryptographie actuelle serait cassée. Dans l'autre cas, on saurait que pour des milliers de problèmes, aucune astuce ne donnera d'algorithme rapide.","c":["La théorie de la complexité, une branche de l'informatique théorique et des mathématiques.","Un premier pas : comprendre pourquoi vérifier une grille de sudoku est facile alors que résoudre ce type de problème en général ne l'est pas.","Lire la description officielle du problème sur le site de l'institut Clay, ci-dessous."]},"en":{"s":["A problem is in P if a computer can solve it in reasonable time, even as the data grow. It is in NP if, when someone proposes a solution, you can check it quickly.","Every problem in P is in NP: what we can solve fast we can check fast.","Thousands of useful problems are in NP (planning routes, filling a timetable, packing objects into the fewest boxes), and for many of them nobody knows a fast algorithm.","Most specialists think P is different from NP, without having proved it."],"i":["Whether P equals NP or not. Nobody has proved either. The Clay Institute offers a million dollars to whoever does: it is one of the Millennium Prize problems."],"d":["Proving that a problem cannot be solved quickly means reasoning about all possible programs, including ones nobody has imagined yet.","Results show that several families of proof techniques cannot be enough to settle it. New methods must be invented."],"e":"If P equalled NP with a practical algorithm, much of today's cryptography would be broken. In the other case, we would know that for thousands of problems no trick will give a fast algorithm.","c":["Complexity theory, a branch of theoretical computer science and mathematics.","A first step: understand why checking a sudoku grid is easy while solving this kind of problem in general is not.","Read the official description of the problem on the Clay Institute site, below."]}},"ia":[]},{"id":"riemann","qq":{"fr":"L'hypothèse de Riemann est-elle vraie ?","en":"Is the Riemann hypothesis true?"},"nmm":{"fr":"Hypothèse de Riemann","en":"Riemann hypothesis"},"cc":{"fr":"Formulée en 1859, elle porte sur la répartition des nombres premiers.","en":"Formulated in 1859, it concerns the distribution of prime numbers."},"no":null,"s":"clay","st":"ouverte","k":0,"subs":[129],"t":false,"x":-0.987,"y":-0.059,"f":{"w":{"fr":{"t":"Hypothèse de Riemann","x":"En mathématiques, l'hypothèse de Riemann est une conjecture formulée en 1859 par le mathématicien allemand Bernhard Riemann, selon laquelle les zéros non triviaux de la fonction zêta de Riemann ont tous une partie réelle égale à 1/2. Sa démonstration améliorerait la connaissance de la répartition des nombres premiers et ouvrirait des nouveaux domaines aux mathématiques.","u":"https://fr.wikipedia.org/wiki/Hypoth%C3%A8se_de_Riemann"},"en":{"t":"Riemann hypothesis","x":"In mathematics, the Riemann hypothesis is the conjecture that the Riemann zeta function has its zeros only at the negative even integers and at complex numbers with real part. Many consider it to be the most important unsolved problem in pure mathematics. It is of great interest in number theory because it implies results about the distribution of prime numbers. It was proposed by Bernhard Riemann, after whom it is named.","u":"https://en.wikipedia.org/wiki/Riemann_hypothesis"}},"r":[{"t":"The Riemann hypothesis is true up to 3·1012","a":"David J. Platt, Timothy S. Trudgian","y":2021,"u":"https://doi.org/10.1112/blms.12460"},{"t":"L'hypothèse de Riemann, description officielle du problème","a":"Clay Mathematics Institute","y":null,"u":"https://www.claymath.org/millennium/riemann-hypothesis/"}],"rv":null,"ck":3,"fr":{"s":["Les nombres premiers se répartissent selon une loi moyenne connue (le théorème des nombres premiers, démontré en 1896). Les écarts à cette loi se lisent dans les zéros d'une fonction, la fonction zêta de Riemann.","En 1859, Riemann a affirmé que tous les zéros « non triviaux » de cette fonction ont une partie réelle égale à 1/2. C'est l'hypothèse de Riemann.","Les ordinateurs l'ont vérifiée pour tous les zéros jusqu'à une hauteur d'environ 3 000 milliards, sans contre-exemple."],"i":["Si elle est vraie pour tous les zéros, qui sont en nombre infini.","Les écarts exacts de la répartition des nombres premiers par rapport à la loi moyenne."],"d":["Aucune vérification par ordinateur ne peut couvrir une infinité de zéros : il faut une démonstration.","Pour des objets voisins, l'analogue de l'hypothèse a été démontré (par Weil, puis Deligne), mais la méthode n'a pas pu être transposée jusqu'ici aux nombres entiers."],"e":"De nombreux résultats sur les nombres premiers sont démontrés « si l'hypothèse de Riemann est vraie ». C'est l'un des problèmes du prix du millénaire : un million de dollars à qui la résoudra.","c":["La théorie analytique des nombres.","Un premier pas : comprendre ce qu'est un zéro d'une fonction, puis pourquoi leur position contrôle la répartition des nombres premiers.","Lire la description officielle du problème sur le site de l'institut Clay, ci-dessous."]},"en":{"s":["Prime numbers follow a known average law (the prime number theorem, proved in 1896). Deviations from this law are read in the zeros of a function, the Riemann zeta function.","In 1859 Riemann asserted that all the “non-trivial” zeros of this function have real part equal to 1/2. This is the Riemann hypothesis.","Computers have checked it for all zeros up to a height of about 3,000 billion, with no counterexample."],"i":["Whether it is true for all zeros, of which there are infinitely many.","The exact deviations of the distribution of primes from the average law."],"d":["No computer check can cover infinitely many zeros: a proof is needed.","For neighbouring objects, the analogue of the hypothesis has been proved (by Weil, then Deligne), but the method has not so far been transposed to the integers."],"e":"Many results on primes are proved “if the Riemann hypothesis is true”. It is one of the Millennium Prize problems: a million dollars to whoever solves it.","c":["Analytic number theory.","A first step: understand what a zero of a function is, then why their position controls the distribution of primes.","Read the official description of the problem on the Clay Institute site, below."]}},"ia":[{"id":"riemann-anthropic-zeros","q":["riemann"],"st":"assisted","date":"2026-08-10","checked":"2026-11-20","title":{"fr":"Riemann : plus de zéros sur la droite critique (Anthropic)","en":"Riemann: more zeros on the critical line (Anthropic)"},"fr":"Le 10 août 2026, Anthropic a annoncé qu'un modèle de recherche non publié avait relevé la borne prouvée de la proportion de zéros de la fonction zêta situés sur la droite critique, de 41,6 % à 67,2 %. C'est un résultat partiel : Anthropic dit explicitement ne pas avoir prouvé l'hypothèse de Riemann et ne pas s'attendre à ce que la technique la résolve. Des mathématiciens d'Anthropic ont vérifié le résultat, une formalisation en Lean est publique, et deux experts extérieurs (Conrey et Goldston) ont regardé l'article dans un délai court. Nous n'avons pas trouvé d'évaluation par les pairs terminée.","en":"On 10 August 2026 Anthropic announced that an unreleased research model had raised the proven lower bound for the proportion of zeta zeros on the critical line from 41.6% to 67.2%. This is a partial result: Anthropic explicitly says it did not prove the Riemann hypothesis and does not expect the technique to resolve it. Anthropic mathematicians checked it, a Lean formalisation is public, and two outside experts (Conrey and Goldston) looked at the paper at short notice. We found no completed peer review.","r":[{"t":"Riemann zeta (announcement)","u":"https://www.anthropic.com/news/riemann-zeta","a":"Anthropic","y":2026},{"t":"An unreleased Anthropic model made progress on one of maths' biggest unsolved problems","u":"https://techcrunch.com/2026/08/11/an-unreleased-anthropic-model-made-progress-on-one-of-maths-biggest-unsolved-problems/","a":"TechCrunch","y":2026}],"ladder":[{"k":"announced","s":"yes","note":{"fr":"Annonce d'Anthropic (source primaire), reprise par TechCrunch.","en":"Anthropic's announcement (primary source), covered by TechCrunch."},"src":[{"t":"Anthropic","u":"https://www.anthropic.com/news/riemann-zeta","pub":"Anthropic","primary":true},{"t":"TechCrunch","u":"https://techcrunch.com/2026/08/11/an-unreleased-anthropic-model-made-progress-on-one-of-maths-biggest-unsolved-problems/","pub":"TechCrunch","primary":false}]},{"k":"formal","s":"yes","note":{"fr":"Formalisation Lean publique selon Anthropic ; TechCrunch le rapporte aussi.","en":"Public Lean formalisation according to Anthropic; TechCrunch reports it too."},"src":[{"t":"Anthropic","u":"https://www.anthropic.com/news/riemann-zeta","pub":"Anthropic","primary":true},{"t":" ician Levent Alpöge (Anthropic) posted a 4-page note saying he believes he found, working with Claude, a proof of the Riemann hypothesis and its generalised version, with Lean files. According to AFP and OfficeChai, nobody has verified this: no outside expert has confirmed it, there is no paper, and it is unclear whether the Lean statement faithfully encodes the Riemann hypothesis or whether the files build. We could not read the note itself. The Clay Institute has said nothing, and its rules require peer-reviewed publication followed by two years of scrutiny. Treat it as a claim, not a result.","r":[{"t":"Anthropic researcher says Claude solved math's greatest riddle","u":"https://www.france24.com/en/live-news/20261120-anthropic-researcher-says-claude-solved-math-s-greatest-riddle","a":"France 24 (AFP)","y":2026},{"t":"Claimed Riemann Hypothesis Proof Made With Claude Appears On Anthropic Mathematician Levent Alpöge's Website","u":"https://officechai.com/ai/claimed-riemann-hypothesis-proof-made-with-claude-appears-on-anthropic-mathematician-levent-alpoges-website/","a":"OfficeChai","y":2026}],"ladder":[{"k":"announced","s":"yes","note":{"fr":"Note publiée le 20 novembre 2026, rapportée par l'AFP et OfficeChai (note elle-même non lue).","en":"Note posted on 20 November 2026, reported by AFP and OfficeChai (the note itself not read)."},"src":[{"t":"France 24 (AFP)","u":"https://www.france24.com/en/live-news/20261120-anthropic-researcher-says-claude-solved-math-s-greatest-riddle","pub":"AFP","primary":false},{"t":"OfficeChai","u":"https://officechai.com/ai/claimed-riemann-hypothesis-proof-made-with-claude-appears-on-anthropic-mathematician-levent-alpoges-website/","pub":"OfficeChai","primary":false}]},{"k":"formal","s":"unknown","note":{"fr":"Des fichiers Lean sont annoncés ; on ne sait pas s'ils compilent ni si l'énoncé traduit bien l'hypothèse de Riemann.","en":"Lean files are announced; unknown whether they build or state the Riemann hypothesis correctly."},"src":[  describes the forces between particles. Its rigorous mathematical construction is missing, along with a proof of a positive “mass gap”."},"no":null,"s":"clay","st":"ouverte","k":0,"subs":[134,201],"t":false,"x":-0.828,"y":-0.208,"f":null,"ia":[]},{"id":"navier-stokes","qq":{"fr":"Les équations de Navier-Stokes ont-elles toujours une solution régulière ?","en":"Do the Navier–Stokes equations always have a smooth solution?"},"nmm":{"fr":"Navier-Stokes","en":"Navier–Stokes"},"cc":{"fr":"Ces équations décrivent l'écoulement des fluides depuis le XIXe siècle. Le problème demande si leurs solutions existent toujours et restent lisses en trois dimensions.","en":"These equations have described fluid flow since the 19th century. The problem asks whether their solutions always exist and stay smooth in three dimensions."},"no":{"fr":"Une résolution a été proposée en septembre 2026. L'institut Clay classe le problème comme « actif » et n'a pas attribué le prix (d'après MathWorld, consulté le 16 novembre 2026).","en":"A resolution was proposed in September 2026. The Clay Institute lists the problem as “active” and has not awarded the prize (according to MathWorld, consulted 16 November 2026)."},"s":"clay","st":"evaluation","k":0,"subs":[130,50,94],"t":false,"x":-0.729,"y":-0.19,"f":{"w":{"fr":{"t":"Équations de Navier-Stokes","x":"En mécanique des fluides, les équations de Navier-Stokes sont des équations aux dérivées partielles non linéaires qui décrivent le mouvement des fluides newtoniens. La résolution de ces équations modélisant un fluide comme un milieu continu à une seule phase est difficile, et l'existence mathématique de solutions des équations de Navier-Stokes n'est pas démontrée.","u":"https://fr.wikipedia.org/wiki/%C3%89quations_de_Navier-Stokes"},"en":{"t":"Navier–Stokes existence and smoothness","x":"The question of whether the Navier–Stokes equations always have smooth solutions in three-dimensional Euclidean space, given some initial conditions and possibly an external force, has been a longstanding unsolved problem in mathematics since the early 20th century. The equations are a system of partial differential equations that describe the motion of a fluid in space.","u":"https://en.wikipedia.org/wiki/Navier%E2%80%93Stokes_existence_and_smoothness"}},"r":[{"t":"Navier-Stokes equation, description officielle du problème","a":"Clay Mathematics Institute","y":null,"u":"https://www.claymath.org/millennium/navier-stokes-equation/"}],"rv":null,"ck":2,"fr":{"s":["Les équations de Navier-Stokes décrivent le mouvement des fluides comme l'eau et l'air. Elles sont utilisées en météorologie, en aéronautique et dans de nombreux domaines.","En deux dimensions, on sait démontrer que les solutions existent et restent régulières.","En trois dimensions, on sait démontrer l'existence de solutions pour un temps court, ou de solutions plus faibles, mais pas pour tout temps avec régularité."],"i":["Si, en trois dimensions, les solutions restent toujours régulières, ou si une singularité peut apparaître.","Quel type de mathématiques permettrait d'y répondre."],"d":["Les équations sont non linéaires : les effets de grande taille et de petite taille se mélangent.","La turbulence rend le comportement des solutions difficile à décrire."],"e":"L'institut Clay offre un million de dollars à qui y répondra. C'est aussi une question de base pour la compréhension de la turbulence.","c":["Les équations aux dérivées partielles et la mécanique des fluides.","Un premier pas : comprendre pourquoi une équation non linéaire se résout plus mal qu'une équation linéaire.","La description officielle du problème est ci-dessous."]},"en":{"s":["The Navier–Stokes equations describe the motion of fluids such as water and air. They are used in meteorology, aeronautics and many other fields.","In two dimensions, it can be proved that solutions exist and stay smooth.","In three dimensions, existence of solutions is proved for a short time, or weaker solutions, but not for all time with smoothness."],"i":["Whether, in three dimensions, solutions always stay smooth, or whether a singularity can appear.","What kind of mathematics could answer it."],"d":["The equations are nonlinear: large-scale and small-scale effects get mixed.","Turbulence makes the behaviour of solutions hard to describe."],"e":"The Clay Institute offers a million dollars to whoever answers. It is also a basic question for understanding turbulence.","c":["Partial differential equations and fluid mechanics.","A first step: understand why a nonlinear equation is harder to solve than a linear one.","The official description of the problem is below."]}},"ia":[{"id":"navier-stokes-openai","q":["navier-stokes"],"st":"claimed","date":"2026-09-08","title":{"fr":"Navier-Stokes : une singularité annoncée par OpenAI","en":"Navier–Stokes: a singularity announced by OpenAI"},"fr":"Le 8 septembre 2026, OpenAI a annoncé qu'un groupe d'agents d'IA, tournant sur un modèle non public, avait trouvé une singularité dans les équations de Navier-Stokes en trois dimensions. Selon Quanta Magazine, le résultat a été vérifié dans le langage de preuve Lean ; il reste à des humains de vérifier que l'énoncé Lean correspond bien à ce qu'on voulait démontrer. Ce n'est pas encore un résultat accepté : l'institut Clay classe toujours le problème comme « actif » et n'a rien attribué (consulté en novembre 2026), la priorité est discutée, et nous n'avons pas trouvé d'examen par des pairs. Plus tôt, en septembre 2025, une équipe menée par DeepMind avait utilisé des réseaux de neurones pour trouver des singularités instables dans d'autres équations (milieux poreux, Euler avec bord), pas dans Navier-Stokes.","en":"On 8 September 2026 OpenAI announced that a group of AI agents, running on a model that is not public, had found a singularity in the three-dimensional Navier–Stokes equations. According to Quanta Magazine, the result has been checked in the Lean proof language; humans still have to check that the Lean statement matches what was meant to be proved. This is not an accepted result yet: the Clay Institute still lists the problem as “Active” and has awarded nothing (consulted November 2026), priority is disputed, and we found no peer review. Earlier, in September 2025, a DeepMind-led team used neural networks to find unstable singularities in other equations (porous media, Euler with a boundary), not in Navier–Stokes.","r":[{"t":"AI Has Solved One of Math's $1 Million Millennium Prize Problems","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","a":"Konstantin Kakaes, Quanta Magazine","y":2026},{"t":"Navier–Stokes equation (Millennium Prize Problems)","u":"https://www.claymath.org/millennium/navier-stokes-equation/","a":"Clay Mathematics Institute","y":null},{"t":"Discovery of Unstable Singularities","u":"https://arxiv.org/abs/2509.14185","a":"Wang, Bennani, Martens et al. (arXiv preprint)","y":2025}],"checked":"2026-11-20","ladder":[{"k":"announced","s":"yes","note":{"fr":"Annoncé le 8 septembre 2026 (page d'OpenAI non lue : accès refusé).","en":"Announced on 8 September 2026 (OpenAI's own page not read: access denied)."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","pub":"Quanta Magazine","primary":false},{"t":"Science News","u":"https://www.sciencenews.org/article/ai-math-puzzle-navier-stokes-openai","pub":"Science News","primary":false}]},{"k":"formal","s":"partial","note":{"fr":"Une vérification Lean est rapportée par Quanta ; des humains doivent encore vérifier que l'énoncé correspond au problème.","en":"A Lean check is reported by Quanta; humans still have to check that the statement matches the problem."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","pub":"Quanta Magazine","primary":false}]},{"k":"experts","s":"no","note":{"fr":"Pas d'examen d'experts indépendants trouvé ; le physicien Gregory Eyink dit que personne ne l'a vérifiée côté humain.","en":"No independent expert review found; physicist Gregory Eyink says nobody has verified it on the human side."},"src":[{"t":"Science News","u":"https://www.sciencenews.org/article/ai-math-puzzle-navier-stokes-openai","pub":"Science News","primary":false}]},{"k":"peer","s":"unknown","note":{"fr":"Aucune publication évaluée par des pairs trouvée.","en":"No peer-reviewed publication found."},"src":[]},{"k":"accepted","s":"no","note":{"fr":"Le Clay classe toujours le problème « actif » et n'a rien attribué.","en":"The Clay Institute still lists the problem as “Active” and has awarded nothing."},"src":[{"t":"Clay Mathematics Institute","u":"https://www.claymath.org/millennium/navier-stokes-equation/","pub":"Clay Mathematics Institute","primary":true}]}],"forecast":{"q":{"fr":"Le résultat d'OpenAI sur Navier-Stokes sera-t-il publié dans une revue à comité de lecture avant le 31 décembre 2027 ?","en":"Will OpenAI's Navier–Stokes result be published in a peer-reviewed journal by 31 December 2027?"},"closes":"2027-12-31","rung":"peer","outcome":null},"lad":[{"k":"announced","s":"yes","note":{"fr":"Annoncé le 8 septembre 2026 (page d'OpenAI non lue : accès refusé).","en":"Announced on 8 September 2026 (OpenAI's own page not read: access denied)."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","pub":"Quanta Magazine","primary":false},{"t":"Science News","u":"https://www.sciencenews.org/article/ai-math-puzzle-navier-stokes-openai","pub":"Science News","primary":false}],"n":2},{"k":"formal","s":"partial","note":{"fr":"Une vérification Lean est rapportée par Quanta ; des humains doivent encore vérifier que l'énoncé correspond au problème.","en":"A Lean check is reported by Quanta; humans still have to check that the statement matches the problem."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","pub":"Quanta Magazine","primary":false}],"n":1},{"k":"experts","s":"no","note":{"fr":"Pas d'examen d'experts indépendants trouvé ; le physicien Gregory Eyink dit que personne ne l'a vérifiée côté humain.","en":"No independent expert review found; physicist Gregory Eyink says nobody has verified it on the human side."},"src":[{"t":"Science News","u":"https://www.sciencenews.org/article/ai-math-puzzle-navier-stokes-openai","pub":"Science News","primary":false}],"n":1},{"k":"peer","s":"unknown","note":{"fr":"Aucune publication évaluée par des pairs trouvée.","en":"No peer-reviewed publication found."},"src":[],"n":0},{"k":"accepted","s":"no","note":{"fr":"Le Clay classe toujours le problème « actif » et n'a rien attribué.","en":"The Clay Institute still lists the problem as “Active” and has awarded nothing."},"src":[{"t":"Clay Mathematics Institute","u":"https://www.claymath.org/millennium/navier-stokes-equation/","pub":"Clay Mathematics Institute","primary":true}],"n":1}]}]},{"id":"hodge","qq":{"fr":"La conjecture de Hodge est-elle vraie ?","en":"Is the Hodge conjecture true?"},"nmm":{"fr":"Conjecture de Hodge","en":"Hodge conjecture"},"cc":{"fr":"Elle relie la forme de certains espaces géométriques aux équations algébriques qui les définissent.","en":"It links the shape of certain geometric spaces to the algebraic equations that define them."},"no":null,"s":"clay","st":"ouverte","k":0,"subs":[133,129],"t":false,"x":-0.934,"y":0.184,"f":{"w":{"fr":{"t":"Conjecture de Hodge","x":"En mathématiques, la conjecture de Hodge est une des grandes conjectures de la géométrie algébrique. Elle établit un lien entre la topologie algébrique d'une variété algébrique complexe non singulière et sa géométrie décrite par des équations polynomiales qui définissent des sous-variétés. Elle provient d'un résultat du mathématicien W. V. D. Hodge qui, entre 1930 et 1940, a enrichi la description de la cohomologie de De Rham afin d'y inclure des structures présentes dans le cas des variétés algébriques.","u":"https://fr.wikipedia.org/wiki/Conjecture_de_Hodge"},"en":{"t":"Hodge conjecture","x":"In mathematics, the Hodge conjecture is a major unsolved problem in algebraic geometry and complex geometry that relates the algebraic topology of a non-singular complex algebraic variety to its subvarieties.","u":"https://en.wikipedia.org/wiki/Hodge_conjecture"}},"r":[{"t":"Hodge conjecture, description officielle du problème","a":"Clay Mathematics Institute","y":null,"u":"https://www.claymath.org/millennium/hodge-conjecture/"}],"rv":null,"ck":1,"fr":{"s":["La conjecture relie la topologie d'objets géométriques définis par des équations (variétés algébriques) à des objets algébriques plus simples.","Elle est démontrée dans plusieurs cas particuliers.","Elle fait partie des sept problèmes du prix du millénaire de l'institut Clay."],"i":["Si elle est vraie en général.","Si un objet topologique d'un certain type est toujours fait de morceaux algébriques."],"d":["Elle met en relation des outils venus de domaines différents, ce qui demande de nouvelles idées.","Il n'y a pas de piste générale connue pour la démontrer ou la réfuter."],"e":"Elle donnerait un lien précis entre deux manières de décrire des formes, et ferait avancer la géométrie algébrique.","c":["La géométrie algébrique et la topologie.","Un premier pas : comprendre ce qu'est une courbe algébrique et sa topologie.","La description officielle du problème est ci-dessous."]},"en":{"s":["The conjecture links the topology of geometric objects defined by equations (algebraic varieties) to simpler algebraic objects.","It is proved in several special cases.","It is one of the seven Millennium Prize problems of the Clay Institute."],"i":["Whether it is true in general.","Whether a topological object of a certain type is always made of algebraic pieces."],"d":["It connects tools from different areas, which requires new ideas.","There is no known general route to prove or refute it."],"e":"It would give a precise link between two ways of describing shapes, and advance algebraic geometry.","c":["Algebraic geometry and topology.","A first step: understand what an algebraic curve is and its topology.","The official description of the problem is below."]}},"ia":[]},{"id":"birch-swinnerton-dyer","qq":{"fr":"La conjecture de Birch et Swinnerton-Dyer est-elle vraie ?","en":"Is the Birch and Swinnerton-Dyer conjecture true?"},"nmm":{"fr":"Birch et Swinnerton-Dyer","en":"Birch and Swinnerton-Dyer"},"cc":{"fr":"Elle porte sur le nombre de solutions rationnelles de certaines équations, les courbes elliptiques.","en":"It concerns the number of rational solutions of certain equations, elliptic curves."},"no":null,"s":"clay","st":"ouverte","k":0,"subs":[129],"t":false,"x":-0.949,"y":0.018,"f":null,"ia":[]},{"id":"goldbach","qq":{"fr":"Tout nombre pair supérieur à 2 est-il la somme de deux nombres premiers ?","en":"Is every even number greater than 2 the sum of two primes?"},"nmm":{"fr":"Conjecture de Goldbach","en":"Goldbach's conjecture"},"cc":{"fr":"Vérifiée par ordinateur sur de très grands nombres, jamais démontrée. Elle fait partie du huitième problème de Hilbert (1900).","en":"Checked by computer on very large numbers, never proved. It is part of Hilbert's eighth problem (1900)."},"no":null,"s":"hilbert","st":"ouverte","k":0,"subs":[129],"t":false,"x":-1.022,"y":0.177,"f":{"w":{"fr":{"t":"Conjecture de Goldbach","x":"La conjecture de Goldbach est l'assertion mathématique qui s’énonce comme suit :\nTout nombre entier pair supérieur à 3 peut s’écrire comme une somme de deux nombres premiers.","u":"https://fr.wikipedia.org/wiki/Conjecture_de_Goldbach"},"en":{"t":"Goldbach's conjecture","x":"Goldbach's conjecture is one of the oldest and best-known unsolved problems in number theory and all of mathematics. It states that every even natural number greater than 2 is the sum of two prime numbers.","u":"https://en.wikipedia.org/wiki/Goldbach's_conjecture"}},"r":[{"t":"Empirical verification of the even Goldbach conjecture and computation of prime gaps up to 4⋅10¹⁸","a":"Tomas Antonio Mendes Oliveira e Silva, Siegfried Herzog, Silvio Pardi","y":2013,"u":"https://doi.org/10.1090/S0025-5718-2013-02787-1"}],"rv":null,"ck":4,"fr":{"s":["Tout nombre pair supérieur à 2 serait la somme de deux nombres premiers : 4 = 2 + 2, 10 = 3 + 7, 100 = 3 + 97.","Les ordinateurs l'ont vérifiée pour tous les nombres pairs jusqu'à plusieurs milliards de milliards.","Une version plus faible, pour les nombres impairs et trois nombres premiers, a été démontrée par Harald Helfgott en 2013."],"i":["Si c'est vrai pour tous les nombres pairs, ce qui reste inconnu malgré les vérifications.","S'il existe un contre-exemple, que personne n'a trouvé."],"d":["Les nombres premiers sont définis par la multiplication, alors que la question porte sur l'addition : les outils manquent pour relier les deux.","Une vérification par ordinateur, même énorme, ne couvre pas une infinité de nombres."],"e":"C'est l'un des plus anciens problèmes ouverts de mathématiques, qui fait partie du huitième problème de Hilbert.","c":["La théorie analytique des nombres.","Un premier pas : écrire chaque nombre pair jusqu'à 50 comme somme de deux premiers.","L'article ci-dessous détaille la vérification par ordinateur."]},"en":{"s":["Every even number greater than 2 would be the sum of two primes: 4 = 2 + 2, 10 = 3 + 7, 100 = 3 + 97.","Computers have checked it for all even numbers up to several billion billion.","A weaker version, for odd numbers and three primes, was proved by Harald Helfgott in 2013."],"i":["Whether it holds for all even numbers, which remains unknown despite the checks.","Whether a counterexample exists, which nobody has found."],"d":["Primes are defined by multiplication, while the question concerns addition: tools are lacking to link the two.","A computer check, however huge, does not cover infinitely many numbers."],"e":"It is one of the oldest open problems in mathematics, part of Hilbert's eighth problem.","c":["Analytic number theory.","A first step: write each even number up to 50 as a sum of two primes.","The article below details the computer verification."]}},"ia":[]},{"id":"jumeaux","qq":{"fr":"Existe-t-il une infinité de nombres premiers jumeaux ?","en":"Are there infinitely many twin primes?"},"nmm":{"fr":"Premiers jumeaux","en":"Twin primes"},"cc":{"fr":"Deux nombres premiers jumeaux diffèrent de 2, comme 11 et 13. On a démontré en 2013 qu'il existe une infinité de paires de premiers séparés par un écart borné, sans pouvoir ramener cet écart à 2.","en":"Twin primes differ by 2, like 11 and 13. In 2013 it was proved that there are infinitely many pairs of primes separated by a bounded gap, without being able to bring that gap down to 2."},"no":null,"s":"hilbert","st":"ouverte","k":0,"subs":[129],"t":false,"x":-1.025,"y":-0.024,"f":{"w":{"fr":{"t":"Nombres premiers jumeaux","x":"En mathématiques, deux nombres premiers jumeaux sont deux nombres premiers qui ne diffèrent que de 2. Hormis pour le couple, cet écart entre nombres premiers de 2 est le plus petit possible. Les plus petits nombres premiers jumeaux sont 3 et 5, 5 et 7, 11 et 13.","u":"https://fr.wikipedia.org/wiki/Nombres_premiers_jumeaux"},"en":{"t":"Twin prime","x":"A twin prime is a prime number that is either 2 less or 2 more than another prime number—for example, either member of the twin prime pair    or (41, 43). In other words, a twin prime is a prime that has a prime gap of two. Sometimes the term twin prime is used for a pair of twin primes; an alternative name for this is prime twin or prime pair.","u":"https://en.wikipedia.org/wiki/Twin_prime"}},"r":[{"t":"Bounded gaps between primes","a":"Zhang Yitang","y":2014,"u":"https://doi.org/10.4007/annals.2014.179.3.7"},{"t":"Small gaps between primes","a":"James Maynard","y":2014,"u":"https://doi.org/10.4007/annals.2015.181.1.7"}],"rv":null,"ck":6,"fr":{"s":["Un nombre premier n'a que deux diviseurs : 1 et lui-même. Deux premiers sont jumeaux quand ils diffèrent de 2 : 3 et 5, 11 et 13, 17 et 19.","Les premiers deviennent plus rares à mesure qu'on avance, mais on continue de trouver des paires jumelles : les plus grandes connues ont des centaines de milliers de chiffres.","En 2013, Yitang Zhang a démontré qu'il existe une infinité de paires de premiers séparés par moins de 70 millions. Ce plafond a ensuite été abaissé à 246 grâce aux travaux de James Maynard et du projet collaboratif Polymath."],"i":["S'il existe une infinité de premiers jumeaux : il faudrait faire passer l'écart garanti de 246 à 2, et les méthodes actuelles ne suffisent pas.","La répartition fine des nombres premiers : on connaît la loi moyenne (le théorème des nombres premiers), pas le détail local."],"d":["Les nombres premiers sont définis par la multiplication, alors que la question des jumeaux porte sur un écart d'addition (2). Les deux opérations se combinent mal.","Les méthodes de crible, qui éliminent les nombres non premiers, butent sur un obstacle de parité : elles distinguent mal un nombre ayant un nombre pair de facteurs premiers d'un nombre en ayant un nombre impair."],"e":"Comprendre comment les nombres premiers se répartissent localement, et pas seulement en moyenne.","c":["La théorie analytique des nombres, et en particulier les méthodes de crible.","Un premier pas : chercher à la main les jumeaux jusqu'à 100, puis se demander ce qui les empêcherait de s'arrêter un jour.","Les deux articles ci-dessous sont ceux de Zhang et de Maynard."]},"en":{"s":["A prime number has only two divisors: 1 and itself. Two primes are twins when they differ by 2: 3 and 5, 11 and 13, 17 and 19.","Primes become rarer as we go on, but twin pairs keep turning up: the largest known have hundreds of thousands of digits.","In 2013 Yitang Zhang proved that there are infinitely many pairs of primes separated by less than 70 million. This ceiling was then lowered to 246 thanks to the work of James Maynard and the collaborative Polymath project."],"i":["Whether there are infinitely many twin primes: the guaranteed gap would have to go from 246 to 2, and current methods are not enough.","The fine distribution of primes: we know the average law (the prime number theorem), not the local detail."],"d":["Primes are defined by multiplication, while the twin question concerns a gap of addition (2). The two operations combine badly.","Sieve methods, which eliminate non-primes, hit a parity obstacle: they distinguish poorly a number with an even number of prime factors from one with an odd number."],"e":"Understanding how primes are distributed locally, and not just on average.","c":["Analytic number theory, and in particular sieve methods.","A first step: find twin primes by hand up to 100, then ask what would stop them from ever ending.","The two articles below are those of Zhang and Maynard."]}},"ia":[]},{"id":"langlands","qq":{"fr":"Existe-t-il une loi de réciprocité générale reliant les nombres et la symétrie ?","en":"Is there a general reciprocity law linking numbers and symmetry?"},"nmm":{"fr":"Programme de Langlands","en":"Langlands program"},"cc":{"fr":"Le neuvième problème de Hilbert demande la loi de réciprocité la plus générale. Beaucoup de spécialistes y voient le programme de Langlands, un réseau de conjectures reliant nombres, géométrie et symétries.","en":"Hilbert's ninth problem asks for the most general reciprocity law. Many specialists see in it the Langlands programme, a network of conjectures linking numbers, geometry and symmetries."},"no":null,"s":"hilbert","st":"ouverte","k":0,"subs":[129,133],"t":false,"x":-0.92,"y":0.052,"f":null,"ia":[]},{"id":"cycles-limites","qq":{"fr":"Combien de cycles limites une équation polynomiale du plan peut-elle avoir ?","en":"How many limit cycles can a polynomial equation in the plane have?"},"nmm":{"fr":"Cycles limites","en":"Limit cycles"},"cc":{"fr":"C'est le seizième problème de Hilbert. On a démontré que ce nombre est fini pour chaque équation, mais on ne sait pas le borner d'avance.","en":"This is Hilbert's sixteenth problem. It has been proved that this number is finite for each equation, but it cannot be bounded in advance."},"no":null,"s":"hilbert","st":"ouverte","k":0,"subs":[130,133],"t":false,"x":-0.943,"y":-0.069,"f":null,"ia":[]},{"id":"hilbert-6","qq":{"fr":"Peut-on fonder toute la physique sur des axiomes ?","en":"Can all of physics be built on axioms?"},"nmm":{"fr":"Axiomes de la physique","en":"Axioms of physics"},"cc":{"fr":"En 1900, Hilbert demandait de traiter la physique comme les mathématiques, à partir d'axiomes. Le problème est jugé mal défini ou seulement en partie résolu.","en":"In 1900 Hilbert asked for physics to be treated like mathematics, starting from axioms. The problem is regarded as ill-defined or only partly solved."},"no":null,"s":"hilbert","st":"ouverte","k":0,"subs":[134,204],"t":false,"x":-0.855,"y":-0.11,"f":null,"ia":[]},{"id":"collatz","qq":{"fr":"La règle de Collatz mène-t-elle toujours à 1 ?","en":"Does the Collatz rule always lead to 1?"},"nmm":{"fr":"Conjecture de Collatz","en":"Collatz conjecture"},"cc":{"fr":"On divise un nombre pair par 2 ; on multiplie un nombre impair par 3 puis on ajoute 1 ; on recommence. Tous les nombres testés par ordinateur finissent à 1, mais personne ne l'a démontré.","en":"Halve an even number; multiply an odd number by 3 and add 1; repeat. Every number tested by computer ends at 1, but nobody has proved it."},"no":null,"s":"wiki-math","st":"ouverte","k":0,"subs":[129,132],"t":false,"x":-0.823,"y":-0.031,"f":{"w":{"fr":{"t":"Conjecture de Syracuse","x":"La conjecture de Syracuse, encore appelée conjecture de Collatz, conjecture d'Ulam, conjecture tchèque, problème de Kakutani ou problème 3x + 1, est l'hypothèse mathématique selon laquelle la suite de Syracuse de n'importe quel entier strictement positif atteint 1.","u":"https://fr.wikipedia.org/wiki/Conjecture_de_Syracuse"},"en":{"t":"Collatz conjecture","x":"The Collatz conjecture is one of the most famous unsolved problems in mathematics. The conjecture asks whether repeating two simple arithmetic operations will eventually transform every positive integer into 1. It concerns sequences of integers in which each term is obtained from the previous term as follows: if a term is even, the next term is one half of it. If a term is odd, the next term is 3 times the previous term plus 1.","u":"https://en.wikipedia.org/wiki/Collatz_conjecture"}},"r":[{"t":"Almost all orbits of the Collatz map attain almost bounded values","a":"Terence Tao","y":2022,"u":"https://doi.org/10.1017/fmp.2022.8"}],"rv":null,"ck":3,"fr":{"s":["Règle : si le nombre est pair, on le divise par 2 ; s'il est impair, on le multiplie par 3 et on ajoute 1. On recommence.","Tous les nombres testés par ordinateur finissent par arriver à 1.","En 2019, Terence Tao a démontré que presque tous les nombres atteignent des valeurs très petites, en un sens précis, sans démontrer qu'ils arrivent tous à 1."],"i":["Si tous les nombres arrivent à 1.","S'il existe un nombre dont la suite grandit sans fin, ou une boucle autre que 4, 2, 1."],"d":["La règle mélange multiplication et division, ce qui donne des suites sans régularité apparente.","Il n'existe pas de méthode générale pour étudier ce type de suite."],"e":"C'est un problème simple à énoncer qui résiste depuis longtemps. Il montre qu'une règle élémentaire peut cacher une difficulté profonde.","c":["La théorie des nombres et les systèmes dynamiques.","Un premier pas : calculer à la main la suite de 27.","L'article ci-dessous est celui de Tao sur le comportement de presque tous les orbites."]},"en":{"s":["Rule: if the number is even, divide it by 2; if odd, multiply it by 3 and add 1. Repeat.","Every number tested by computer ends up reaching 1.","In 2019 Terence Tao proved that almost all numbers reach very small values, in a precise sense, without proving that they all reach 1."],"i":["Whether all numbers reach 1.","Whether some number has a sequence that grows without end, or a loop other than 4, 2, 1."],"d":["The rule mixes multiplication and division, giving sequences with no apparent regularity.","There is no general method for studying this kind of sequence."],"e":"It is a problem easy to state that has resisted for a long time. It shows that an elementary rule can hide deep difficulty.","c":["Number theory and dynamical systems.","A first step: compute by hand the sequence for 27.","The article below is Tao's, on the behaviour of almost all orbits."]}},"ia":[]},{"id":"abc","qq":{"fr":"Que dit la conjecture abc sur le lien entre addition et multiplication ?","en":"What does the abc conjecture say about adding versus multiplying?"},"nmm":{"fr":"Conjecture abc","en":"abc conjecture"},"cc":{"fr":"Elle relie les facteurs premiers de a, de b et de a + b. Une démonstration proposée en 2012 reste contestée.","en":"It links the prime factors of a, of b and of a + b. A proof proposed in 2012 remains disputed."},"no":null,"s":"wiki-math","st":"ouverte","k":0,"subs":[129],"t":false,"x":-0.981,"y":-0.014,"f":null,"ia":[]},{"id":"parfait-impair","qq":{"fr":"Existe-t-il un nombre parfait impair ?","en":"Is there an odd perfect number?"},"nmm":{"fr":"Nombres parfaits impairs","en":"Odd perfect numbers"},"cc":{"fr":"Un nombre parfait égale la somme de ses diviseurs autres que lui-même (6 = 1 + 2 + 3). On en connaît des pairs ; on n'a jamais trouvé d'impair ni prouvé qu'il n'en existe pas.","en":"A perfect number equals the sum of its divisors other than itself (6 = 1 + 2 + 3). Even ones are known; no odd one has ever been found, nor proved not to exist."},"no":null,"s":"wiki-math","st":"ouverte","k":0,"subs":[129],"t":false,"x":-0.904,"y":0.007,"f":null,"ia":[]},{"id":"hadwiger-nelson","qq":{"fr":"Combien de couleurs faut-il pour colorier le plan sans que deux points à distance
