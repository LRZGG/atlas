another planet?"},"nmm":{"fr":"Origine de la Lune","en":"Origin of the Moon"},"cc":{"fr":"L'hypothèse d'un impact avec un corps nommé Théia est la plus répandue, mais elle n'est pas définitivement établie.","en":"The hypothesis of an impact with a body called Theia is the most widespread, but it is not definitively established."},"no":null,"s":"wiki-geo","st":"ouverte","k":0,"subs":[80,75],"t":false,"x":-0.283,"y":-0.54,"f":null,"ia":[]},{"id":"noyau-terre","qq":{"fr":"De quoi est fait le noyau de la Terre ?","en":"What is the Earth's core made of?"},"nmm":{"fr":"Noyau de la Terre","en":"Earth's core"},"cc":{"fr":"Surtout de fer, mêlé à des éléments plus légers dont on ignore lesquels et en quelles quantités.","en":"Mostly iron, mixed with lighter elements, which ones and in what amounts is unknown."},"no":null,"s":"wiki-geo","st":"ouverte","k":0,"subs":[77,75],"t":false,"x":-0.24,"y":-0.553,"f":null,"ia":[]},{"id":"el-nino","qq":{"fr":"Pourquoi El Niño apparaît-il de façon irrégulière ?","en":"Why does El Niño appear irregularly?"},"nmm":{"fr":"El Niño","en":"El Niño"},"cc":{"fr":"Les mécanismes des oscillations du climat équatorial du Pacifique sont toujours à l'étude.","en":"The mechanisms of the oscillations of the equatorial Pacific climate are still under study."},"no":null,"s":"wiki-geo","st":"ouverte","k":0,"subs":[73,78],"t":false,"x":-0.025,"y":-0.817,"f":null,"ia":[]},{"id":"wow-e","qq":{"fr":"D'où venait le signal radio de 1977 ?","en":"Where did the 1977 radio signal come from?"},"nmm":{"fr":"Signal Wow!","en":"Wow! signal"},"cc":{"fr":"Le radiotélescope Big Ear (Ohio) a enregistré pendant 72 secondes un signal étroit et intense. Il n'a jamais été reçu de nouveau.","en":"The Big Ear radio telescope (Ohio) recorded a narrow, intense signal for 72 seconds. It has never been received again."},"no":null,"s":"wp-wow","st":"ouverte","k":1,"subs":[198,67],"t":false,"x":-0.713,"y":-0.053,"f":{"w":{"fr":{"t":"Signal Wow!","x":"Le signal « Wow! » est un signal radio puissant, à bande étroite et centré sur la raie à 21 centimètres, capté le 15 août 1977 par le radiotélescope de l'université d'État de l'Ohio surnommé The Big Ear. D'origine inexpliquée, ce signal, qui a été capté pendant 72 secondes et n'a plus été détecté depuis, a fait l'objet d'une attention significative de la part des médias.","u":"https://fr.wikipedia.org/wiki/Signal_Wow!"},"en":{"t":"Wow! signal","x":"The Wow! signal was a strong narrowband radio signal detected on August 15, 1977, by Ohio State University's Big Ear radio telescope in the United States, then used to support the search for extraterrestrial intelligence. The signal appeared to come from the direction of the constellation Sagittarius and bore expected hallmarks of extraterrestrial origin.","u":"https://en.wikipedia.org/wiki/Wow!_signal"}},"r":[{"t":"A VLA Search for the Ohio State “Wow”","a":"Robert H. Gray, Kevin B. Marvel","y":2001,"u":"https://doi.org/10.1086/318272"}],"rv":null,"ck":2,"fr":{"s":["Le 15 août 1977, le radiotélescope Big Ear (université d'État de l'Ohio) a enregistré un signal radio intense et à bande étroite, près de la fréquence de 1 420 MHz, celle de l'hydrogène neutre.","Le signal a duré 72 secondes, le temps que la source traverse le champ de l'antenne. L'astronome Jerry Ehman a entouré les données sur le listing et écrit « Wow! » dans la marge.","Des recherches ultérieures, avec des radiotélescopes plus sensibles, n'ont pas retrouvé de signal de ce type au même endroit du ciel."],"i":["D'où il venait : un phénomène naturel, une interférence terrestre ou autre chose. Aucune explication ne fait consensus.","S'il s'est répété : une seule détection existe, donc impossible de la vérifier par répétition."],"d":["Un événement unique ne se mesure pas deux fois : on ne peut pas le reproduire ni l'étudier de plus près.","Le télescope observait un point fixe du ciel : la direction de la source est connue seulement à une région près, pas à un point."],"e":"C'est un test de méthode : que fait-on d'un signal unique, impossible à répéter ? Il sert aussi de référence aux recherches de signaux extraterrestres.","c":["La radioastronomie et le traitement du signal.","Un premier pas : lire pourquoi 1 420 MHz est une fréquence si particulière.","Le premier article ci-dessous décrit une recherche moderne de ce signal."]},"en":{"s":["On 15 August 1977 the Big Ear radio telescope (Ohio State University) recorded an intense, narrow-band radio signal near 1,420 MHz, the frequency of neutral hydrogen.","The signal lasted 72 seconds, the time the source took to cross the antenna's field. The astronomer Jerry Ehman circled the data on the printout and wrote “Wow!” in the margin.","Later searches, with more sensitive radio telescopes, have not found a signal of this type at the same place in the sky."],"i":["Where it came from: a natural phenomenon, terrestrial interference or something else. No explanation has consensus.","Whether it repeated: a single detection exists, so it cannot be checked by repetition."],"d":["A one-off event cannot be measured twice: it cannot be reproduced or studied more closely.","The telescope was observing a fixed point in the sky: the direction of the source is known only to within a region, not a point."],"e":"It is a test of method: what do we do with a single signal that cannot be repeated? It also serves as a reference for searches for extraterrestrial signals.","c":["Radio astronomy and signal processing.","A first step: read why 1,420 MHz is such a special frequency.","The first article below describes a modern search for this signal."]}},"ia":[]},{"id":"voynich-e","qq":{"fr":"Que dit le manuscrit de Voynich, s'il dit quelque chose ?","en":"What does the Voynich manuscript say, if anything?"},"nmm":{"fr":"Manuscrit de Voynich","en":"Voynich manuscript"},"cc":{"fr":"Un livre illustré du début du XVe siècle, écrit dans une écriture inconnue. Aucune lecture ne fait consensus.","en":"An illustrated book from the early 15th century, written in an unknown script. No reading has reached consensus."},"no":null,"s":"wp-voynich","st":"ouverte","k":1,"subs":[13,12,58],"t":false,"x":-0.418,"y":0.73,"f":{"w":{"fr":{"t":"Manuscrit de Voynich","x":"Le manuscrit de Voynich est un livre illustré anonyme rédigé dans une écriture à ce jour non déchiffrée et une langue non identifiée.","u":"https://fr.wikipedia.org/wiki/Manuscrit_de_Voynich"},"en":{"t":"Voynich manuscript","x":"The Voynich manuscript is an illustrated codex, hand-written in an undeciphered script referred to as \"Voynichese\". Carbon dating and stylistic analyses indicate it may have been composed in the early 15th century (1404–1438) by someone in or from the area around modern-day Southern Germany, Switzerland and Northern Italy. However, scholars currently lack the translation and context needed to either properly entertain or eliminate any of the possibilities regarding its origin, authorship and purpose.","u":"https://en.wikipedia.org/wiki/Voynich_manuscript"}},"r":[{"t":"Keywords and Co-Occurrence Patterns in the Voynich Manuscript: An Information-Theoretic Analysis","a":"Marcelo A. Montemurro, Damián H. Zanette","y":2013,"u":"https://doi.org/10.1371/journal.pone.0066344"}],"rv":null,"ck":2,"fr":{"s":["C'est un livre illustré d'environ 240 pages, conservé à la bibliothèque Beinecke de l'université Yale. La datation au carbone 14 du vélin le place au début du XVe siècle.","Il est écrit dans une écriture inconnue, avec des dessins de plantes, d'astres et de figures qui ne correspondent à aucun ouvrage connu.","Le texte suit des régularités statistiques proches de celles d'un langage naturel, mais personne n'a produit de traduction acceptée."],"i":["Ce que dit le texte, et même si c'est un message : langue inconnue, code, ou texte sans sens, plusieurs hypothèses sont débattues.","Qui l'a écrit, où et pourquoi."],"d":["On ne connaît ni la langue, ni la clé éventuelle, ni un seul mot sûr : il n'y a aucun point d'appui pour un déchiffrement.","Les analyses statistiques montrent des régularités sans dire si elles viennent d'un langage ou d'un procédé de génération de texte."],"e":"C'est un banc d'essai pour le déchiffrement de textes anciens et pour les méthodes de traitement automatique des langues.","c":["La paléographie, la linguistique de corpus et la cryptographie historique.","Un premier pas : comparer les distributions de mots d'un texte connu et de ce manuscrit.","Le premier article ci-dessous étudie les mots-clés et leurs répartitions dans le texte."]},"en":{"s":["It is an illustrated book of about 240 pages, held at the Beinecke Library at Yale University. Carbon-14 dating of the vellum places it in the early 15th century.","It is written in an unknown script, with drawings of plants, stars and figures that match no known work.","The text follows statistical regularities close to those of a natural language, but nobody has produced an accepted translation."],"i":["What the text says, and even whether it is a message: unknown language, code, or meaningless text, several hypotheses are debated.","Who wrote it, where and why."],"d":["We know neither the language, nor the possible key, nor a single certain word: there is no foothold for a decipherment.","Statistical analyses show regularities without saying whether they come from a language or from a text-generation procedure."],"e":"It is a test bed for deciphering ancient texts and for methods of automatic language processing.","c":["Palaeography, corpus linguistics and historical cryptography.","A first step: compare the word distributions of a known text and of this manuscript.","The first article below studies keywords and how they are distributed in the text."]}},"ia":[]},{"id":"antikythere-e","qq":{"fr":"Comment fonctionnait la machine d'Anticythère ?","en":"How did the Antikythera mechanism work?"},"nmm":{"fr":"Machine d'Anticythère","en":"Antikythera mechanism"},"cc":{"fr":"Un mécanisme à engrenages antique, repêché en 1901 dans une épave. Son fonctionnement exact est encore étudié.","en":"An ancient geared mechanism, recovered from a wreck in 1901. Exactly how it worked is still being studied."},"no":null,"s":"wp-antikythere","st":"ouverte","k":1,"subs":[213,17,98],"t":true,"x":-0.362,"y":0.299,"f":{"w":{"fr":{"t":"Machine d'Anticythère","x":"La machine d'Anticythère, appelée également mécanisme d'Anticythère, est considérée comme le premier calculateur analogique antique permettant de calculer des positions astronomiques. C'est un mécanisme de bronze comprenant des dizaines de roues dentées, solidaires et disposées sur plusieurs plans. Il est garni de nombreuses inscriptions grecques.","u":"https://fr.wikipedia.org/wiki/Machine_d'Anticyth%C3%A8re"},"en":{"t":"Antikythera mechanism","x":"The Antikythera mechanism is an ancient Greek hand-powered orrery built in the 2nd century BC and discovered in 1901. It is the oldest known example of an analogue computer. It could be used to predict astronomical positions and eclipses decades in advance. It could also be used to track the four-year cycle of athletic games similar to an olympiad, the cycle of the ancient Olympic Games.","u":"https://en.wikipedia.org/wiki/Antikythera_mechanism"}},"r":[{"t":"Decoding the ancient Greek astronomical calculator known as the Antikythera Mechanism","a":"Tony Freeth, Yanis Bitsakis, X. Moussas et al.","y":2006,"u":"https://doi.org/10.1038/nature05357"},{"t":"A Model of the Cosmos in the ancient Greek Antikythera Mechanism","a":"Tony Freeth, David Higgon, Aris Dacanalis et al.","y":2021,"u":"https://doi.org/10.1038/s41598-021-84310-w"}],"rv":null,"ck":0,"fr":{"s":["Le mécanisme a été repêché en 1901 dans une épave, près de l'île d'Anticythère. Il se compose de nombreux fragments de bronze corrodé qui portent des roues dentées.","Des tomographies à rayons X ont permis de lire des inscriptions et de compter les dents des engrenages. Il servait à calculer des positions d'astres et des cycles du calendrier.","Plusieurs reconstructions ont été proposées, dont une modélisation des cadrans pour les planètes publiée en 2021."],"i":["Comment était exactement la machine entière : une part importante des pièces manque.","Qui l'a fabriquée et d'où venait ce savoir-faire : on n'a pas retrouvé d'autre objet du même type de cette époque."],"d":["Les fragments sont corrodés et mélangés, certains ont été perdus dans la mer.","On doit déduire un mécanisme complet à partir de morceaux, sans plan écrit : plusieurs reconstructions restent possibles."],"e":"Elle montre que l'astronomie antique a été capable d'une mécanique de précision que l'on pensait apparue bien plus tard, et elle pose la question de ce qui s'est perdu.","c":["L'archéologie, l'histoire des sciences et la mécanique.","Un premier pas : comprendre comment un jeu d'engrenages peut représenter des cycles de la Lune.","Les deux articles ci-dessous sont les travaux de l'équipe de Freeth, en 2006 et en 2021."]},"en":{"s":["The mechanism was recovered in 1901 from a wreck near the island of Antikythera. It consists of many fragments of corroded bronze bearing toothed wheels.","X-ray tomography made it possible to read inscriptions and count the teeth of the gears. It was used to compute positions of celestial bodies and calendar cycles.","Several reconstructions have been proposed, including a 2021 model of the planetary dials."],"i":["What the complete machine looked like: a significant part of the pieces is missing.","Who made it and where this know-how came from: no other object of the same kind from that period has been found."],"d":["The fragments are corroded and mixed up, and some were lost at sea.","A complete mechanism must be deduced from pieces, with no written plan: several reconstructions remain possible."],"e":"It shows that ancient astronomy was capable of precision mechanics thought to have appeared much later, and it raises the question of what was lost.","c":["Archaeology, the history of science and mechanics.","A first step: understand how a set of gears can represent the cycles of the Moon.","The two articles below are the work of Freeth's team, in 2006 and 2021."]}},"ia":[]},{"id":"tunguska-e","qq":{"fr":"Qu'est-ce qui a explosé au-dessus de la Toungouska en 1908 ?","en":"What exploded over Tunguska in 1908?"},"nmm":{"fr":"Événement de la Toungouska","en":"Tunguska event"},"cc":{"fr":"Une explosion a couché des millions d'arbres en Sibérie. On l'attribue le plus souvent à un astéroïde ou une comète éclatant en altitude ; les détails sont débattus.","en":"An explosion flattened millions of trees in Siberia. It is most often attributed to an asteroid or comet breaking up in the air; details are debated."},"no":null,"s":"wp-tunguska","st":"ouverte","k":1,"subs":[80,77,73],"t":false,"x":-0.319,"y":-0.726,"f":{"w":{"fr":{"t":"Événement de la Toungouska","x":"L'événement de la Toungouska désigne un ensemble d'observations faites sur une puissante explosion qui s'est produite le 30 juin 1908 vers 7 h 14 heure locale en Sibérie centrale, dans l'Empire russe. Si l'hypothèse de l'entrée atmosphérique d'un météoroïde ne semble guère faire de doute, l'ensemble des observations et mesures comporte des inconnues et des contradictions qui ont amené à formuler des hypothèses totalement divergentes et parfois farfelues.","u":"https://fr.wikipedia.org/wiki/%C3%89v%C3%A9nement_de_la_Toungouska"},"en":{"t":"Tunguska event","x":"The Tunguska event was a large explosion that occurred on the morning of 30 June [O.S. 17 June] 1908, at around 7:14 KRAT in Central Siberia, then part of the Russian Empire. The cataclysm occurred in a remote and sparsely populated region of the taiga, near the Podkamennaya Tunguska River after which it is named. The shock wave knocked several witnesses to the ground, killed at least three people as well as numerous animals, and shattered windows within a 200 km (120 mi) radius.","u":"https://en.wikipedia.org/wiki/Tunguska_event"}},"r":[{"t":"The 1908 Tunguska explosion: atmospheric disruption of a stony asteroid","a":"Christopher F. Chyba, Paul J. Thomas, Kevin J. Zahnle","y":1993,"u":"https://doi.org/10.1038/361040a0"}],"rv":null,"ck":0,"fr":{"s":["Le 30 juin 1908, une explosion a couché des arbres sur une très grande surface de forêt en Sibérie. Il n'y a pas de cratère d'impact.","L'explication la plus répandue est l'éclatement en altitude d'un petit astéroïde pierreux ou d'une comète.","Des modélisations de l'entrée atmosphérique d'un astéroïde pierreux reproduisent l'effet de souffle observé."],"i":["La nature exacte de l'objet (astéroïde, comète, autre) et sa taille.","Les détails de l'explosion, car l'étude sur place n'a eu lieu que des années après."],"d":["L'événement est ancien, en zone isolée, et les premières expéditions ont eu lieu bien après. Il n'y a presque pas de mesures directes.","L'absence de cratère oblige à raisonner à partir de dégâts au sol et de modèles."],"e":"Comprendre ce type d'événement aide à évaluer le risque que fait peser sur la Terre l'impact d'un petit objet, qui reste plus fréquent que celui d'un gros.","c":["La physique de l'entrée atmosphérique et les sciences planétaires.","Un premier pas : comprendre comment un objet peut exploser en altitude sans laisser de cratère.","Le premier article ci-dessous modélise l'éclatement d'un astéroïde pierreux."]},"en":{"s":["On 30 June 1908 an explosion flattened trees over a very large area of forest in Siberia. There is no impact crater.","The most widespread explanation is the break-up in the air of a small stony asteroid or a comet.","Models of the atmospheric entry of a stony asteroid reproduce the observed blast effect."],"i":["The exact nature of the object (asteroid, comet, other) and its size.","The details of the explosion, since studies on the ground took place only years later."],"d":["The event is old, in a remote area, and the first expeditions came long after. There are almost no direct measurements.","The lack of a crater forces reasoning from ground damage and from models."],"e":"Understanding this kind of event helps assess the risk posed to Earth by the impact of a small object, which remains more frequent than that of a large one.","c":["The physics of atmospheric entry and planetary science.","A first step: understand how an object can explode in the air without leaving a crater.","The first article below models the break-up of a stony asteroid."]}},"ia":[]},{"id":"nazca-e","qq":{"fr":"À quoi servaient les lignes et les figures de Nazca ?","en":"What were the Nazca lines for?"},"nmm":{"fr":"Lignes de Nazca","en":"Nazca lines"},"cc":{"fr":"De grandes figures et des lignes tracées dans le désert du Pérou. Leur fonction est débattue.","en":"Large figures and lines drawn in the Peruvian desert. Their purpose is debated."},"no":null,"s":"wp-nazca","st":"ouverte","k":1,"subs":[213,74],"t":true,"x":-0.19,"y":-0.108,"f":{"w":{"fr":{"t":"Géoglyphes de Nazca","x":"Les géoglyphes de Nazca, appelés communément lignes de Nazca, sont de grandes figures tracées sur le sol représentant des animaux stylisés ou de simples lignes longues de plusieurs kilomètres, visibles dans le désert de Nazca dans le sud du Pérou. Le sol sur lequel se dessinent ces géoglyphes est couvert de cailloux que l'oxyde de fer colore en rouge. En les ôtant, les Nazcas ont fait apparaître un sol gypseux grisâtre, découpant ainsi les contours des figures qu'ils traçaient.","u":"https://fr.wikipedia.org/wiki/G%C3%A9oglyphes_de_Nazca"},"en":{"t":"Nazca lines","x":"The Nazca lines are a group of geoglyphs made in the soil of the Nazca Desert in southern Peru. They were created between 500 BC and 500 AD by people making depressions or shallow incisions in the desert floor, removing pebbles and leaving different-colored dirt exposed. There are two major phases of the Nazca lines, Paracas phase, from 400 to 200 BC, and Nazca phase, from 200 BC to 500 AD.","u":"https://en.wikipedia.org/wiki/Nazca_lines"}},"r":[],"rv":null,"ck":2,"fr":{"s":["Ce sont de grandes figures et de longues lignes tracées dans le désert du sud du Pérou, en retirant les pierres sombres du sol pour faire apparaître un sol plus clair.","Elles ont été réalisées par les cultures de la région, sur plusieurs siècles. Elles sont visibles de loin, mais on les voit surtout du ciel.","Les figures sont très nombreuses et de formes variées : animaux, plantes, figures géométriques, lignes droites."],"i":["Leur fonction : plusieurs hypothèses sont proposées (rituelles, liées à l'eau, à l'astronomie), aucune ne s'impose.","Comment les groupes qui les ont tracées s'organisaient pour réaliser des figures aussi régulières."],"d":["Il n'existe aucun texte de ces cultures qui explique leur rôle.","Le climat très sec les conserve, ce qui aide, mais l'érosion et le tourisme les menacent."],"e":"Elles posent une question générale : que peut-on conclure de l'usage d'un lieu sans écrit ?","c":["L'archéologie du paysage et l'étude du climat.","Un premier pas : comparer les tracés à la répartition des sources d'eau de la région.","La fiche Wikipédia ci-dessous donne le point d'entrée."]},"en":{"s":["These are large figures and long lines drawn in the desert of southern Peru, by removing the dark stones from the ground to expose lighter soil.","They were made by the region's cultures, over several centuries. They are visible from afar, but are seen above all from the air.","The figures are very numerous and varied: animals, plants, geometric shapes, straight lines."],"i":["Their purpose: several hypotheses are proposed (ritual, tied to water, to astronomy), none prevails.","How the groups that drew them organised themselves to produce such regular figures."],"d":["There is no text from these cultures explaining their role.","The very dry climate preserves them, which helps, but erosion and tourism threaten them."],"e":"They raise a general question: what can we conclude from the use of a place without writing?","c":["Landscape archaeology and the study of climate.","A first step: compare the layouts with the distribution of water sources in the region.","The Wikipedia page below gives the entry point."]}},"ia":[]},{"id":"phaistos-e","qq":{"fr":"Que dit le disque de Phaistos ?","en":"What does the Phaistos disc say?"},"nmm":{"fr":"Disque de Phaistos","en":"Phaistos disc"},"cc":{"fr":"Un disque d'argile crétois couvert de signes en spirale. Il n'a jamais été déchiffré.","en":"A Cretan clay disc covered in spiral signs. It has never been deciphered."},"no":null,"s":"wp-phaistos","st":"ouverte","k":1,"subs":[13,213],"t":false,"x":-0.035,"y":0.636,"f":{"w":{"fr":{"t":"Disque de Phaistos","x":"Le disque de Phaistos ou disque de Phaestos est un disque d'argile cuite découvert en 1908 par l'archéologue italien Luigi Pernier sur le site archéologique du palais minoen de Phaistos, en Crète. Il pourrait dater du milieu ou de la fin de l'âge du bronze minoen. Son diamètre est d'environ seize centimètres et il est couvert, sur ses deux faces, de hiéroglyphes imprimés à l'aide de poinçons.","u":"https://fr.wikipedia.org/wiki/Disque_de_Phaistos"},"en":{"t":"Phaistos Disc","x":"The Phaistos Disc, or Phaistos Disk, is a disc of fired clay from the island of Crete, Greece, possibly from the middle or late Minoan Bronze Age, bearing a text in an unknown script and language. Its purpose and its original place of manufacture remain disputed. It is now on display at the archaeological museum of Heraklion. The name is sometimes spelled Phaestos or Festos.","u":"https://en.wikipedia.org/wiki/Phaistos_Disc"}},"r":[],"rv":null,"ck":2,"fr":{"s":["C'est un disque d'argile cuite découvert en 1908 à Phaistos, en Crète. Il porte sur ses deux faces des signes disposés en spirale, imprimés avec des poinçons.","Le disque est daté d'environ le deuxième millénaire avant notre ère. Il a été trouvé avec des objets de la même époque.","Aucune lecture n'a été acceptée par les spécialistes."],"i":["Ce que disent les signes, et même dans quelle langue.","S'il s'agit d'un texte, d'un jeu ou d'un autre type d'objet."],"d":["On n'a qu'un seul disque : c'est trop peu de texte pour tester une lecture.","Il n'existe aucun texte comparable dans cette écriture."],"e":"Un déchiffrement ajouterait une langue à l'histoire de la Méditerranée ancienne.","c":["L'archéologie égéenne et l'étude des écritures non déchiffrées.","Un premier pas : comparer ses signes à ceux du linéaire A.","Voir la page Wikipédia ci-dessous."]},"en":{"s":["It is a baked clay disc found in 1908 at Phaistos, in Crete. On both sides it carries signs arranged in a spiral, stamped with punches.","The disc is dated to about the second millennium BC. It was found with objects of the same period.","No reading has been accepted by specialists."],"i":["What the signs say, and even in which language.","Whether it is a text, a game or another kind of object."],"d":["We have only one disc: that is too little text to test a reading.","There is no comparable text in this script."],"e":"A decipherment would add a language to the history of the ancient Mediterranean.","c":["Aegean archaeology and the study of undeciphered scripts.","A first step: compare its signs with those of Linear A.","See the Wikipedia page below."]}},"ia":[]},{"id":"lineara-e","qq":{"fr":"Peut-on déchiffrer le linéaire A ?","en":"Can Linear A be deciphered?"},"nmm":{"fr":"Linéaire A","en":"Linear A"},"cc":{"fr":"L'écriture de la Crète minoenne. Les signes sont connus, la langue ne l'est pas.","en":"The script of Minoan Crete. The signs are known, the language is not."},"no":null,"s":"wp-lineara","st":"ouverte","k":1,"subs":[13,213,15],"t":false,"x":-0.1,"y":0.85,"f":{"w":{"fr":{"t":"Linéaire A","x":"Le « linéaire A » est une écriture, encore non déchiffrée, qui fut utilisée dans la Crète ancienne à l'époque minoenne. C'est Arthur Evans au début du XXe siècle qui découvrit en Crète les vestiges de cette écriture, ainsi que des autres écritures anciennes, qu'il nomma respectivement « hiéroglyphes crétois », « linéaire A » et « linéaire B », de la plus ancienne à la plus récente. Le « linéaire A » apparaît au plus tôt vers 1900 av. J.-C., avant les invasions grecques.","u":"https://fr.wikipedia.org/wiki/Lin%C3%A9aire_A"},"en":{"t":"Linear A","x":"Linear A is a writing system that was used by the Minoans of Crete from 1800 BC to 1450 BC. Linear A was the primary script used in palace and religious writings of the Minoan civilization. It was adapted into Linear B, which was used by the Mycenaeans to write an early form of Greek. Since its modern rediscovery in 1900, no texts in the script have yet been deciphered.","u":"https://en.wikipedia.org/wiki/Linear_A"}},"r":[],"rv":null,"ck":2,"fr":{"s":["Le linéaire A est l'écriture utilisée en Crète à l'époque minoenne, au deuxième millénaire avant notre ère. On en connaît les signes.","Certains signes ressemblent à ceux du linéaire B, qui note une forme ancienne de grec et a été déchiffré en 1952. On sait donc lire une partie des valeurs sonores.","La langue notée n'est pas identifiée, donc les textes ne se comprennent pas."],"i":["La langue du linéaire A : on ne sait pas à quelle famille elle appartient.","Le sens de la plupart des textes, qui sont de courtes listes sur des tablettes."],"d":["Les textes retrouvés sont courts et peu nombreux, souvent des comptes.","Sans texte bilingue, aucune autre langue connue ne sert de point d'appui."],"e":"Cela permettrait de lire l'écriture de la plus ancienne civilisation européenne de l'âge du bronze.","c":["La linguistique historique et l'archéologie égéenne.","Un premier pas : comprendre comment le linéaire B a été déchiffré.","Voir la page Wikipédia ci-dessous."]},"en":{"s":["Linear A is the script used in Crete in the Minoan period, in the second millennium BC. Its signs are known.","Some signs resemble those of Linear B, which records an early form of Greek and was deciphered in 1952. So part of the sound values can be read.","The language recorded is not identified, so the texts cannot be understood."],"i":["The language of Linear A: we do not know which family it belongs to.","The meaning of most texts, which are short lists on tablets."],"d":["The texts found are short and few, often accounts.","With no bilingual text, no other known language provides a foothold."],"e":"It would make it possible to read the script of the oldest Bronze Age civilisation in Europe.","c":["Historical linguistics and Aegean archaeology.","A first step: understand how Linear B was deciphered.","See the Wikipedia page below."]}},"ia":[]},{"id":"kryptos-e","qq":{"fr":"Quelle est la solution du dernier passage de Kryptos ?","en":"What is the solution to the last passage of Kryptos?"},"nmm":{"fr":"Kryptos","en":"Kryptos"},"cc":{"fr":"Une sculpture chiffrée de 1990 devant le siège de la CIA. Trois passages sur quatre ont été déchiffrés ; le dernier est considéré comme non résolu.","en":"An encrypted sculpture of 1990 outside CIA headquarters. Three of four passages have been deciphered; the last is considered unsolved."},"no":null,"s":"wp-kryptos","st":"ouverte","k":1,"subs":[138,61],"t":false,"x":-0.769,"y":0.207,"f":{"w":{"fr":{"t":"Kryptos (sculpture)","x":"Kryptos est une sculpture créée par Jim Sanborn (en) exposée à Langley (Virginie) dans l'enceinte du George Bush Center for Intelligence, le quartier général de la Central Intelligence Agency (CIA). Depuis son inauguration en 1990, ce monument est l'objet de nombreuses discussions quant aux messages chiffrés dont il est recouvert. À ce jour, ces messages n'ont été que partiellement déchiffrés.","u":"https://fr.wikipedia.org/wiki/Kryptos_(sculpture)"},"en":{"t":"Kryptos","x":"Kryptos is a sculpture by the American artist Jim Sanborn located on the grounds of the Central Intelligence Agency (CIA) headquarters, the George Bush Center for Intelligence in Langley, Virginia.","u":"https://en.wikipedia.org/wiki/Kryptos"}},"r":[],"rv":null,"ck":1,"fr":{"s":["Kryptos est une sculpture de Jim Sanborn, installée en 1990 devant le siège de la CIA à Langley. Elle porte quatre messages chiffrés.","Trois des quatre passages ont été déchiffrés, et les solutions ont été rendues publiques.","Le dernier passage, appelé K4, est considéré comme non résolu."],"i":["La solution de K4 et la méthode de chiffrement employée pour lui.","Si les indices publiés par l'artiste suffisent à y arriver."],"d":["Le passage est court, donc il y a peu de matière pour des analyses statistiques.","On ne sait pas quelle méthode a été employée, ce qui oblige à les essayer toutes."],"e":"C'est un exemple vivant de cryptanalyse : une énigme publique, avec des règles claires, qui sert d'exercice depuis plus de trente ans.","c":["La cryptographie classique et l'analyse de fréquence.","Un premier pas : déchiffrer à la main un texte chiffré par un chiffre de Vigenère.","Voir la page Wikipédia ci-dessous."]},"en":{"s":["Kryptos is a sculpture by Jim Sanborn, installed in 1990 outside CIA headquarters in Langley. It carries four encrypted messages.","Three of the four passages have been deciphered, and the solutions made public.","The last passage, called K4, is considered unsolved."],"i":["The solution to K4 and the encryption method used for it.","Whether the clues published by the artist are enough to get there."],"d":["The passage is short, so there is little material for statistical analysis.","We do not know which method was used, which forces trying them all."],"e":"It is a living example of cryptanalysis: a public puzzle with clear rules, used as an exercise for more than thirty years.","c":["Classical cryptography and frequency analysis.","A first step: decipher by hand a text encrypted with a Vigenère cipher.","See the Wikipedia page below."]}},"ia":[]},{"id":"prime-actions","qq":{"fr":"Pourquoi les actions rapportent-elles tant plus que les obligations ?","en":"Why do stocks earn so much more than bonds?"},"nmm":{"fr":"Prime de risque des actions","en":"Equity premium puzzle"},"cc":{"fr":"L'écart de rendement observé est bien plus grand que ce que prévoient les modèles économiques standard : c'est l'« énigme de la prime de risque ».","en":"The observed return gap is much larger than standard economic models predict: this is the “equity premium puzzle”."},"no":null,"s":"wiki-econ","st":"ouverte","k":0,"subs":[83,82],"t":false,"x":-0.653,"y":0.54,"f":null,"ia":[]},{"id":"dividendes","qq":{"fr":"Pourquoi les entreprises versent-elles des dividendes ?","en":"Why do companies pay dividends?"},"nmm":{"fr":"Énigme des dividendes","en":"Dividend puzzle"},"cc":{"fr":"Les entreprises qui en versent sont récompensées par les investisseurs, ce que la théorie standard explique mal.","en":"Companies that pay them are rewarded by investors, which standard theory explains poorly."},"no":null,"s":"wiki-econ","st":"ouverte","k":0,"subs":[83],"t":false,"x":-0.641,"y":0.584,"f":null,"ia":[]},{"id":"biais-national","qq":{"fr":"Pourquoi investit-on surtout dans son propre pays ?","en":"Why do investors favour their home country?"},"nmm":{"fr":"Biais national des placements","en":"Home bias"},"cc":{"fr":"Les investisseurs détiennent beaucoup plus d'actifs nationaux que ne le prévoit la théorie, malgré les gains possibles de la diversification.","en":"Investors hold far more domestic assets than theory predicts, despite the possible gains from diversification."},"no":null,"s":"wiki-econ","st":"ouverte","k":0,"subs":[83,82],"t":false,"x":-0.653,"y":0.54,"f":null,"ia":[]},{"id":"feldstein-horioka","qq":{"fr":"Pourquoi l'épargne d'un pays reste-t-elle surtout investie chez lui ?","en":"Why does a country's saving mostly stay invested at home?"},"nmm":{"fr":"Énigme de Feldstein-Horioka","en":"Feldstein–Horioka puzzle"},"cc":{"fr":"Dans les pays riches, l'épargne et l'investissement nationaux varient ensemble, alors que les capitaux circulent librement.","en":"In rich countries, national saving and investment move together, although capital flows freely."},"no":null,"s":"wiki-econ","st":"ouverte","k" ,"adv":1,"year":2023,"ast":"accepted","ai":1,"ar":[{"t":"FunSearch: Making new discoveries in mathematical sciences using LLMs","u":"https://deepmind.google/discover/blog/funsearch-making-new-discoveries-in-mathematical-sciences-using-large-language-models/","a":"Google DeepMind","y":2023}],"ck":"2026-11-20","subs":[132,58],"t":false,"x":-0.845,"y":0.155,"f":null,"ia":[]},{"id":"imo-2024-alphaproof","qq":{"en":"AlphaProof and AlphaGeometry 2 at the 2024 Olympiad","fr":"AlphaProof et AlphaGeometry 2 à l'Olympiade 2024"},"nmm":{"fr":"AlphaProof et…","en":"AlphaProof and…"},"cc":{"en":"DeepMind says its two systems solved 4 of 6 problems of the 2024 International Mathematical Olympiad, 28 of 42 points, one point under the gold threshold. Humans first translated the problems into formal language, and some took up to three days. Source: DeepMind's own announcement.","fr":"DeepMind indique que ses deux systèmes ont résolu 4 problèmes sur 6 de l'Olympiade internationale de mathématiques 2024, soit 28 points sur 42, à un point du seuil d'or. Des humains ont d'abord traduit les problèmes en langage formel, et certains ont pris jusqu'à trois jours. Source : l'annonce de DeepMind elle-même."},"no":null,"s":null,"st":"adv","k":0,"adv":1,"year":2024,"ast":"accepted","ai":1,"ar":[{"t":"AI achieves silver-medal standard solving International Mathematical Olympiad problems","u":"https://deepmind.google/discover/blog/ai-solves-imo-problems-at-silver-medal-level/","a":"Google DeepMind","y":2024}],"ck":"2026-11-20","subs":[58,59],"t":false,"x":-0.694,"y":0.228,"f":null,"ia":[]},{"id":"imo-2025-gold-claims","qq":{"en":"Olympiad 2025: two gold-level claims","fr":"Olympiade 2025 : deux annonces de niveau or"},"nmm":{"fr":"Olympiade 2025","en":"Olympiad 2025"},"cc":{"en":"DeepMind's Gemini Deep Think scored 35 of 42 in natural language, graded by the IMO coordinators, who say this does not validate the system itself. OpenAI claimed the same score for an experimental model graded by the company, not the IMO. Terence Tao and Kevin Buzzard said such claims are not reproducible or comparable with students.","fr":"Gemini Deep Think de DeepMind a obtenu 35 sur 42 en langage naturel, corrigé par les coordinateurs de l'OMI, qui précisent que cela ne valide pas le système lui-même. OpenAI a revendiqué le même score pour un modèle expérimental corrigé par l'entreprise, pas par l'OMI. Terence Tao et Kevin Buzzard ont jugé ces annonces non reproductibles et non comparables à celles des élèves."},"no":null,"s":null,"st":"adv","k":0,"adv":1,"year":2025,"ast":"disputed","ai":1,"ar":[{"t":"Advanced version of Gemini with Deep Think officially achieves gold-medal standard at the IMO","u":"https://deepmind.google/blog/advanced-version-of-gemini-with-deep-think-officially-achieves-gold-medal-standard-at-the-international-mathematical-olympiad/","a":"Google DeepMind","y":2025},{"t":"International Mathematical Olympiad","u":"https://en.wikipedia.org/wiki/International_Mathematical_Olympiad","a":"Wikipedia (en)","y":null}],"ck":"2026-11-20","subs":[58,59],"t":false,"x":-0.694,"y":0.228,"f":null,"ia":[]},{"id":"gnome-materials","qq":{"en":"GNoME proposes 2.2 million crystals; experts doubt the novelty","fr":"GNoME propose 2,2 millions de cristaux ; des experts doutent de leur nouveauté"},"nmm":{"fr":"GNoME propose 2,2 millions…","en":"GNoME proposes 2.2 million…"},"cc":{"en":"In November 2023 DeepMind said GNoME predicted 2.2 million new crystals, 380,000 of them stable candidates. In 2024 chemists Anthony Cheetham and Ram Seshadri replied that they found no strikingly novel compounds, and that the paper lists proposed compounds rather than new materials.","fr":"En novembre 2023, DeepMind a annoncé que GNoME avait prédit 2,2 millions de cristaux, dont 380 000 candidats stables. En 2024, les chimistes Anthony Cheetham et Ram Seshadri ont répondu n'avoir trouvé aucun composé vraiment nouveau, et que l'article liste des composés proposés plutôt que de nouveaux matériaux."},"  des solutions existantes."},"no":null,"s":null,"st":"adv","k":0,"adv":1,"year":2026,"ast":"accepted","ai":1,"ar":[{"t":"Semi-Autonomous Mathematics Discovery with Gemini: A Case Study on the Erdős Problems","u":"https://arxiv.org/abs/2601.22401","a":"arXiv","y":2026},{"t":"Erdős problems","u":"https://en.wikipedia.org/wiki/Erd%C5%91s_problems","a":"Wikipedia (en)","y":null},{"t":"Why the Legendary Erdős Problems Are Falling to AI","u":"https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803","a":"Quanta Magazine","y":2026}],"ck":"2026-11-20","subs":[132,129,58],"t":false,"x":-0.974,"y":0.106,"f":null,"ia":[]},{"id":"unit-distance-disproof","qq":{"en":"Erdős unit distance conjecture: a counterexample announced","fr":"Conjecture des distances unité d'Erdős : un contre-exemple annoncé"},"nmm":{"fr":"Conjecture des distances…","en":"Erdős unit distance…"},"cc":{"en":"On 20 May 2026 OpenAI announced that an internal model disproved Erdős's 1946 unit distance conjecture. According to Quanta, nine mathematicians commented on the proof, Tim Gowers said he would have recommended acceptance at the Annals of Mathematics, and humans improved the result within weeks. We found no formal verification.","fr":"Le 20 mai 2026, OpenAI a annoncé qu'un modèle interne avait réfuté la conjecture des distances unité d'Erdős (1946). Selon Quanta, neuf mathématiciens ont commenté la preuve, Tim Gowers aurait recommandé son acceptation aux Annals of Mathematics, et des humains ont amélioré le résultat en quelques semaines. Nous n'avons pas trouvé de vérification formelle."},"no":null,"s":null,"st":"adv","k":0,"adv":1,"year":2026,"ast":"claimed","ai":1,"ar":[{"t":"Why the Legendary Erdős Problems Are Falling to AI","u":"https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803","a":"Quanta Magazine","y":2026}],"ck":"2026-11-20","subs":[132,133,58],"t":false,"x":-0.876,"y":0.042,"f":null,"ia":[]}],"SRC":{"science2005":{"n":{"f an","rung_short_experts":"Experts","rung_short_peer":"Peer review","rung_short_accepted":"Accepted","cl_btn":"Claims","cl_kicker":"Scientific watch · Register","cl_title":"Claims under verification","cl_intro":"An announcement is not a proof. Five steps separate a claim from an established result, based on the sources we read.","cl_close":"Close","cl_rail_t":"Claims","cl_rail_all":"{n} tracked →","cl_dock":"Claims under review","cl_dock_short":"Claims","cl_tab_tracked":"Tracked","cl_tab_inbox":"Detected","cl_sum_yes":"{y}/5 established","cl_sum_yes_p":"{y}/5 established","cl_sum_part":"{p} partly","cl_primary":"primary source","cl_update":"Report an update or source","cl_open_detail":"Open verification","cl_inbox_h_date":"Date","cl_inbox_h_src":"Source","cl_inbox_h_title":"Detected paper or report","cl_inbox_tag":"Unverified","cl_new_t":"Recently detected, not yet assessed","cl_new_note":"Found automatically in public feeds (arXiv, press) on {d}. None is verified: open the source before believing it.","cl_none":"None for now.","cl_q":"On the map","cl_back":"← All claims","fc_t":"Forecast (no money):","fc_your":"How likely is it? Your estimate:","fc_save":"Save","fc_saved":"Your estimate: {p}%, saved on this device.","fc_all":"All participants","fc_wt":"Weighted by track record","fc_n":"{n} participants","fc_few":"Not enough participants yet (minimum {m}) to show a shared estimate.","fc_offline":"The forecast server is not connected yet: your estimate stays on this device.","fc_flag":"Unusual activity detected: rely on the weighted estimate instead.","fc_closes":"Resolved by {d} at the latest.","fc_sent":"Sent.","fc_err":"Sending failed. Try again.","fc_work":"Small computation running (anti-bot)…","fc_score":"Resolved: {o}. Your calibration score: {b} (0 = perfect, 1 = worst).","fc_yes":"yes","fc_no":"no","fc_how":"How we limit bots","fc_how_p":"A device counts once per question. A small computation is required on submission, and submissions per network are limited. An estimate from a new device carries very little weight until it has a track record on resolved questions, and the track-record-weighted estimate is the one to rely on. The median resists extreme values. None of this is foolproof: without accounts, a patient bot army can still build a track record."}},"IA":[{"id":"riemann-anthropic-zeros","q":["riemann"],"st":"assisted","date":"2026-08-10","title":{"fr":"Riemann : plus de zéros sur la droite critique (Anthropic)","en":"Riemann: more zeros on the critical line (Anthropic)"},"fr":"Le 10 août 2026, Anthropic a annoncé qu'un modèle de recherche non publié avait relevé la borne prouvée de la proportion de zéros de la fonction zêta situés sur la droite critique, de 41,6 % à 67,2 %. C'est un résultat partiel : Anthropic dit explicitement ne pas avoir prouvé l'hypothèse de Riemann et ne pas s'attendre à ce que la technique la résolve. Des mathématiciens d'Anthropic ont vérifié le résultat, une formalisation en Lean est publique, et deux experts extérieurs (Conrey et Goldston) ont regardé l'article dans un délai court. Nous n'avons pas trouvé d'évaluation par les pairs terminée.","en":"On 10 August 2026 Anthropic announced that an unreleased research model had raised the proven lower bound for the proportion of zeta zeros on the critical line from 41.6% to 67.2%. This is a partial result: Anthropic explicitly says it did not prove the Riemann hypothesis and does not expect the technique to resolve it. Anthropic mathematicians checked it, a Lean formalisation is public, and two outside experts (Conrey and Goldston) looked at the paper at short notice. We found no completed peer review.","r":[{"t":"Riemann zeta (announcement)","u":"https://www.anthropic.com/news/riemann-zeta","a":"Anthropic","y":2026},{"t":"An unreleased Anthropic model made progress on one of maths' biggest unsolved problems","u":"https://techcrunch.com/2026/08/11/an-unreleased-anthropic-model-made-progress-on-one-of-maths-biggest-unsolved-problems/","a":"TechCrunch","y":2026}],"checked":"2026-11-20","lad":[{"k":"announced","s":"yes","note":{"fr":"Annonce d'Anthropic (source primaire), reprise par TechCrunch.","en":"Anthropic's announcement (primary source), covered by TechCrunch."},"src":[{"t":"Anthropic","u":"https://www.anthropic.com/news/riemann-zeta","pub":"Anthropic","primary":true},{"t":"TechCrunch","u":"https://techcrunch.com/2026/08/11/an-unreleased-anthropic-model-made-progress-on-one-of-maths-biggest-unsolved-problems/","pub":"TechCrunch","primary":false}],"n":2},{"k":"formal","s":"yes","note":{"fr":"Formalisation Lean publique selon Anthropic ; TechCrunch le rapporte aussi.","en":"Public Lean formalisation according to Anthropic; TechCrunch reports it too."},"src":[{"t":"Anthropic","u":"https://www.anthropic.com/news/riemann-zeta","pub":"Anthropic","primary":true},{"t":"TechCrunch","u":"https://techcrunch.com/2026/08/11/an-unreleased-anthropic-model-made-progress-on-one-of-maths-biggest-unsolved-problems/","pub":"TechCrunch","primary":false}],"n":2},{"k":"experts","s":"partial","note":{"fr":"Deux experts extérieurs (Conrey, Goldston) ont regardé l'article dans un délai court ; pas d'avis public détaillé trouvé.","en":"Two outside experts (Conrey, Goldston) looked at the paper at short notice; no detailed public opinion found."},"src":[{"t":"Anthropic","u":"https://www.anthropic.com/news/riemann-zeta","pub":"Anthropic","primary":true}],"n":1},{"k":"peer","s":"unknown","note":{"fr":"Aucune publication évaluée par des pairs trouvée.","en":"No peer-reviewed publication found."},"src":[],"n":0},{"k":"accepted","s":"unknown","note":{"fr":"Pas de déclaration du Clay trouvée (le résultat est partiel, il ne résout pas Riemann).","en":"No Clay statement found (the result is partial and does not resolve Riemann)."},"src":[],"n":0}],"fc":{"q":{"fr":"Le résultat à 67,2 % sera-t-il publié dans une revue à comité de lecture avant le 31 décembre 2027 ?","en":"Will the 67.2% result be published in a peer-reviewed journal by 31 December 2027?"},"closes":"2027-12-31","rung":"peer","outcome":null}},{"id":"riemann-openai-quasi","q":["riemann"],"st":"claimed","date":"2026-10-07","title":{"fr":"Riemann : l'« hypothèse de quasi-Riemann » (OpenAI)","en":"Riemann: the “quasi-Riemann hypothesis” (OpenAI)"},"fr":"Début octobre 2026, OpenAI a publié 722 manuscrits issus d'un modèle interne non publié, dont « The Quasi-Riemann Hypothesis », sur une région sans zéros pour des fonctions L. D'après Quanta, une version place les zéros entre 1/8 et 7/8 (199 pages, vérifiée en Lean) et une autre entre 1/12 et 11/12 (49 pages, éditée par des humains, pas encore vérifiée en Lean) ; une presse relève un écart entre ces chiffres que nous n'avons pas pu lever. Les experts jugent le résultat plutôt correct, mais Peter Sarnak ne l'appelle pas théorème avant vérification humaine des détails, et Will Sawin et Thomas Bloom doutent qu'il mène jusqu'à la droite 1/2. Ce n'est pas l'hypothèse de Riemann.","en":"In early October 2026 OpenAI released 722 manuscripts from an unreleased internal model, including “The Quasi-Riemann Hypothesis”, about a zero-free region for L-functions. According to Quanta, one version puts the zeros between 1/8 and 7/8 (199 pages, Lean-verified) and another between 1/12 and 11/12 (49 pages, human-edited, not yet Lean-verified); one outlet notes a mismatch between these figures that we could not resolve. Experts largely think the result is correct, but Peter Sarnak will not call it a theorem until humans check the details, and Will Sawin and Thomas Bloom doubt it reaches the 1/2 line. This is not the Riemann hypothesis.","r":[{"t":"AI proved the quasi-Riemann hypothesis. What happens now?","u":"https://quantamagazine.org/ai-proved-the-quasi-riemann-hypothesis-what-happens-now-20261019","a":"Quanta Magazine","y":2026},{"t":"OpenAI Solves Quasi Riemann Hypothesis: Understand What It Means","u":"https://officechai.com/ai/quasi-riemann-hypothesis-explanation/","a":"OfficeChai","y":2026}],"checked":"2026-11-20","lad":[{"k":"announced","s":"yes","note":{"fr":"Publiée début octobre 2026 ; rapportée par Quanta et OfficeChai.","en":"Released in early October 2026; reported by Quanta and OfficeChai."},"src":[{"t":"Quanta Magazine","u":"https://quantamagazine.org/ai-proved-the-quasi-riemann-hypothesis-what-happens-now-20261019","pub":"Quanta Magazine","primary":false},{"t":"OfficeChai","u":"https://officechai.com/ai/quasi-riemann-hypothesis-explanation/","pub":"OfficeChai","primary":false}],"n":2},{"k":"formal","s":"partial","note":{"fr":"Une version (1/8–7/8) serait vérifiée en Lean, l'autre (1/12–11/12) pas encore ; les chiffres divergent selon les sources.","en":"One version (1/8–7/8) is reported Lean-verified, the other (1/12–11/12) not yet; figures differ between sources."},"src":[{"t":"Quanta Magazine","u":"https://quantamagazine.org/ai-proved-the-quasi-riemann-hypothesis-what-happens-now-20261019","pub":"Quanta Magazine","primary":false}],"n":1},{"k":"experts","s":"partial","note":{"fr":"Les experts jugent le résultat plutôt correct, mais Sarnak attend une vérification humaine des détails.","en":"Experts largely think it is correct, but Sarnak waits for humans to check the details."},"src":[{"t":"Quanta Magazine","u":"https://quantamagazine.org/ai-proved-the-quasi-riemann-hypothesis-what-happens-now-20261019","pub":"Quanta Magazine","primary":false}],"n":1},{"k":"peer","s":"unknown","note":{"fr":"Aucune publication évaluée par des pairs trouvée (OfficeChai : non relu par des pairs).","en":"No peer-reviewed publication found (OfficeChai: not peer reviewed)."},"src":[{"t":"OfficeChai","u":"https://officechai.com/ai/quasi-riemann-hypothesis-explanation/","pub":"OfficeChai","primary":false}],"n":1},{"k":"accepted","s":"unknown","note":{"fr":"Pas de déclaration du Clay trouvée ; ce n'est pas l'hypothèse de Riemann.","en":"No Clay statement found; this is not the Riemann hypothesis."},"src":[],"n":0}],"fc":{"q":{"fr":"Des experts indépendants confirmeront-ils publiquement la quasi-hypothèse de Riemann avant le 30 juin 2027 ?","en":"Will independent experts publicly confirm the quasi-Riemann hypothesis by 30 June 2027?"},"closes":"2027-06-30","rung":"experts","outcome":null}},{"id":"riemann-alpoge-claim","q":["riemann"],"st":"claimed","date":"2026-11-20","title":{"fr":"Riemann : une preuve annoncée avec Claude, non vérifiée","en":"Riemann: a proof announced with Claude, unverified"},"fr":"Le 20 novembre 2026, le mathématicien Levent Alpöge (Anthropic) a mis en ligne une note de 4 pages où il dit croire avoir trouvé, avec Claude, une preuve de l'hypothèse de Riemann et de sa version généralisée, avec des fichiers Lean. D'après l'AFP et OfficeChai, cette annonce n'est vérifiée par personne : aucun expert extérieur ne l'a confirmée, il n'y a pas d'article, et on ne sait pas si l'énoncé Lean traduit fidèlement l'hypothèse de Riemann ni si les fichiers compilent. Nous n'avons pas pu lire la note elle-même. L'institut Clay n'a rien dit, et ses règles exigent une publication évaluée par les pairs puis deux ans d'examen. À traiter comme une revendication, pas comme un résultat.","en":"On 20 November 2026 mathematician Levent Alpöge (Anthropic) posted a 4-page note saying he believes he found, working with Claude, a proof of the Riemann hypothesis and its generalised version, with Lean files. According to AFP and OfficeChai, nobody has verified this: no outside expert has confirmed it, there is no paper, and it is unclear whether the Lean statement faithfully encodes the Riemann hypothesis or whether the files build. We could not read the note itself. The Clay Institute has said nothing, and its rules require peer-reviewed publication followed by two years of scrutiny. Treat it as a claim, not a result.","r":[{"t":"Anthropic researcher says Claude solved math's greatest riddle","u":"https://www.france24.com/en/live-news/20261120-anthropic-researcher-says-claude-solved-math-s-greatest-riddle","a":"France 24 (AFP)","y":2026},{"t":"Claimed Riemann Hypothesis Proof Made With Claude Appears On Anthropic Mathematician Levent Alpöge's Website","u":"https://officechai.com/ai/claimed-riemann-hypothesis-proof-made-with-claude-appears-on-anthropic-mathematician-levent-alpoges-website/","a":"OfficeChai","y":2026}],"checked":"2026-11-20","lad":[{"k":"announced","s":"yes","note":{"fr":"Note publiée le 20 novembre 2026, rapportée par l'AFP et OfficeChai (note elle-même non lue).","en":"Note posted on 20 November 2026, reported by AFP and OfficeChai (the note itself not read)."},"src":[{"t":"France 24 (AFP)","u":"https://www.france24.com/en/live-news/20261120-anthropic-researcher-says-claude-solved-math-s-greatest-riddle","pub":"AFP","primary":false},{"t":"OfficeChai","u":"https://officechai.com/ai/claimed-riemann-hypothesis-proof-made-with-claude-appears-on-anthropic-mathematician-levent-alpoges-website/","pub":"OfficeChai","primary":false}],"n":2},{"k":"formal","s":"unknown","note":{"fr":"Des fichiers Lean sont annoncés ; on ne sait pas s'ils compilent ni si l'énoncé traduit bien l'hypothèse de Riemann.","en":"Lean files are announced; unknown whether they build or state the Riemann hypothesis correctly."},"src":[{"t":"OfficeChai","u":"https://officechai.com/ai/claimed-riemann-hypothesis-proof-made-with-claude-appears-on-anthropic-mathematician-levent-alpoges-website/","pub":"OfficeChai","primary":false}],"n":1},{"k":"experts","s":"no","note":{"fr":"Aucun expert extérieur n'a confirmé, selon l'AFP et OfficeChai.","en":"No outside expert has confirmed it, according to AFP and OfficeChai."},"src":[{"t":"France 24 (AFP)","u":"https://www.france24.com/en/live-news/20261120-anthropic-researcher-says-claude-solved-math-s-greatest-riddle","pub":"AFP","primary":false},{"t":"OfficeChai","u":"https://officechai.com/ai/claimed-riemann-hypothesis-proof-made-with-claude-appears-on-anthropic-mathematician-levent-alpoges-website/","pub":"OfficeChai","primary":false}],"n":2},{"k":"peer","s":"no","note":{"fr":"Pas d'article : seulement une note de 4 pages.","en":"No paper: only a 4-page note."},"src":[{"t":"OfficeChai","u":"https://officechai.com/ai/claimed-riemann-hypothesis-proof-made-with-claude-appears-on-anthropic-mathematician-levent-alpoges-website/","pub":"OfficeChai","primary":false}],"n":1},{"k":"accepted","s":"unknown","note":{"fr":"Pas de déclaration du Clay trouvée.","en":"No Clay statement found."},"src":[],"n":0}],"fc":{"q":{"fr":"Des experts indépendants confirmeront-ils publiquement la preuve annoncée de l'hypothèse de Riemann avant le 30 juin 2027 ?","en":"Will independent experts publicly confirm the announced proof of the Riemann hypothesis by 30 June 2027?"},"closes":"2027-06-30","rung":"experts","outcome":null}},{"id":"navier-stokes-openai","q":["navier-stokes"],"st":"claimed","date":"2026-09-08","title":{"fr":"Navier-Stokes : une singularité annoncée par OpenAI","en":"Navier–Stokes: a singularity announced by OpenAI"},"fr":"Le 8 septembre 2026, OpenAI a annoncé qu'un groupe d'agents d'IA, tournant sur un modèle non public, avait trouvé une singularité dans les équations de Navier-Stokes en trois dimensions. Selon Quanta Magazine, le résultat a été vérifié dans le langage de preuve Lean ; il reste à des humains de vérifier que l'énoncé Lean correspond bien à ce qu'on voulait démontrer. Ce n'est pas encore un résultat accepté : l'institut Clay classe toujours le problème comme « actif » et n'a rien attribué (consulté en novembre 2026), la priorité est discutée, et nous n'avons pas trouvé d'examen par des pairs. Plus tôt, en septembre 2025, une équipe menée par DeepMind avait utilisé des réseaux de neurones pour trouver des singularités instables dans d'autres équations (milieux poreux, Euler avec bord), pas dans Navier-Stokes.","en":"On 8 September 2026 OpenAI announced that a group of AI agents, running on a model that is not public, had found a singularity in the three-dimensional Navier–Stokes equations. According to Quanta Magazine, the result has been checked in the Lean proof language; humans still have to check that the Lean statement matches what was meant to be proved. This is not an accepted result yet: the Clay Institute still lists the problem as “Active” and has awarded nothing (consulted November 2026), priority is disputed, and we found no peer review. Earlier, in September 2025, a DeepMind-led team used neural networks to find unstable singularities in other equations (porous media, Euler with a boundary), not in Navier–Stokes.","r":[{"t":"AI Has Solved One of Math's $1 Million Millennium Prize Problems","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","a":"Konstantin Kakaes, Quanta Magazine","y":2026},{"t":"Navier–Stokes equation (Millennium Prize Problems)","u":"https://www.claymath.org/millennium/navier-stokes-equation/","a":"Clay Mathematics Institute","y":null},{"t":"Discovery of Unstable Singularities","u":"https://arxiv.org/abs/2509.14185","a":"Wang, Bennani, Martens et al. (arXiv preprint)","y":2025}],"checked":"2026-11-20","lad":[{"k":"announced","s":"yes","note":{"fr":"Annoncé le 8 septembre 2026 (page d'OpenAI non lue : accès refusé).","en":"Announced on 8 September 2026 (OpenAI's own page not read: access denied)."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","pub":"Quanta Magazine","primary":false},{"t":"Science News","u":"https://www.sciencenews.org/article/ai-math-puzzle-navier-stokes-openai","pub":"Science News","primary":false}],"n":2},{"k":"formal","s":"partial","note":{"fr":"Une vérification Lean est rapportée par Quanta ; des humains doivent encore vérifier que l'énoncé correspond au problème.","en":"A Lean check is reported by Quanta; humans still have to check that the statement matches the problem."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/ai-has-solved-one-of-maths-1-million-millennium-prize-problems-20260908/","pub":"Quanta Magazine","primary":false}],"n":1},{"k":"experts","s":"no","note":{"fr":"Pas d'examen d'experts indépendants trouvé ; le physicien Gregory Eyink dit que personne ne l'a vérifiée côté humain.","en":"No independent expert review found; physicist Gregory Eyink says nobody has verified it on the human side."},"src":[{"t":"Science News","u":"https://www.sciencenews.org/article/ai-math-puzzle-navier-stokes-openai","pub":"Science News","primary":false}],"n":1},{"k":"peer","s":"unknown","note":{"fr":"Aucune publication évaluée par des pairs trouvée.","en":"No peer-reviewed publication found."},"src":[],"n":0},{"k":"accepted","s":"no","note":{"fr":"Le Clay classe toujours le problème « actif » et n'a rien attribué.","en":"The Clay Institute still lists the problem as “Active” and has awarded nothing."},"src":[{"t":"Clay Mathematics Institute","u":"https://www.claymath.org/millennium/navier-stokes-equation/","pub":"Clay Mathematics Institute","primary":true}],"n":1}],"fc":{"q":{"fr":"Le résultat d'OpenAI sur Navier-Stokes sera-t-il publié dans une revue à comité de lecture avant le 31 décembre 2027 ?","en":"Will OpenAI's Navier–Stokes result be published in a peer-reviewed journal by 31 December 2027?"},"closes":"2027-12-31","rung":"peer","outcome":null}},{"id":"erdos-gemini","q":[],"st":"assisted","date":"2026-01-29","title":{"fr":"Problèmes d'Erdős : un tri par Gemini","en":"Erdős problems: a sweep by Gemini"},"fr":"Des chercheurs de Google DeepMind ont fait évaluer par Gemini 700 conjectures marquées « ouvertes » dans la base de Thomas Bloom (problèmes d'Erdős), puis fait examiner les résultats par des experts humains. Sur 13 problèmes marqués ouverts, 5 ont reçu une solution apparemment nouvelle et autonome, et 8 se sont révélés déjà résolus dans la littérature. Les auteurs mettent en garde contre le « plagiat inconscient » de l'IA et notent que ces problèmes étaient « ouverts par obscurité plutôt que par difficulté ».","en":"Google DeepMind researchers had Gemini evaluate 700 conjectures marked “open” in Thomas Bloom's database of Erdős problems, then had human experts examine the results. Of 13 problems marked open, 5 received seemingly novel autonomous solutions and 8 turned out to be already solved in the literature. The authors warn about the AI's “subconscious plagiarism” and note that these problems were open “through obscurity rather than difficulty”.","r":[{"t":"Semi-Autonomous Mathematics Discovery with Gemini: A Case Study on the Erdős Problems","u":"https://arxiv.org/abs/2601.22401","a":"Feng, ..., Luong (arXiv preprint)","y":2026}],"checked":"2026-11-20","lad":[],"fc":null},{"id":"erdos-quanta","q":[],"st":"assisted","date":"2026-08-03","title":{"fr":"Problèmes d'Erdős : ce qui tombe, et les pièges","en":"Erdős problems: what is falling, and the pitfalls"},"fr":"Selon Quanta, des amateurs et des laboratoires utilisent des modèles (GPT-5.2, Gemini, un modèle interne d'OpenAI) sur les problèmes d'Erdős. La base de Bloom compte, d'après l'article, 565 problèmes résolus et 652 ouverts. Le problème 728 a été résolu début 2026 avec GPT-5.2 Pro et vérifié avec l'outil Aristotle, sans travaux antérieurs trouvés. Mais le problème 333, annoncé résolu à Noël 2025, l'avait été par Erdős lui-même en 1977, et l'annonce a été retirée. Bloom dit aussi recevoir des textes de 100 à 200 pages « qu'aucun humain n'a lus ». Un article de DeepMind cité par Quanta affirme que son meilleur agent a résolu 9 problèmes sur 353 ouverts (nous n'avons pas lu cet article).","en":"According to Quanta, amateurs and labs are using models (GPT-5.2, Gemini, an internal OpenAI model) on the Erdős problems. Bloom's database counts, per the article, 565 solved and 652 open problems. Problem 728 was solved in early 2026 with GPT-5.2 Pro and checked with the Aristotle tool, with no prior work found. But problem 333, announced solved at Christmas 2025, had been solved by Erdős himself in 1977, and the announcement was withdrawn. Bloom also says he receives 100- to 200-page texts that “no human has read”. A DeepMind paper quoted by Quanta claims its best agent resolved 9 of 353 open problems (we have not read that paper).","r":[{"t":"Why the Legendary Erdős Problems Are Falling to AI","u":"https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803","a":"Konstantin Kakaes, Quanta Magazine","y":2026}],"checked":"2026-11-20","lad":[],"fc":null},{"id":"unit-distance-openai","q":[],"st":"claimed","date":"2026-05-20","title":{"fr":"Conjecture des distances unité d'Erdős : un contre-exemple annoncé","en":"Erdős unit distance conjecture: a counterexample announced"},"fr":"Le 20 mai 2026, OpenAI a annoncé qu'un modèle interne, non public, avait trouvé un contre-exemple à la conjecture des distances unité d'Erdős (1946). D'après Quanta, ce résultat n'était pas définitif : des mathématiciens l'ont nettement amélioré en quelques semaines, et un article de neuf mathématiciens commente la correction de la preuve. Quanta cite Timothy Gowers : s'il l'avait reçue d'un humain pour les Annals of Mathematics, il en aurait recommandé l'acceptation sans hésiter. Nous n'avons pas trouvé de vérification formelle ; nous n'avons lu que le compte rendu de Quanta.","en":"On 20 May 2026 OpenAI announced that an internal, non-public model had found a counterexample to Erdős's 1946 unit distance conjecture. According to Quanta, the result was not definitive: mathematicians substantially improved it within weeks, and a paper by nine mathematicians comments on the proof's correctness. Quanta quotes Timothy Gowers: had a human submitted it to the Annals of Mathematics, he would have recommended acceptance without hesitation. We found no formal verification; we only read Quanta's account.","r":[{"t":"Why the Legendary Erdős Problems Are Falling to AI","u":"https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803","a":"Konstantin Kakaes, Quanta Magazine","y":2026}],"checked":"2026-11-20","lad":[{"k":"announced","s":"partial","note":{"fr":"Annoncé le 20 mai 2026 ; nous n'avons lu que le compte rendu de Quanta (annonce d'OpenAI non lue).","en":"Announced on 20 May 2026; we only read Quanta's account (OpenAI's announcement not read)."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803","pub":"Quanta Magazine","primary":false}],"n":1},{"k":"formal","s":"unknown","note":{"fr":"Aucune vérification formelle trouvée.","en":"No formal verification found."},"src":[],"n":0},{"k":"experts","s":"partial","note":{"fr":"Neuf mathématiciens commentent la preuve dans un article d'accompagnement ; Gowers l'aurait recommandée aux Annals (selon Quanta).","en":"Nine mathematicians comment on the proof in a companion paper; Gowers would have recommended it to the Annals (per Quanta)."},"src":[{"t":"Quanta Magazine","u":"https://www.quantamagazine.org/why-the-legendary-erdos-problems-are-falling-to-ai-20260803","pub":"Quanta Magazine","primary":false}],"n":1},{"k":"peer","s":"unknown","note":{"fr":"Aucune publication évaluée par des pairs trouvée.","en":"No peer-reviewed publication found."},"src":[],"n":0},{"k":"accepted","s":"unknown","note":{"fr":"Pas de décision d'une instance trouvée.","en":"No decision by a body found."},"src":[],"n":0}],"fc":{"q":{"fr":"Le contre-exemple d'Erdős sur les distances unité sera-t-il publié dans une revue à comité de lecture avant le 31 décembre 2027 ?","en":"Will the unit distance counterexample be published in a peer-reviewed journal by 31 December 2027?"},"closes":"2027-12-31","rung":"peer","outcome":null}},{"id":"alphaevolve","q":["empilement","multiplication-matrices"],"st":"assisted","date":"2025-05-14","title":{"fr":"AlphaEvolve : records en empilement et en multiplication de matrices","en":"AlphaEvolve: records in sphere packing and matrix multiplication"},"fr":"Google DeepMind affirme qu'AlphaEvolve, un agent de programmation fondé sur Gemini, a trouvé un algorithme multipliant deux matrices complexes 4×4 avec 48 multiplications scalaires (mieux que Strassen, 1969, dans ce cadre) et une configuration de 593 sphères qui établit une nouvelle borne inférieure du nombre de contact en dimension 11. Sur plus de 50 problèmes ouverts, il aurait retrouvé l'état de l'art dans environ 75 % des cas et l'aurait amélioré dans 20 %. Ce sont des améliorations de bornes, pas des réponses aux questions elles-mêmes. Source : l'annonce du laboratoire (non relue par des pairs ici ; nous n'avons pas vérifié l'article associé).","en":"Google DeepMind says AlphaEvolve, a Gemini-powered coding agent, found an algorithm multiplying two 4×4 complex matrices with 48 scalar multiplications (better than Strassen, 1969, in that setting) and a configuration of 593 spheres setting a new lower bound for the kissing number in 11 dimensions. On more than 50 open problems it reportedly matched the state of the art about 75% of the time and improved it in 20%. These are improved bounds, not answers to the questions themselves. Source: the lab's own announcement (not peer-reviewed here; we did not check the associated paper).","r":[{"t":"AlphaEvolve: a Gemini-powered coding agent for designing advanced algorithms","u":"https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/","a":"AlphaEvolve team, Google DeepMind","y":2025}],"checked":"2026-11-20","lad":[],"fc":null},{"id":"alphafold","q":["repliement-proteines"],"st":"related","date":"2024-10-09","title":{"fr":"AlphaFold : prédire la forme des protéines","en":"AlphaFold: predicting protein shapes"},"fr":"AlphaFold prédit la structure en 3D d'une protéine à partir de sa séquence. D'après la page de DeepMind, les organisateurs du concours CASP14 ont reconnu en 2020 AlphaFold2 comme une solution au « problème du repliement », et Demis Hassabis et John Jumper ont reçu le prix Nobel de chimie 2024 (avec David Baker). Prédire la forme finale n'explique pas comment la protéine la trouve : la question de la carte reste donc ouverte. Sources : la page du laboratoire seulement (la page du prix Nobel n'a pas pu être lue).","en":"AlphaFold predicts a protein's 3D structure from its sequence. According to DeepMind's page, the CASP14 organisers recognised AlphaFold2 in 2020 as a solution to the “protein folding problem”, and Demis Hassabis and John Jumper were co-awarded the 2024 Nobel Prize in Chemistry (with David Baker). Predicting the final shape does not explain how the protein finds it, so the question on the map stays open. Sources: the lab's page only (the Nobel Prize page could not be read).","r":[{"t":"AlphaFold","u":"https://deepmind.google/science/alphafold/","a":"Google DeepMind","y":null}],"checked":"2026-11-20","lad":[],"fc":null}],"INBOX":{"at":"2026-11-21T09:19:12.058Z","items":[{"t":"Learning to Read Events for Exact State Tracking with Frozen Language Models","u":"https://arxiv.org/abs/2611.25211v1","src":"arXiv","d":"2026-11-18","score":2},{"t":"Colombo: A Frontier-to-Frontier Autoresearch System for Oracle-Based Optimization","u":"https://arxiv.org/abs/2611.23080v1","src":"arXiv","d":"2026-11-17","score":3},{"t":"The BMM symmetrising trace conjecture for all exceptional complex reflection groups","u":"https://arxiv.org/abs/2611.21912v1","src":"arXiv","d":"2026-11-16","score":3}]},"API":null,"R":null,"Y":{"y0":1990,"y1":2025,"n":36,"a":"JJKKJJJJKKKKKLLLLLLMLLLMMMMMMMMMMLLMIJJJJJJJJJKJKKKKLKLLKLLLLLLLLLLLKLKLDEEEFFGGHHIIJJJKKKKLLLLLLLLLLLLLKKLLHGGGHHHHHHIIIJJJJKKKKKLLLLLLLLMMLMMMHHHHHIIIIIJJJJKKKKLLLLLLLMNMNNNOOOMOEEEEEEEFFFGGHHIIIJJKKLLLMMMMMNNMMNNOIIJJJJJJKKKKKLLLLLMMMMMMMNNMMMMMMMMMHHHHHIIIIJJJKKKKLLLMMMMNNNNNNNNNMNNOHGHGHHIIIIJJJJKKKKLLLLMMMMMNNNNNNNNODDDEEEFFFGGGHHIJJKKKKLLLLLLLLLLLLLLLHHHHIHIIIIIJJJKKKKLLMLLMMLLMLLMLKLLLGGGGHHHHIIIJJJJJKKKKKKLLLLLLLLLLKKKLHHIIIIJJJJJJJJJKKKKKKKKKKKKJJJIIIIJJHGGGHHHHHHIIIIIJJJKKKKKLLLLLLLLLLLLMFFFGGGGHHHIIIJJJKKLMLLLLLMMMMMMMMPMMDDDEEEFFFGGGHHHIIIJJJKKK
