<script>window.ARC={"items":[{"id":"wow","titre":"Signal Wow!","desc":"signal radio puissant, à bande étroite et centré sur la raie à 21 centimètres, capté le 15 août 1977 par le radiotélescope de l'université d'État de l'Ohio","st":"non","year":1977,"wikis":43,"coord":[40.25111111111111,-83.04916666666666],"coordFrom":"lieu lié : observatoire radio de l'université d'État de l'Ohio","place":"observatoire radio de l'université d'État de l'Ohio","cls":"signal électrique","qid":"Q33297","x":"Le signal « Wow! » est un signal radio puissant, à bande étroite et centré sur la raie à 21 centimètres, capté le 15 août 1977 par le radiotélescope de l'université d'État de l'Ohio surnommé The Big Ear. D'origine inexpliquée, ce signal, qui a été capté pendant 72 secondes et n'a plus été détecté depuis, a fait l'objet d'une attention significative de la part des médias.","wiki":"https://fr.wikipedia.org/wiki/Signal_Wow!","img":"img/wow.jpg"},{"id":"voynich","titre":"Manuscrit de Voynich","desc":"manuscrit illustré écrit dans un alphabet inconnu par un auteur inconnu au XVe siècle","st":"non","year":1430,"wikis":66,"coord":[41.31161,-72.92722],"coordFrom":"lieu lié : bibliothèque Beinecke de livres rares et manuscrits","place":"bibliothèque Beinecke de livres rares et manuscrits","cls":"enluminure","qid":"Q179492","x":"Le manuscrit de Voynich est un livre illustré anonyme rédigé dans une écriture à ce jour non déchiffrée et une langue non identifiée.","wiki":"https://fr.wikipedia.org/wiki/Manuscrit_de_Voynich","img":"img/voynich.jpg"},{"id":"roanoke","titre":"Colonie de Roanoke","desc":"premier établissement anglais en Amérique, Caroline du Nord, États-Unis (1585-1590)","st":"non","year":1584,"wikis":40,"coord":[35.93694444444444,-75.7088888888889],"coordFrom":"coordonnées du sujet","place":"États-Unis","cls":"ville fantôme","qid":"Q59222","x":"La colonie de Roanoke sur l'île Roanoke dans la Caroline du Nord actuelle fut le tout premier établissement anglais en Amérique, financé et organisé par Sir Walter Raleigh pour le compte d'Élisabeth Ire d'Angleterre dans les années 1580.","wiki":"https://fr.wikipedia.org/wiki/Colonie_de_Roanoke","img":"img/roanoke.jpg"},{"id":"phaistos","titre":"Disque de Phaistos","desc":"tablette d'argile cuite découverte en Crète et couverte sur ses deux faces d'inscriptions minoennes spiralées non déchiffrées","st":"non","year":-1675,"wikis":41,"coord":[35.339166666666664,25.1375],"coordFrom":"lieu lié : musée archéologique d'Héraklion","place":"musée archéologique d'Héraklion","cls":"tablette d'argile","qid":"Q465338","x":"Le disque de Phaistos ou disque de Phaestos est un disque d'argile cuite découvert en 1908 par l'archéologue italien Luigi Pernier sur le site archéologique du palais minoen de Phaistos, en Crète. Il pourrait dater du milieu ou de la fin de l'âge du bronze minoen. Son diamètre est d'environ seize centimètres et il est couvert, sur ses deux faces, de hiéroglyphes imprimés à l'aide de poinçons. En tout, ce sont 241 signes, dont 45 différents, qui recouvrent le disque, en formant une spirale partant de l'extérieur vers le centre de l'objet. Son usage, sa signification et même son lieu de fabrication font l'objet d'âpres discussions. À ce jour, aucun autre objet similaire n'a été retrouvé.","wiki":"https://fr.wikipedia.org/wiki/Disque_de_Phaistos","img":"img/phaistos.jpg"},{"id":"dyatlov","titre":"Dyatlov Pass incident","desc":"1959 unsolved deaths in the Soviet Union","st":"exp","year":1959,"wikis":41,"coord":[61.75472222,59.46277778],"coordFrom":"coordonnées du sujet","place":"Oural du nord","cls":"incident","qid":"Q814484","x":"The Dyatlov Pass incident was an event in which nine Soviet ski hikers died in the northern part of the Ural Mountains ridge in the Russian SFSR on 1 or 2 February 1959 under undetermined circumstances. The experienced trekking group from the Ural Polytechnical Institute embarked on a difficult hike led by Igor Dyatlov, and had established a camp on the eastern slopes of Kholat Syakhl mountain. Overnight, the group cut their way out of their tent with knives and fled the campsite, inadequately dressed for the heavy snowfall, strong winds and extreme cold temperatures as low as −40 °C (−40 °F).","wiki":"https://en.wikipedia.org/wiki/Dyatlov_Pass_incident","img":"img/dyatlov.jpg"},{"id":"antikythere","titre":"Machine d'Anticythère","desc":"calculateur astronomique antique","st":"par","year":1901,"wikis":70,"coord":[35.864167,23.305],"coordFrom":"coordonnées du sujet","place":"musée national archéologique d'Athènes","cls":"artefact archéologique","qid":"Q182324","x":"La machine d'Anticythère, appelée également mécanisme d'Anticythère, est considérée comme le premier calculateur analogique antique permettant de calculer des positions astronomiques. C'est un mécanisme de bronze comprenant des dizaines de roues dentées, solidaires et disposées sur plusieurs plans. Il est garni de nombreuses inscriptions grecques.","wiki":"https://fr.wikipedia.org/wiki/Machine_d'Anticyth%C3%A8re","img":"img/antikythere.webp"},{"id":"tunguska","titre":"Événement de la Toungouska","desc":"Puissante explosion s'étant produite le 30 juin 1908 en Sibérie, en Russie","st":"exp","year":1908,"wikis":78,"coord":[60.916666666667,101.95],"coordFrom":"coordonnées du sujet","place":"Évenkie","cls":"explosion","qid":"Q125953","x":"L'événement de la Toungouska désigne un ensemble d'observations faites sur une puissante explosion qui s'est produite le 30 juin 1908 vers 7 h 14 heure locale en Sibérie centrale, dans l'Empire russe. Si l'hypothèse de l'entrée atmosphérique d'un météoroïde ne semble guère faire de doute, l'ensemble des observations et mesures comporte des inconnues et des contradictions qui ont amené à formuler des hypothèses totalement divergentes et parfois farfelues.","wiki":"https://fr.wikipedia.org/wiki/%C3%89v%C3%A9nement_de_la_Toungouska","img":null},{"id":"kryptos","titre":"Kryptos","desc":"page d'homonymie de Wikimédia","st":"non","year":1990,"wikis":25,"coord":[38.952255,-77.145773],"coordFrom":"coordonnées du sujet","place":"George Bush Center for Intelligence","cls":"texte chiffré","qid":"Q1345100","x":"Kryptos peut signifier :Kryptos est une sculpture de Jim Sanborn exposée à Langley (Virginie), au QG de la CIA.\nKryptos est un genre de mollusques.\nKryptos est un album d'Andreas Vollenweider (1998).\nKryptos est un groupe indien de heavy metal.","wiki":"https://fr.wikipedia.org/wiki/Kryptos","img":null},{"id":"beale","titre":"Beale ciphers","desc":"Set of three ciphertexts","st":"par","year":1885,"wikis":14,"coord":null,"coordFrom":null,"place":null,"cls":"texte chiffré","qid":"Q812923","x":"The Beale ciphers are a set of three ciphertexts, one of which allegedly states the location of a buried treasure of gold, silver and jewels estimated to be worth over $60 million as of January 2025. Comprising three ciphertexts, the first (unsolved) text describes the location, the second (solved) ciphertext accounts the content of the treasure, and the third (unsolved) lists the names of the treasure's owners and their next of kin.","wiki":"https://en.wikipedia.org/wiki/Beale_ciphers","img":null},{"id":"rongorongo","titre":"Rongorongo","desc":"écriture non déchiffrée de l'île de Pâques","st":"non","year":1700,"wikis":43,"coord":[-33,-71],"coordFrom":"lieu lié : Chili","place":"Chili","cls":"écriture non déchiffrée","qid":"Q209764","x":"Rongorongo est le nom donné à un système de signes gravés sur bois qui pourraient constituer soit une écriture, soit un moyen mnémotechnique pour des récitations de mythes ou de généalogies. Découvertes sur l'île de Pâques en 1864 par le missionnaire Eugène Eyraud[réf. nécessaire], ces inscriptions ont résisté à toutes les tentatives de déchiffrement.","wiki":"https://fr.wikipedia.org/wiki/Rongorongo","img":null},{"id":"lineara","titre":"Linéaire A","desc":"système d'écriture crétois indéchiffré","st":"non","year":-1800,"wikis":51,"coord":null,"coordFrom":null,"place":null,"cls":"écriture non déchiffrée","qid":"Q30972","x":"Le « linéaire A » est une écriture, encore non déchiffrée, qui fut utilisée dans la Crète ancienne à l'époque minoenne. C'est Arthur Evans au début du XXe siècle qui découvrit en Crète les vestiges de cette écriture, ainsi que des autres écritures anciennes, qu'il nomma respectivement « hiéroglyphes crétois », « linéaire A » et « linéaire B », de la plus ancienne à la plus récente. Le « linéaire A » apparaît au plus tôt vers 1900 av. J.-C., avant les invasions grecques. Il cesse d'être utilisé au plus tard vers 1400 av. J.-C., alors que les Mycéniens ont pris le contrôle de l'île et que le linéaire B est apparu ; une utilisation simultanée des deux systèmes graphiques est ponctuellement observée sur certains sites notamment dans le sud de la Crète.","wiki":"https://fr.wikipedia.org/wiki/Lin%C3%A9aire_A","img":null},{"id":"indus","titre":"Écriture de l'Indus","desc":"système d'écriture","st":"non","year":-2800,"wikis":45,"coord":null,"coordFrom":null,"place":null,"cls":"écriture non déchiffrée","qid":"Q601388","x":"Le terme écriture de l'Indus fait référence à des suites de symboles associées à la civilisation de la vallée de l'Indus, au cours de la période allant de 3200 à 1900 av. J.-C. La plupart des signes ont été trouvés sur des sceaux, bien qu'ils soient présents aussi sur une douzaine d'autres supports.","wiki":"https://fr.wikipedia.org/wiki/%C3%89criture_de_l'Indus","img":null},{"id":"danse","titre":"Épidémie dansante de 1518","desc":"cas de manie dansante à Strasbourg en 1518","st":"exp","year":1518,"wikis":45,"coord":[48.573333333333,7.7522222222222],"coordFrom":"lieu lié : Strasbourg","place":"Strasbourg","cls":"manie dansante","qid":"Q3295141","x":"L'épidémie dansante de 1518 est un épisode inexpliqué de manie dansante survenu au début du XVIe siècle à Strasbourg, alors ville impériale libre du Saint-Empire, au cœur de la plaine d'Alsace.","wiki":"https://fr.wikipedia.org/wiki/%C3%89pid%C3%A9mie_dansante_de_1518","img":null},{"id":"flannan","titre":"Phare des îles Flannan","desc":"phare au nord-ouest de l'Écosse","st":"non","year":1899,"wikis":13,"coord":[58.28811,-7.588285],"coordFrom":"coordonnées du sujet","place":"Royaume-Uni","cls":"phare","qid":"Q15217844","x":"Le phare des îles Flannan est un phare situé sur Eilean Mòr, une des îles Flannan, à l'ouest des Highlands en Écosse. C'est aussi le lieu d'une disparition mystérieuse, celle des trois gardiens du phare en 1900, peu de temps après leur installation.","wiki":"https://fr.wikipedia.org/wiki/Phare_des_%C3%AEles_Flannan","img":null},{"id":"celeste","titre":"Mary Celeste","desc":"navire retrouvé abandonné dans l'océan Atlantique en 1872","st":"non","year":1861,"wikis":40,"coord":[38.333333333333,-17.25],"coordFrom":"coordonnées du sujet","place":"Nouvelle-Écosse","cls":"brigantin","qid":"Q33209","x":"La Mary Celeste est un brick-goélette américain découvert abandonné au large des Açores le 4 décembre 1872. Le navire, qui a quitté New York un mois plus tôt, a le gréement endommagé et la cale partiellement inondée mais est toujours en état de naviguer. Sa cargaison d'alcool dénaturé est quasiment intacte tout comme l'intérieur des cabines mais aucun membre de son équipage n'est retrouvé. Le mystère entourant la disparition des marins n'a jamais été résolu et la Mary Celeste reste l'un des exemples les plus connus de vaisseau fantôme.","wiki":"https://fr.wikipedia.org/wiki/Mary_Celeste","img":null},{"id":"earhart","titre":"Amelia Earhart","desc":"American aviation pioneer (1897–disappeared 1937)","st":"non","year":null,"wikis":109,"coord":null,"coordFrom":null,"place":null,"cls":"être humain","qid":"Q3355","x":"Amelia Mary Earhart was an American aviator who became one of the most celebrated aviation pioneers.","wiki":"https://en.wikipedia.org/wiki/Amelia_Earhart","img":null},{"id":"oak","titre":"Oak Island mystery","desc":"Stories of buried treasure on Oak Island, Nova Scotia, Canada","st":"cls","year":null,"wikis":7,"coord":[44.5125,-64.2875],"coordFrom":"coordonnées du sujet","place":"île Oak","cls":"légende urbaine","qid":"Q29025921","x":"The Oak Island mystery refers to stories and legends about buried treasure and unexplained objects found on or near Oak Island in Nova Scotia, Canada. The site consists of digs by numerous individuals and groups of people. The original shaft, the location of which is unknown today, was dug by early explorers, and is known as \"the money pit\".","wiki":"https://en.wikipedia.org/wiki/Oak_Island_mystery","img":null},{"id":"taos","titre":"The Hum","desc":"Low-frequency noise not audible to all people","st":"cls","year":null,"wikis":19,"coord":null,"coordFrom":null,"place":null,"cls":"paranormal","qid":"Q992476","x":"\nThe Hum is a persistent and invasive low-frequency humming, rumbling, or droning noise audible to many, but not all, people in an area. Hums have been reported in many countries, including Australia, Canada, the United Kingdom, and the United States. They are sometimes named according to the locality where the problem has been particularly publicized, such as the \"Taos Hum\" in New Mexico and the \"Windsor Hum\" in Ontario.","wiki":"https://en.wikipedia.org/wiki/The_Hum","img":null},{"id":"hessdalen","titre":"Hessdalen lights","desc":"Unidentified phenomenon at Hessdalen valley in Norway","st":"deb","year":null,"wikis":20,"coord":[62.92611111,11.145],"coordFrom":"coordonnées du sujet","place":"Norvège","cls":"paranormal","qid":"Q1342583","x":"The Hessdalen lights are unidentified lights which have been observed in a 12-kilometre-long (7.5 mi) stretch of the Hessdalen valley in rural central Norway periodically since at least the 1930s.","wiki":"https://en.wikipedia.org/wiki/Hessdalen_lights","img":null},{"id":"nazca","titre":"Géoglyphes de Nazca","desc":"grandes figures tracées sur le sol au Pérou","st":"deb","year":-200,"wikis":67,"coord":[-14.6975,-75.135],"coordFrom":"coordonnées du sujet","place":"El Ingenio District","cls":"géoglyphe","qid":"Q2620036","x":"Les géoglyphes de Nazca, appelés communément lignes de Nazca, sont de grandes figures tracées sur le sol représentant des animaux stylisés ou de simples lignes longues de plusieurs kilomètres, visibles dans le désert de Nazca dans le sud du Pérou. Le sol sur lequel se dessinent ces géoglyphes est couvert de cailloux que l'oxyde de fer colore en rouge. En les ôtant, les Nazcas ont fait apparaître un sol gypseux grisâtre, découpant ainsi les contours des figures qu'ils traçaient.","wiki":"https://fr.wikipedia.org/wiki/G%C3%A9oglyphes_de_Nazca","img":null}],"codes":{"non":"Énigme non résolue","exp":"Explication proposée","par":"Partiellement expliqué","deb":"Débat en cours","cls":"À classer","fol":"Folklore","tem":"Témoignages non vérifiés","fau":"Canular documenté","fic":"Fiction d'auteur devenue croyance","leg":"Légende contemporaine"}}</script><script type="module" src="archives-3d.js"></script>
