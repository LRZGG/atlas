<script id="collection" type="application/json">{"items":[{"id":"mothman","titre":"Homme-papillon","desc":"créature légendaire","st":"tem","year":null,"wikis":37,"coord":[39.828175,-98.5795],"coordFrom":"lieu lié : États-Unis","place":"États-Unis","cls":"créature légendaire","qid":"Q746248","x":"L'homme-papillon, ou homme-phalène, est une prétendue créature ailée qui aurait été observée à Point Pleasant, petite ville située dans l'État de la Virginie-Occidentale, aux États-Unis, en 1966 et 1967.","wiki":"https://fr.wikipedia.org/wiki/Homme-papillon","img":"img/mothman.png"},{"id":"yeti","titre":"Yéti","desc":"être légendaire, créature mythique de l'Himalaya","st":"fol","year":null,"wikis":81,"coord":[28,84],"coordFrom":"lieu lié : Népal","place":"Népal","cls":"cryptide","qid":"Q129628","x":"Le yéti, également appelé « abominable homme des neiges », est une créature anthropomorphe du folklore du Népal, de l'Inde, du Bhoutan et du Tibet. Du fait de l'absence de preuve matérielle de son existence, la communauté scientifique le considère comme un être légendaire, un cryptide peut-être né de l'observation de fossiles de gigantopithèque par des populations himalayennes dépourvues de connaissances scientifiques. Des créatures équivalentes, grands primates ou « hommes sauvages », existent dans le folklore de plusieurs régions du monde, comme le Bigfoot en Amérique du Nord, l'Almasty dans le Caucase ou Basajaun au pays basque.","wiki":"https://fr.wikipedia.org/wiki/Y%C3%A9ti","img":"img/yeti.jpg"},{"id":"kappa","titre":"Kappa","desc":"dixième lettre de l'alphabet grec","st":"fol","year":null,"wikis":34,"coord":null,"coordFrom":null,"place":null,"cls":"taxon fictionnel","qid":"Q335140","x":"Kappa est la dixième lettre de l'alphabet grec, précédée par iota et suivie par lambda. Dérivée de la lettre kaf  de l'alphabet phénicien, elle est l'ancêtre de la lettre K de l'alphabet latin et de la lettre К de l'alphabet cyrillique.","wiki":"https://fr.wikipedia.org/wiki/Kappa","img":"img/kappa.jpg"},{"id":"nessie","titre":"Monstre du loch Ness","desc":"créature légendaire vivant dans le loch Ness, Écosse","st":"fau","year":null,"wikis":71,"coord":[57.2144,-4.57059],"coordFrom":"coordonnées du sujet","place":"Royaume-Uni","cls":"créature légendaire","qid":"Q49658","x":"Le monstre du loch Ness, que l'essor du tourisme a surnommé dans les années 1930 « Nessie » pour supprimer le côté effrayant qu'il avait jusque-là, est une créature lacustre légendaire supposée vivre, ou avoir vécu, dans le loch Ness, un lac des Highlands en Écosse.","wiki":"https://fr.wikipedia.org/wiki/Monstre_du_loch_Ness","img":"img/nessie.jpg"},{"id":"bermudes","titre":"Triangle des Bermudes","desc":"région maritime triangulaire située au nord-ouest de l'océan Atlantique","st":"leg","year":null,"wikis":102,"coord":[25,-71],"coordFrom":"coordonnées du sujet","place":"Royaume-Uni","cls":"légende urbaine","qid":"Q43708","x":"Le triangle des Bermudes est une zone géographique de l’océan Atlantique qui aurait été, selon une croyance répandue, le théâtre d’un grand nombre de disparitions. Néanmoins, cette rumeur se fonde surtout sur des informations erronées, embellies ou mal interprétées et non sur des preuves évidentes, le triangle ne présentant statistiquement parlant aucune anomalie. Ainsi, selon un rapport du World Wide Fund for Nature en 2013, le triangle des Bermudes ne fait pas partie des endroits les plus dangereux pour la navigation.","wiki":"https://fr.wikipedia.org/wiki/Triangle_des_Bermudes","img":"img/bermudes.png"},{"id":"dameblanche","titre":"Dame blanche","desc":"page d'homonymie de Wikimédia","st":"fol","year":null,"wikis":24,"coord":null,"coordFrom":null,"place":null,"cls":"entité mythique","qid":"Q2166642","x":"Dame blanche peut faire référence à :Dame blanche (légende), personnage de légende ou apparition fantomatique ;La Dame blanche (1825), opéra-comique en trois actes de François-Adrien Boieldieu sur un livret d'Eugène Scribe, inspiré du personnage précédent ;\nLa Dame blanche, réseau d’espionnage belge de la Première Guerre mondiale ;\nLa Dame blanche, peinture rupestre dans le massif du Brandberg en Namibie ;\nLa dame blanche, un dessert à base de glace vanille couverte de chocolat chaud ;\nLa Dame blanche, ouvrage de Christian Bobin, Gallimard, 2007 ;\nLa Dame Blanche, autre nom d'une espèce de chouette, l'Effraie des clochers.","wiki":"https://fr.wikipedia.org/wiki/Dame_blanche","img":"img/dameblanche.jpg"},{"id":"jersey","titre":"Jersey Devil","desc":"Legendary creature in North American folklore","st":"leg","year":null,"wikis":28,"coord":[39.828175,-98.5795],"coordFrom":"lieu lié : États-Unis","place":"États-Unis","cls":"créature légendaire","qid":"Q668330","x":"In South Jersey and Philadelphia folklore in the United States, the Jersey Devil, also known as the Leeds Devil, is a legendary creature, or cryptid, said to inhabit the forests of the New Jersey Pine Barrens in South Jersey. The creature is often described as a flying biped with hooves, but there are many variations. The common description is that of a bipedal kangaroo-like or wyvern-like creature with a horse- or goat-like head, leathery bat-like wings, horns, small arms with clawed hands, legs with cloven hooves, and a forked or barbed tail. It is also said that it has a strange elongated body and a thick tail. It has been reported to move quickly and is often described as emitting a high-pitched \"blood-curdling scream\".","wiki":"https://en.wikipedia.org/wiki/Jersey_Devil","img":null},{"id":"chupacabra","titre":"Chupacabra","desc":"créature fantastique d'Amérique latine","st":"leg","year":null,"wikis":55,"coord":null,"coordFrom":null,"place":null,"cls":"créature légendaire","qid":"Q183571","x":"Chupacabra, chupacabras au pluriel en espagnol, est une créature fantastique. Ses descriptions varient, mais on lui prête souvent des yeux rouges, deux trous pour les narines, une bouche avec des crocs saillants vers le haut et vers le bas et une apparence glabre. Elle possèderait deux marques arrondies à l'arrière de la croupe, de part et d'autre de la queue, ressemblant selon certains autochtones à une chauve-souris ou au prétendu extraterrestre de l'affaire de Roswell.","wiki":"https://fr.wikipedia.org/wiki/Chupacabra","img":null},{"id":"bigfoot","titre":"Bigfoot","desc":"créature légendaire, grande et poilue, aux allures de grand singe, qui habiterait les forêts d’Amérique du Nord","st":"tem","year":null,"wikis":68,"coord":[56,-109],"coordFrom":"lieu lié : Canada","place":"Canada","cls":"créature légendaire","qid":"Q44810","x":"Le Bigfoot ou Sasquatch est une créature légendaire qui vivrait au Canada et aux États-Unis. La multiplication des témoignages pourrait laisser penser qu'il ne s'agirait pas d'un individu, mais de plusieurs hypothétiques créatures.","wiki":"https://fr.wikipedia.org/wiki/Bigfoot","img":null},{"id":"banshee","titre":"Banshee","desc":"créature surnaturelle de la mythologie celte irlandaise","st":"fol","year":null,"wikis":49,"coord":null,"coordFrom":null,"place":null,"cls":"créature légendaire","qid":"Q273112","x":"Une banshee, banshie ou bean sí, est une créature féminine surnaturelle de la mythologie celtique irlandaise, considérée comme une magicienne ou une messagère de l'Autre monde. Elle est comparable à d'autres créatures mythologiques d'Europe.","wiki":"https://fr.wikipedia.org/wiki/Banshee","img":null},{"id":"wendigo","titre":"Wendigo","desc":"créature mystique amérindienne","st":"fol","year":null,"wikis":36,"coord":[47,-105],"coordFrom":"lieu lié : Amérique du Nord","place":"Amérique du Nord","cls":"personnage de la mythologie grecque","qid":"Q370801","x":"Le wendigo est une créature surnaturelle, maléfique et anthropophage, issue de la mythologie des Premières Nations algonquiennes du Canada, qui s'est étendue dans tout le folklore d'Amérique du Nord.","wiki":"https://fr.wikipedia.org/wiki/Wendigo","img":null},{"id":"kitsune","titre":"Renard dans la culture japonaise","desc":"renard dans la mythologie et le folklore japonais  considéré comme un messager des divinités","st":"fol","year":null,"wikis":46,"coord":[35,136],"coordFrom":"lieu lié : Japon","place":"Japon","cls":"taxon fictionnel","qid":"Q692111","x":"Dans la culture japonaise, le renard (狐, kitsune) tient une place importante : dans le cadre religieux il est, dans les croyances populaires du Japon, considéré comme un messager des divinités, et dans le folklore populaire transmis par le bouddhisme, il était considéré comme une créature surnaturelle dotée de pouvoirs de métamorphoses, d'illusions et de possessions.Son image est devenue un élément récurrent dans la littérature, le théâtre, si bien qu’elle est devenue prégnante dans l’imaginaire populaire au Japon, à l’international, notamment dans les pays hors Asie du Sud-Est, le terme « kitsune » désigne improprement, dans l'imaginaire populaire, un renard doté de pouvoirs magiques évoquant l'esthétique japonaise ou asiatique en général.","wiki":"https://fr.wikipedia.org/wiki/Renard_dans_la_culture_japonaise","img":null},{"id":"slender","titre":"Slender Man","desc":"personnage de fiction","st":"fic","year":2009,"wikis":39,"coord":null,"coordFrom":null,"place":null,"cls":"personnage du folklore","qid":"Q7540067","x":"Slender Man ou Slenderman est un personnage de fiction issu d'un mème Internet, créé sur le forum Something Awful par Victor Surge en 2009.","wiki":"https://fr.wikipedia.org/wiki/Slender_Man","img":null},{"id":"llorona","titre":"La Llorona","desc":"fantôme du folklore latino-américain","st":"fol","year":null,"wikis":32,"coord":[23,-102],"coordFrom":"lieu lié : Mexique","place":"Mexique","cls":"personnage du folklore","qid":"Q1866923","x":"La Llorona est un fantôme issu du folklore d'Amérique hispanique. Selon la légende, elle se présente comme l'âme en peine d'une femme ayant tué ses enfants, les cherchant après le regret dans la nuit près d'un fleuve ou d'un lac, effrayant ceux qui entendent ses cris de douleur perçants.","wiki":"https://fr.wikipedia.org/wiki/La_Llorona","img":null},{"id":"golem","titre":"Golem","desc":"être anthropomorphe animé du folklore juif","st":"fol","year":null,"wikis":53,"coord":[50.0875,14.421388888888888],"coordFrom":"lieu lié : royaume de Bohême","place":"royaume de Bohême","cls":"créature légendaire","qid":"Q215085","x":"Un golem est, dans la mystique puis la mythologie juive, un être artificiel, généralement humanoïde, fait d’argile, incapable de parole et dépourvu de libre-arbitre, façonné afin d’assister ou défendre son créateur.","wiki":"https://fr.wikipedia.org/wiki/Golem","img":null},{"id":"babayaga","titre":"Baba Yaga","desc":"figure marquante du conte russe","st":"fol","year":null,"wikis":68,"coord":null,"coordFrom":null,"place":null,"cls":"humanoïde mythique","qid":"Q187002","x":"Baba Yaga est une figure marquante de la mythologie slave. La Baba Yaga est la figure féminine surnaturelle la plus fréquente des contes slaves, elle n'existe nulle part ailleurs.","wiki":"https://fr.wikipedia.org/wiki/Baba_Yaga","img":null},{"id":"kraken","titre":"Kraken","desc":"monstre marin fantastique issue des légendes scandinaves médiévales","st":"fol","year":null,"wikis":52,"coord":null,"coordFrom":null,"place":null,"cls":"monstre marin","qid":"Q193165","x":"Le kraken est une créature fantastique issue des légendes scandinaves médiévales. Il s'agit d'un monstre marin de très grande taille et doté de nombreux tentacules.","wiki":"https://fr.wikipedia.org/wiki/Kraken","img":null},{"id":"mokele","titre":"Mokélé-mbembé","desc":"animal légendaire congolais","st":"tem","year":null,"wikis":38,"coord":null,"coordFrom":null,"place":null,"cls":"cryptide","qid":"Q555716","x":"Mokélé-mbembé est le nom donné par les Pygmées de la région des marais du Likwala à un animal légendaire supposé vivre, ou avoir vécu, dans les affluents du fleuve Congo qui sert de frontière naturelle entre la république du Congo et la république démocratique du Congo.","wiki":"https://fr.wikipedia.org/wiki/Mok%C3%A9l%C3%A9-mbemb%C3%A9","img":null},{"id":"tengu","titre":"Tengu","desc":"page d'homonymie de Wikimédia","st":"fol","year":null,"wikis":41,"coord":null,"coordFrom":null,"place":null,"cls":"humanoïde mythique","qid":"Q742360","x":"","wiki":"https://fr.wikipedia.org/wiki/Tengu","img":null},{"id":"thunderbird","titre":"Oiseau-tonnerre","desc":"créature mythologique","st":"fol","year":null,"wikis":31,"coord":null,"coordFrom":null,"place":null,"cls":"thunderbird","qid":"Q264471","x":"L’oiseau-tonnerre est une créature légendaire sous forme d'oiseau, commune aux religions de plusieurs populations amérindiennes d'Amérique du Nord. C'est un concept populaire dans l'art amérindien de la côte nord-ouest de l'Amérique du Nord, qui apparaît souvent sur les totems. Chez les Premières Nations de la côté ouest des États-Unis et du Canada, il est souvent associé à la baleine dans des récits de pêche abondante ou de tempêtes. Il est aussi considéré comme une créature de la cryptozoologie, issue de rapports d'observations de personnes qui décrivent avoir vu des oiseaux gigantesques dans le ciel américain.","wiki":"https://fr.wikipedia.org/wiki/Oiseau-tonnerre","img":null}],"codes":{"non":"Énigme non résolue","exp":"Explication proposée","par":"Partiellement expliqué","deb":"Débat en cours","cls":"À classer","fol":"Folklore","tem":"Témoignages non vérifiés","fau":"Canular documenté","fic":"Fiction d'auteur devenue croyance","leg":"Légende contemporaine"}}</script>
